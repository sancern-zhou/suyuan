knowledge:
  collections: []
  # Runtime resolves this exact name to the active graph-enabled KB id.
  # Deployments may override it with JIANGSU_STATION_FAULT_KB_ID.
  bindings:
    station_fault_diagnosis: 空气站运维知识
# 江苏部署仅加载下列项目自有任务，不加载共享定时任务。
scheduled_tasks_enabled: true
scheduled_tasks:
  - jiangsu_station_fault_diagnosis
