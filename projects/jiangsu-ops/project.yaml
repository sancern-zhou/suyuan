schema_version: 1
project: jiangsu-ops
modules:
  - legacy
frontend:
  theme: default
  brand_name: 江苏省运维审核管理服务平台
  features: {}
  # social 由江苏独立微信渠道驱动，不作为 Web 端手动切换的业务场景。
  agent_modes:
    - ops
    - jiangsu_query
    - knowledge
    - expert
    - smart_inspection
    - operations_analysis
    - device_control
    - station_fault_diagnosis
  default_agent_mode: ops
  # Web 首页由“苏小环”统筹场景承载；专业智能体保留为按需进入的二级工作区。
  agent_platform_layout: coordinator
  coordinator:
    name: 苏小环
    role: 江苏运维智能值班助手
    greeting: 今天需要我关注什么？
    description: 持续关注全省运维态势，组织专业能力完成取证、研判与任务闭环。
    placeholder: 可以问数据、查站点、诊断故障，或让我生成当前运维态势……
    station_image_url: /project-assets/jiangsu-ops/nanjing-demo-station.png
    default_mode: ops
    attention_task_ids:
      - jiangsu_station_fault_diagnosis
    quick_prompts:
      - label: 今日运维态势
        prompt: 汇总今天江苏全省的运维态势，重点说明异常站点、待审核事项和需要人工关注的风险。
        mode: smart_inspection
      - label: 重点异常站点
        prompt: 查询当前江苏全网异常概览，列出最值得优先关注的站点并说明依据。
        mode: smart_inspection
      - label: 人员轨迹分析
        prompt: 分析近30日运维人员任务轨迹，识别频繁跨市往返和可由属地人员替代的调度模式。
        mode: operations_analysis
      - label: 查询监测数据
        prompt: 查询江苏今天的空气质量数据，并先向我确认需要关注的城市或站点。
        mode: jiangsu_query
      - label: 查询知识库
        prompt: 从我有权访问的知识库中检索江苏运维规程，并说明命中文档和依据。
        mode: knowledge
    routes:
      - mode: device_control
        keywords: [反控, 空调, 阀门, 零气机, 校准仪, 设备控制]
      - mode: station_fault_diagnosis
        keywords: [断数, 恒值, 故障, 离线, 根因, 质控异常]
      - mode: operations_analysis
        keywords: [人员, 到站, 签到, 调度, 覆盖, 跨市]
      - mode: knowledge
        keywords: [知识库, 规程, 标准, 制度, 文档, 条款]
      - mode: expert
        keywords: [污染过程, 成因, 来源, 传输, 专家研判]
      - mode: jiangsu_query
        keywords: [查询, 数据, 浓度, 趋势, 排名, 图表, 同比]
      - mode: smart_inspection
        keywords: [巡检, 告警, 异常站点, 全网态势]
      - mode: ops
        keywords: [工单, 审核, 报告, 整改]
    workspace_blocks:
      - id: shift-briefing
        type: briefing
        title: 苏小环值班简报（场景演示）
        items:
          - label: 当前重点
            text: 优先关注持续断数、设备离线和证据不完整的站点异常事件。
          - label: 调度建议
            text: 结合任务轨迹、人员技能和属地覆盖识别跨市往返，具体调度结论待接入排班和路网信息后完善。
          - label: 闭环提醒
            text: AI 诊断和工单草案只作为待审核建议，处置结果需要人工确认和数据恢复复查。
      - id: demo-metrics
        type: metric-grid
        title: 关键指标组件（场景演示）
        items:
          - label: 在线监测站点
            value: --
            detail: 待接实时全网汇总
          - label: 今日到站人员
            value: --
            detail: 待接人员覆盖统计
          - label: 未闭环告警
            value: --
            detail: 待完善业务口径
          - label: 工单审核进度
            value: --
            detail: 待接审核任务状态
      - id: loop-status
        type: activity
        title: 业务闭环示意
        items:
          - label: 异常发现
            value: 自动触发
          - label: 苏小环取证与研判
            value: 自动执行
          - label: 工单草案审核
            value: 人工确认
          - label: 处置结果复查
            value: 持续跟踪
    # 在没有真实事件执行记录的演示环境中显示；所有条目均在界面明确标记“场景演示”。
    demo_attention_items:
      - id: demo-station-fault
        title: 源创包装厂房（1002A）· 颗粒物数据中断
        summary: 场景模拟：PM2.5、PM10 同时停止更新，苏小环已组织监测、告警和巡检证据进行初步研判。
        severity: high
        status: awaiting_review
        station: 源创包装厂房
        occurred_at: 场景时间 09:12
        diagnosis: 更可能是采集或传输链路异常，尚不能认定为分析仪故障。
        confidence: medium
        evidence:
          - 颗粒物同步断数
          - 其他气态污染物仍有数据
          - 尚缺通信日志
        actions:
          - label: 补充取证
            kind: ask
            prompt: 针对源创包装厂房站点（1002A）颗粒物数据中断场景，补查最近6小时五分钟数据、站房告警和历史工单，并更新证据时间线。
            mode: station_fault_diagnosis
          - label: 深入诊断
            kind: ask
            prompt: 进入故障诊断流程，分析源创包装厂房站点（1002A）颗粒物数据中断场景并形成处置方案。
            mode: station_fault_diagnosis
      - id: demo-personnel-mobility
        title: 近30日 · 跨市运维轨迹待优化
        summary: 场景模拟：部分任务存在频繁跨市往返，苏小环建议结合人员技能、属地覆盖和任务时效优化资源调配。
        severity: medium
        status: new
        occurred_at: 场景时间 今天
        diagnosis: 当前轨迹显示调度半径偏大，重点是优化技能匹配和就近派单，不代表人员规模本身不足。
        confidence: low
        evidence:
          - 模拟任务轨迹
          - 人员技能标签
          - 属地站点台账
        actions:
          - label: 分析跨市轨迹
            kind: ask
            prompt: 分析近30日运维人员任务轨迹，识别频繁跨市往返、属地替代机会和资源调配优化建议，并明确数据为场景模拟。
            mode: operations_analysis
  agent_mode_overrides:
    knowledge:
      name: 江苏知识问答智能体
      short_name: 知识问答
      description: 检索授权知识库和用户材料，并按需联网补充可追溯答案
      welcome:
        description: 面向江苏运维规程、标准制度、设备资料和业务文档，优先从授权知识库检索依据并给出可追溯回答。
        features:
          - 检索共享、本地和个人知识库中的授权资料
          - 阅读命中文档上下文和用户上传材料
          - 知识库证据不足时按需搜索并抓取公开网页
          - 区分知识库、用户材料和网络信息来源
        example: 例如：“根据知识库中的运维规程，颗粒物断数后应按什么顺序排查？”
      tags:
        - 江苏知识库
        - 来源追溯
    jiangsu_query:
      name: 江苏问数生图智能体
      short_name: 江苏问数生图
      description: 查询江苏省监测与气象数据、完成统计分析并生成专业图表
      welcome:
        description: 面向江苏省空气监测和气象数据，以自然语言完成查询、统计、趋势分析和可追溯图表生成。
        features:
          - 查询江苏省城市、区县和站点监测数据及气象数据
          - 完成趋势、对比、统计与异常线索整理
          - 将查询结果或用户提供的数据生成交互式与静态图表
          - 保留数据来源、查询口径和图表产物的可追溯关系
        example: 例如：“查询南京本月 PM2.5 日均趋势并生成折线图”
      tags:
        - 江苏数据
        - 问数生图
    ops:
      name: 工单审核模式
      short_name: 工单审核
      description: 按状态、节点、工单号等条件查询江苏故障工单，整理处置记录并辅助人工复核
      welcome:
        description: 面向江苏运维平台的故障工单查询和人工复核，明确数据范围、处置记录和待补充证据。
        features:
          - 免站点按工单号、创建时间、工单节点、节点状态、工单状态筛选待审核/进行中工单
          - 按完整工单号获取处置流转、故障项、检查项和设备流程详单
          - 按明确站点查询最近故障工单和历史处置记录
          - 核对工单状态、故障描述与处置过程
          - 标注接口失败、字段缺失和需要人工确认的风险点
          - 当前不支持工单流转操作
        example: 例如：“查一下目前待审核的故障工单有哪些”
      tags:
        - 工单查询
        - 人工复核
