version: 2
models:
- name: dim_station
  description: '江苏站点目录一致性维度表。一行 = 一个站点（全省 1509 站全量）， 随 jiangsu_ods.bsd_station 每 5 分钟同步后重建（交换式，无空窗）。 统一站点/城市维度：所有宽表的站点与城市归属都应经本表关联；
    bsd_city 的多层级 code 重复只在本表做一次 DISTINCT ON 去重。

    已知口径注意: 省控站统一口径（2026-10-14 治理约定）：is_active_provincial = 站点类型2 且启用 = 101 个站， 是全部查询入口共用的"省控站"定义；停用省控站
    4 个（3008A江阴南闸/3022A金坛建筑技工/ 3094A靖江靖城/5030A上方山）与超站 7099A、40 开头试点站均为 false; station_type_name 映射自源库
    air_province_bsd.sys_datadictionary(StationType 字典)； 运维记录不只覆盖省控站——省建站(type 6)与省乡镇站(type 7)同样有记录，按类型过滤用本列;
    city_name 按 areacode 前4位映射地级市；行政区划调整时依赖源库 bsd_city 更新; uniquecode 是质控等子系统关联键（qc_historyresult 无 stationcode，须经本表换算）;
    历史上历史站点（historycode/historyname 非空）仍按当前编码保留一行

    粒度: 一行 = 一个站点（station_code）'
  columns:
  - name: station_code
    description: 平台站点编码(主键口径)
    data_tests:
    - unique
    - not_null
  - name: station_name
    description: 站点名称(positionname)
  - name: uniquecode
    description: 站点唯一编码(质控等子系统关联键)
    data_tests:
    - not_null
  - name: city_code
    description: 城市行政区码(areacode)
  - name: city_name
    description: 城市名(已去重映射)
  - name: towncode
    description: 乡镇码
  - name: longitude
    description: 经度
  - name: latitude
    description: 纬度
  - name: address
    description: 地址
  - name: station_type_id
    description: 站点类型ID
  - name: station_type_name
    description: 站点类型名(映射自源库StationType字典
  - name: is_active_provincial
    description: 省控站统一口径位(布尔
  - name: status
    description: 启用状态
  - name: is_monitor
    description: 是否监测站
  - name: is_contrast
    description: 是否对照站
  - name: manager
    description: 管理人
  - name: builddate
    description: 建站日期
  - name: stoptime
    description: 停用时间
  - name: updatetime
    description: 源更新时间
  - name: synced_at
    description: 重建时间
- name: dim_device
  description: '江苏站点设备台账维度表。一行=一台登记设备（全省 1684 台，每日 02:30 全量重建， 源自 jiangsu_ods.bsd_device ← 源库 air_province_bsd.dbo.bsd_device）。
    用于站点设备构成核对、品牌型号与购置/启用日期查询。 替代已下线的 jiangsu_fetch_device_ledger 接口工具的公共台账查询。

    已知口径注意: device_stats 为平台设备状态原始枚举码，未做中文翻译；翻译口径待业务确认; 台账是"当前挂载快照"，生命周期事件（启用/故障/备机/维修/停用/报废）请查 mart_device_lifecycle_analysis（源自
    log_device+dev_scrap，2026-10-04 接入）； 备机更换及时性 P1 场景以该表的 DeviceSpare 流转为口径，不再是数据盲区; masterslavenum 源库
    100% 为空，仍无台账级备机身份字段; station_code 关联 dim 层与 mart_station_device_health 可补站点/城市维度

    粒度: 一行 = 一台设备（device_code）'
  columns:
  - name: device_code
    description: 设备编码(业务主键)
    data_tests:
    - unique:
        config:
          severity: warn
  - name: station_code
    description: 所属站点编码
  - name: assets_code
    description: 资产编码
  - name: device_type
    description: 设备类型码
  - name: device_type_name
    description: 设备类型名(如 O3分析仪
  - name: device_brand
    description: 品牌
  - name: device_model
    description: 型号
  - name: device_model_id
    description: 设备型号ID(数值
  - name: purchase_date
    description: 购置日期
  - name: use_date
    description: 启用日期
  - name: device_stats
    description: 设备状态码(原始枚举
  - name: calibrate
    description: 校准标记
  - name: original_machine
    description: 原始机器标记(语义待确认)
  - name: master_slave_num
    description: 主从机编号
  - name: quality_period
    description: 质保期
  - name: mainter_company
    description: 维护单位
  - name: custodian
    description: 保管人
  - name: warehouse
    description: 库房
  - name: price
    description: 价格
  - name: asset_ownership
    description: 资产权属
  - name: synced_at
    description: 重建时间
- name: mart_work_order_analysis
  description: '江苏故障工单分析数据集。一行=一张故障工单（2026-07-01 起，已作废单未纳入）。 含站点/城市/设备维度、工单流转时间、预计算指标（响应/处理/修复时长、超期、 30天重复故障）和创建前24h关联告警数。数据来自运维平台每日同步。

    已知口径注意: 范围仅故障工单：dbt 模型显式过滤 ordertype=''Fault''(2026-10-06 收敛)；例行单(巡检/现场检查/ 校准/质控等)与故障单同存于源表但不入本表，巡检任务项统计见
    mart_inspection_analysis。 本表工单量/时效结论均只代表故障单口径，不得表述为全部工单口径; 超期对故障单不可评估：故障单无计划完成时间(plan_finish_time
    2026-10 实测全空)， is_overdue/超期率恒为 0/false，不是"按期率高"；历史"超期率约85%"系含例行单旧口径，不得再引用。 长期未闭环可改用"处理中且未完成"口径统计;
    派单/到站为代理口径：CH_Check 节点开始=派单，首个 FaultProcess 开始=到站；派单缺失回退工单创建时间; 2小时响应(is_response_within_2h)：故障单均有到场节点(2026-10
    实测全量可评估)；当前流程数据中 CH_Check 与 FaultProcess 节点不同时出现，实际代理为创建→到站; 4小时处置(is_recover_within_4h)=数据恢复正常(业务口径
    2026-09-22 确认)，代理为触发告警解除： 取建单前24h~后1h内同站最近一条已解除告警，恢复耗时从告警发生起算；平台规则判定对 断数/恒值/超标类统一适用；约47%可评估(其余无已解除的关联告警,
    2026-10 实测)； 可评估单恢复均值约114小时为数据现状; 故障单均填写设备ID(2026-10 实测无缺失)，重复故障判定恒为"站点+设备"维度，见 repeat_fault_basis
    列; 窗口自 2026-07-01，更早历史不可查；同比/年度分析不支持

    粒度: 一行 = 一张故障工单（源表 mtc_WorkingOrder.Id）'
  columns:
  - name: id
    description: 工单源ID(主键)
    data_tests:
    - unique
    - not_null
  - name: working_order_code
    description: 工单号
  - name: order_title
    description: 工单标题
  - name: order_type
    description: 工单类型
  - name: order_status
    description: 状态原始值
  - name: order_status_cn
    description: 状态中文名
  - name: urgency_type
    description: 紧急程度
  - name: station_code
    description: 站点编码
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: station_name
    description: 站点名称
  - name: station_type_name
    description: 站点类型(经dim_station
  - name: city_code
    description: 城市行政区码
  - name: city_name
    description: 城市名
  - name: device_id
    description: 设备ID
  - name: operation_unit_id
    description: 运维单位ID
  - name: create_time
    description: 创建时间
  - name: dispatch_time
    description: 派单时间(代理=CH_Check开始
  - name: arrival_time
    description: 到站时间(代理=首个FaultProcess开始)
  - name: finish_time
    description: 完成时间
  - name: plan_finish_time
    description: 计划完成时间
  - name: current_point
    description: 当前流程节点
  - name: node_count
    description: 流转节点数
  - name: response_minutes
    description: 响应时长(分钟)
  - name: process_minutes
    description: 处理时长(分钟)
  - name: repair_minutes
    description: 修复时长(分钟)
  - name: is_response_within_2h
    description: 2小时内到站(布尔)
  - name: trigger_alarm_time
    description: 关联触发告警发生时间
  - name: recovery_time
    description: 数据恢复正常时间(触发告警解除时间)
  - name: recovery_hours
    description: 恢复耗时(小时)
  - name: is_recover_within_4h
    description: 4小时内数据恢复(布尔)
  - name: is_overdue
    description: 是否超期
  - name: is_repeat_fault
    description: 是否30天内重复故障
  - name: repeat_fault_basis
    description: 重复故障判定维度
  - name: repeat_count_30d
    description: 前30天同维度故障单数
  - name: alarm_count_1d
    description: 创建前24小时同站告警数(alm_summary)
  - name: source_updated_at
    description: 源系统最后更新时间
  - name: refreshed_at
    description: 本表刷新时间
- name: mart_alarm_event_analysis
  description: '江苏站点告警事件数据集。一行=一条站点告警（2026-07-01 起，源 alm_summary）。 含告警级别/状态（已翻译）、生命周期时间、持续与处理时长、是否未处理、
    告警后24小时内同站关联故障工单数（关联自 mart_work_order_analysis，仅Fault口径）。 用于告警分析、告警→工单转化、未处理告警督办。

    已知口径注意: 站点范围=省控站统一口径（启用的省控站 101 个，dim_station.is_active_provincial）； 停用省控站（3008A/3022A/3094A/5030A）与名录外站点不入本表（2026-10-14
    治理）; 仅含 alm_summary 站点告警；mot_alarm 平台监控告警无站点编码暂未纳入（需平台组确认 refid 语义）; alarmlevel 中文映射按平台惯例（urgent=紧急/secondary=中级/commonly=一般），待业务确认;
    ddalarmstate 1=未处理 3=已解除 已通过解除时间字段验证

    粒度: 一行 = 一条站点告警（alm_summary.Id）'
  columns:
  - name: id
    description: 告警源ID(主键)
    data_tests:
    - unique
    - not_null
  - name: station_code
    description: 站点编码
  - name: station_name
    description: 站点名称
  - name: city_name
    description: 城市名
  - name: device_id
    description: 设备ID
  - name: alarm_content
    description: 告警内容
  - name: alarm_level
    description: 级别原始值
  - name: alarm_level_cn
    description: 级别中文名
  - name: alarm_state
    description: 状态原始值
  - name: alarm_state_cn
    description: 状态中文
  - name: rule_type
    description: 告警规则类型
  - name: alarm_time
    description: 告警时间
  - name: handle_time
    description: 处理时间
  - name: remove_time
    description: 解除时间
  - name: duration_minutes
    description: 告警持续时长(分钟)
  - name: handle_minutes
    description: 处理时长(分钟)
  - name: is_unresolved
    description: 是否未处理
  - name: linked_work_orders_24h
    description: 告警后24h内同站新建工单数
  - name: source_updated_at
    description: 源最后更新时间
  - name: refreshed_at
    description: 本表刷新时间
- name: mart_station_device_health
  description: '江苏站点设备健康数据集。一行=一个站点（全省 1509 站全量，含无事件站点）。 汇总近30天故障工单/超期/重复故障/响应时长、近7天与30天告警、未处理告警数、 设备数及风险分级。工单侧统计基于
    mart_work_order_analysis，仅故障工单(Fault)口径， 例行单不计入。用于故障诊断优先级、全网健康概览。

    已知口径注意: risk_level 为代理规则（高=30天工单≥5且超期率≥50% 或 未处理告警≥10；中=工单≥3且超期率≥30% 或 未处理告警≥5；无事件=稳定），阈值待业务确认后可调整;
    超期率普遍偏高源于平台长期未闭环工单（见工单数据集 caveats）; avg_response_minutes_30d 依赖派单/到站代理口径，覆盖率约15%

    粒度: 一行 = 一个站点'
  columns:
  - name: station_code
    description: 站点编码(主键)
    data_tests:
    - unique
    - not_null
  - name: station_name
    description: 站点名称
  - name: city_name
    description: 城市名
  - name: station_status
    description: 站点启用状态
  - name: is_monitor
    description: 是否监测站
  - name: device_count
    description: 登记设备数
  - name: work_orders_30d
    description: 近30天工单数
  - name: overdue_orders_30d
    description: 近30天超期工单数
  - name: overdue_rate_30d
    description: 近30天超期率(0-1)
  - name: repeat_fault_orders_30d
    description: 近30天重复故障工单数
  - name: avg_response_minutes_30d
    description: 近30天平均响应时长(分钟)
  - name: alarms_7d
    description: 近7天告警数
  - name: alarms_30d
    description: 近30天告警数
  - name: unresolved_alarms
    description: 未处理告警累计数
  - name: last_alarm_time
    description: 最近告警时间
  - name: last_work_order_time
    description: 最近工单时间
  - name: risk_level
    description: 风险分级
  - name: refreshed_at
    description: 本表刷新时间
- name: mart_station_daily_profile
  description: '江苏站点日概况数据集。一行=站点×日（2026-07-01 起，仅含有活动记录的站点日）。 含当日新建/完成/超期故障工单数（仅Fault口径，例行单不计入）、当日告警数、
    到站签到数。用于全网态势时间序列、趋势与同期对比、异常日识别。

    已知口径注意: 当日数据在次日刷新前不完整（工单按创建时间落盘）; attendance_signins 依赖源考勤表，7月以来源数据仅11条，近乎为空

    粒度: 一行 = 站点 × 自然日'
  columns:
  - name: profile_date
    description: 日期
    data_tests:
    - not_null
  - name: station_code
    description: 站点编码
    data_tests:
    - not_null
  - name: station_name
    description: 站点名称
  - name: city_name
    description: 城市名
  - name: work_orders_created
    description: 当日新建工单数
  - name: work_orders_finished
    description: 当日完成工单数
  - name: overdue_orders_created
    description: 当日新建且超期的工单数
  - name: alarms
    description: 当日告警数
  - name: attendance_signins
    description: 当日到站签到数(源数据稀疏)
  - name: refreshed_at
    description: 本表刷新时间
- name: mart_qc_execution_analysis
  description: '江苏质控执行结果数据集（省控站口径）。一行 = 一条质控任务执行结果（站点×污染物×检查/校准类型）， 数据窗口 2026-07-01 起。合格判定直接采用平台 qcresult
    文本前缀，不重算判定规则。 用于质控合格率统计、不合格站点排名、按城市/污染物/任务类型分组分析。 源表 air_province_data.dbo.qc_his_result_2026（平台质控任务结果按年分表，id
    自增增量，5 分钟同步； 每年 1 月需新增当年分表同步配置）。 2026-10-14 前旧源为 qc_historyresult（仅 40 开头试点站），现已退役。

    已知口径注意: 覆盖范围=站点名录中启用的省控站(stationtypeid=2,2026-10-14 时点 101 个)；超站(7099A,类型9)与 40 开头质控仪试点站不在范围；年内停用的省控站(3008A/3022A/3094A)停用前记录不同步;
    is_qualified 由 result_cn 前缀推导：前缀"合格"=true、前缀"不合格"=false、其余(任务失败/任务终止/ 校准类/已执行/未执行)为 NULL，不计入合格率分母；合格率分母=已判定数(合格+不合格);
    任务类型含零点检查/跨度检查/O3_跨度检查/零点校准/跨度校准/多点检查等，统计时注意口径; 站点经 uniquecode 关联 bsd_station(inner join,名录外记录不落宽表)；单站下钻走平台
    API 工具

    粒度: 一行 = 一条质控任务执行结果'
  columns:
  - name: id
    description: 源记录ID(主键)
    data_tests:
    - unique
    - not_null
  - name: uniquecode
    description: 站点唯一编码
  - name: station_code
    description: 平台站点编码
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: station_name
    description: 站点名称
  - name: city_code
    description: 城市行政区码
  - name: city_name
    description: 城市名
  - name: pollutant
    description: 污染物(SO2/NO/O3/CO等)
  - name: task_type
    description: 任务类型(零点检查/跨度检查/O3_跨度检查/零点校准/跨度校准/多点检查等)
  - name: result_cn
    description: 平台判定原文(合格/不合格…/任务失败…/任务终止…/已执行等)
  - name: is_qualified
    description: 是否合格(布尔
  - name: qc_date
    description: 执行日期(start_time取日)
  - name: start_time
    description: 执行开始时间(实际开始
  - name: end_time
    description: 执行结束时间
  - name: target_value
    description: 目标值(跨度气浓度
  - name: relevant_value
    description: 响应值(仪器读数)
  - name: inaccuracy
    description: 相对误差
  - name: relative_error
    description: 相对误差(备用列)
  - name: rid
    description: 质控任务号(API下钻用)
  - name: source_create_time
    description: 源库入库时间
  - name: synced_at
    description: 重建时间
- name: mart_qc_arrangement_analysis
  description: '江苏质控任务安排数据集。一行 = 一条平台安排的质控任务（含历史），每日 02:30 全量， 约 3,500 行。status_cn 为平台安排状态文本，回答"完成情况/哪些站点任务过期未完成"。
    源表 air_province_data.dbo.qc_arrangeresult（每日全量）。

    已知口径注意: 站点范围=省控站统一口径（启用的省控站 101 个，dim_station.is_active_provincial）； 停用省控站与 Voc 等非省控类型站不入本表，与 mart_qc_execution_analysis
