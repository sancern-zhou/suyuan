- name: mart_station_alarm_log
  description: '江苏站房/仪器告警长表。一行 = 一条告警记录(101 省控站按年分片 union,每日 02:30 增量,窗口自 2026-07-01)。 工具 jiangsu_fetch_station_alarm_logs
    已改读本同步链(近 24h 实时窗),本表提供全窗口历史语义查询。

    已知口径注意: 按年分片,每年 1 月须用 gen_alarmlog_sync_config.py 换年份表名并重跑同步与 gen_alarmlog_model.py; alarm_grade 为平台数值编码,alarm_grade_cn
    按 1=一般/2=严重/3=紧急 映射,未知值显示"未知"; 设备状态位图(alarmState)不在告警分片表中,告警工具该字段置空

    粒度: 一行 = 一条告警'
  columns:
  - name: id
    description: 源记录ID(站内唯一)
  - name: station_code
    description: 平台站点编码
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: station_name
    description: 站点名称(经dim_station)
  - name: city_code
    description: 城市行政区码
  - name: city_name
    description: 城市名
  - name: uid
    description: 告警唯一标识
  - name: alarm_type
    description: 告警类型编码(平台内部码)
  - name: subcatalog
    description: 告警子类
  - name: alarm_grade
    description: 告警级别原始值
  - name: alarm_grade_cn
    description: 告警级别中文(兼容源值1/2/3与20/40/60/80;20=提示,40/60=一般,80=严重)
  - name: source
    description: 告警来源
  - name: description
    description: 告警描述原文
  - name: alarm_status
    description: 告警状态(平台原值)
  - name: process_status
    description: 处理状态(平台原值)
  - name: alarm_time
    description: 告警触发时间(lauchtime)
    data_tests:
    - not_null
  - name: last_detect_time
    description: 最近检测时间
  - name: resume_time
    description: 恢复时间(空=未恢复)
  - name: synced_at
    description: 重建时间
- name: mart_qc_task_status_result
  description: '江苏质控任务状态表。一行 = 一次质控任务的最新状态快照(按年源表 2026,每日 02:30 增量,窗口自 2026-07-01,省控站过滤)。 jsonstr 为平台原始状态载荷(含执行步骤/结果值);工具
    jiangsu_fetch_qc_task_status 已改读本链。

    已知口径注意: 按年源表,每年 1 月须换年份表名(gen_alarmlog_sync_config.py); jsonstr 为平台嵌套 JSON 字符串,人工分析时用 execute_python
    解析;工具链已自动解析; 省控站过滤(stationtypeid=2 且 status=1)

    粒度: 一行 = 一次质控任务状态快照(同 rid 取 createtime 最新)'
  columns:
  - name: id
    description: 源记录ID(主键)
    data_tests:
    - unique
    - not_null
  - name: rid
    description: 质控任务标识 rId
    data_tests:
    - unique
    - not_null
  - name: unique_code
    description: 平台唯一编码
  - name: station_code
    description: 平台站点编码
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: station_name
    description: 站点名称(经dim_station)
  - name: source_station_name
    description: 源表站点名称
  - name: poll
    description: 质控监测项(如 SO2/NO/CO/O3/PM25)
  - name: qc_type
    description: 质控类型(零点检查/跨度检查等)
  - name: sstart
    description: 任务计划开始时间
  - name: rstart
    description: 任务实际开始时间
  - name: jsonstr
    description: 平台状态载荷 JSON(步骤/结果值/数据值)
  - name: createtime
    description: 快照时间
  - name: synced_at
    description: 重建时间
- name: mart_qc_air_data_result
  description: '江苏质控期间监测序列(曲线点)。一行 = 一站 × 一质控任务 × 一时间点的监测值(按年源表 2026,每日增量,窗口自 2026-07-01,省控站过滤)。 工具 jiangsu_fetch_qc_monitoring_curve
    已改读本链。

    已知口径注意: 按年源表,每年 1 月须换年份表名(gen_alarmlog_sync_config.py); datavalue 为文本原值,聚合使用 datavalue_numeric;time 为平台记录文本,timepoint
    为监测时间

    粒度: 一行 = 一站 × 一任务窗口 × 一时间点'
  columns:
  - name: id
    description: 源记录ID(主键)
    data_tests:
    - unique
    - not_null
  - name: unique_code
    description: 平台唯一编码
  - name: station_code
    description: 平台站点编码
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: station_name
    description: 站点名称(经dim_station)
  - name: source_station_name
    description: 源表站点名称
  - name: poll
    description: 监测项
  - name: qc_type
    description: 质控类型
  - name: time
    description: 平台记录时间(文本)
  - name: timepoint
    description: 监测时间点
    data_tests:
    - not_null
  - name: datavalue
    description: 监测值(文本原值)
  - name: datavalue_numeric
    description: 可安全聚合的数值监测值(非数值原文为空)
  - name: unit
    description: 单位
  - name: datamark
    description: 数据标记
  - name: flag
    description: 数据标识
  - name: isqcing
    description: 是否质控进行中
  - name: createtime
    description: 入库时间
  - name: synced_at
    description: 重建时间
- name: mart_qc_run_log_result
  description: '江苏质控任务运行日志。一行 = 一条质控运行事件(按年源表 2026,每日增量,窗口自 2026-07-01,省控站过滤)。 工具 jiangsu_fetch_qc_run_logs
    与质控详情链已改读本链。

    已知口径注意: 按年源表,每年 1 月须换年份表名(gen_alarmlog_sync_config.py); 单任务日志可达数百条,按 rid 过滤后再看;strEvent 为事件分类文本

    粒度: 一行 = 一条质控运行事件'
  columns:
  - name: id
    description: 源记录ID(主键)
    data_tests:
    - unique
    - not_null
  - name: rid
    description: 质控任务标识 rId
    data_tests:
    - not_null
  - name: unique_code
    description: 平台唯一编码
  - name: station_code
    description: 平台站点编码
  - name: station_name
    description: 站点名称(经dim_station)
  - name: source_station_name
    description: 源表站点名称
  - name: poll
    description: 监测项
  - name: qc_type
    description: 质控类型
  - name: sstart
    description: 任务计划开始时间
  - name: rstart
    description: 任务实际开始时间
  - name: event_type
    description: 事件类型编码
  - name: str_event
    description: 事件分类文本
  - name: message
    description: 事件消息原文
  - name: record_time
    description: 事件记录时间
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: target
    description: 执行对象/环节
  - name: user_name
    description: 操作用户
  - name: createtime
    description: 入库时间
  - name: synced_at
    description: 重建时间
