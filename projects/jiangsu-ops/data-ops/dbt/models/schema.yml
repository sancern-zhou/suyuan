- name: mart_performance_analysis
  description: '江苏站点月度考核数据集。一行 = 站点×月（2026-07 起，约 600 行，每日 02:30 全量重建）。 两率考核（设备正常运行率/数据准确率，源 opa_performance_tworate）与三项评分
    （运维分/质控分/档案分/总分，源 opa_performance_qaqc）按站点+月份合成一张宽表。

    已知口径注意: 重要·窗口内(2026-07起)无实际填报数据：全表均为占位值(-99/满分模板)。源库最新实际填报为 2025-04(两率)与 2024-08(评分)。考核场景的统计结果当前为空，必须向用户如实说明数据现状，
    不得用占位值构造结论；平台恢复填报后本表自动生效; 当月未结算的行评分为占位值 -99，已清洗为 NULL；is_settled 仅反映两率是否出数(validdays>0); 两表月份覆盖不同：tworate
    缺 2026-07/08 行(源库即如此)，这两月两率列为空但 qaqc 评分可能有值; qaqc 评分月中常为满分模板占位(如 20/20/10/50)，月度结算后才反映真实考核; 运维单位(departmentname)为第三方运维公司名

    粒度: 一行 = 站点×月'
  columns:
  - name: tworate_id
    description: 两率表源ID
  - name: qaqc_id
    description: 评分表源ID
  - name: perf_month
    description: 考核月份(月初日期)
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: station_code
    description: 平台站点编码
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: station_name
    description: 站点名称
  - name: city_code
    description: 城市行政区码(经dim_station)
  - name: city_name
    description: 城市名
  - name: operation_unit
    description: 运维单位(第三方公司名)
  - name: validdays
    description: 有效天数
  - name: is_settled
    description: 当月是否已结算(布尔)
  - name: device_working_rate
    description: 设备正常运行率(-99已转NULL)
  - name: deviceworkingdescription
    description: 设备正常运行率说明
  - name: data_accuracy_rate
    description: 数据准确率(-99已转NULL)
  - name: dataaccuracydescription
    description: 数据准确率说明
  - name: daily_operation_score
    description: 运维分(-99已转NULL)
  - name: qaqc_score
    description: 质控分(-99已转NULL)
  - name: archive_score
    description: 档案分(-99已转NULL)
  - name: total_score
    description: 总分(-99已转NULL)
  - name: synced_at
    description: 重建时间
- name: mart_blackout_analysis
  description: '江苏停电报备单数据集。一行 = 一张停电单（mtc_BlackOut 全量 65 行，每日 02:30 刷新）。 含停电起止时间、时长、撤销标记，用于高值时段停电合规核验（停电时段
    vs 离线/断数告警）。

    已知口径注意: stop_type 0/1 语义待业务确认（按 62:3 分布猜测 0=计划停电/1=故障停电），列值已带(待确认)标记; 数据量小（65 行，2026-07 以来仅 7 张新单），覆盖有限，结论须注明

    粒度: 一行 = 一张停电单'
  columns:
  - name: id
    description: 源记录ID(主键)
    data_tests:
    - unique
    - not_null
  - name: station_code
    description: 平台站点编码
  - name: station_name
    description: 站点名称(经dim_station)
  - name: city_code
    description: 城市行政区码
  - name: city_name
    description: 城市名
  - name: stop_type
    description: 停电类型原始值
  - name: stop_type_cn
    description: 停电类型中文(待业务确认)
  - name: order_type_text
    description: 工单类型文本
  - name: start_time
    description: 停电开始时间
  - name: end_time
    description: 停电结束时间
  - name: duration_hours
    description: 停电时长(小时)
  - name: is_cancel
    description: 是否撤销
  - name: abnormal
    description: 异常标记
  - name: remark
    description: 备注
  - name: source_create_time
    description: 源创建时间
  - name: source_update_time
    description: 源更新时间
  - name: synced_at
    description: 重建时间
- name: mart_qc_backorder_analysis
  description: '江苏质控补测/回调安排日志数据集。一行 = 一条平台安排的补测任务（站点×小时×污染物）， 每日 02:30 全量（窗口 ≥2026-07-01），窗口内约 1 万行、96
    站。 回答"哪些站点/因子被安排补测、当前状态、补测是否集中爆发（风暴预警）"， 是质控闭环的下游环节（执行结果合格/不合格 → 平台补测处置 → 复核）。 源表 air_province_data.dbo.qc_backorderarrangelog（每日全量）。

    已知口径注意: state(1/2/3/6) 与 datatype(1/2/3/6) 为平台原始枚举，中文语义待平台确认， 不得在结论中编造状态含义，可描述分布与集中度; uniquecode 为质控任务组代码，可关联
    qc_historyresult（95/96 命中）判断补测背景； 不可关联 qc_arrangeresult 行级（该表 uniquecode 为任务组代码，105 值/3618 行）; 补测集中信号（2026-10-04
    实测）：3079A 9 天 2248 条、3081A 10 天 958 条， 站点×日聚合条数即为风暴预警口径; pollutant_name 除六参数外还含 降水量/湿度 等（''-'' 为空值占位）

    粒度: 一行 = 一条补测安排（站点×小时×污染物）'
  columns:
  - name: id
    description: 源记录ID(主键)
    data_tests:
    - unique
    - not_null
  - name: station_code
    description: 平台站点编码
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: station_name
    description: 站点名称(经dim_station关联)
  - name: city_code
    description: 城市行政区码(经dim_station关联)
  - name: city_name
    description: 城市名(经dim_station关联)
  - name: uniquecode
    description: 质控任务组代码(关联执行结果用)
  - name: pollutant_name
    description: 污染物名称(含降水量/湿度等; '-'=空占位)
  - name: datatype
    description: 数据类型枚举(1/2/3/6
  - name: state
    description: 补测状态枚举(1/2/3/6
  - name: start_time
    description: 补测时段开始
  - name: end_time
    description: 补测时段结束
  - name: created_at
    description: 安排产生时间
  - name: operator
    description: 操作人
  - name: synced_at
    description: 重建时间
- name: dim_device_parameter
  description: '设备型号健康参数阈值维度表。一行 = 一个设备型号的一个受检参数及其上下限/预警限， 每日 02:30 全量，428 行（38 型号 × 参数，参数名非空的行）。 补充 alm_rule（污染指标告警阈值）之外的"设备健康参数"维度：
    故障诊断时按站点设备的型号取参数核对清单，结合监测曲线/巡检读数判断硬件越限。 源表 air_province_bsd.dbo.bsd_moniter_parameter（每日全量，开 SCD2
    快照）。

    已知口径注意: 源库 statusname(参数名) 约 37% 为空，这些行未进本表；参数名以 statusname 为准; warntype=Range 为量程型参数（看 toplimit/lowlimit），State
    为状态型参数（10 个， 限值可能为空，按是否在正常状态判断）; devicemodel_id 与 dim_device.device_model_id 关联；model_device_count
    为全省该型号设备数; parameterid(178 个) 与参数名(121 个) 数量不一致，参数名字典来源待平台确认

    粒度: 一行 = 设备型号 × 受检参数（(devicemodel_id, parameterid) 源粒度唯一）'
  columns:
  - name: devicemodel
    description: 设备型号ID(原始文本)
    data_tests:
    - not_null
  - name: devicemodel_id
    description: 设备型号ID(数值
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: parameterid
    description: 参数ID
    data_tests:
    - not_null
  - name: parameter_name
    description: 参数名(如 采样流量/光室温度/转换炉温度)
    data_tests:
    - not_null
  - name: series
    description: 系列号
  - name: toplimit
    description: 上限
  - name: lowlimit
    description: 下限
  - name: warn_top_limit
    description: 预警上限
  - name: warn_low_limit
    description: 预警下限
  - name: unit
    description: 单位
  - name: warntype
    description: 预警类型(Range=量程型/State=状态型)
  - name: description
    description: 参数说明(截断500字符)
  - name: model_device_count
    description: 全省该型号设备数
  - name: synced_at
    description: 重建时间
- name: mart_device_lifecycle_analysis
  description: '设备生命周期事件流数据集。一行 = 一条设备生命周期事件（2026-07-01 起）， 每日 02:30 全量，窗口内约 700 行。 事件来源 = 状态变更日志 log_device（启用/故障/维修/备机/校准/停用等状态流转，
    可关联故障工单号）∪ 报废审批 dev_scrap（报废理由与审批结果）。 回答"最近一周/一月设备周期发生了什么：哪些设备启用、故障维修、转备机、停用、报废"， 备机更换及时性分析查 DeviceSpare
    状态流转。 源表 opa_product_data.dbo.log_device + dbo.DEV_SCRAP（每日全量）。

    已知口径注意: state_after/event_type 为平台原始枚举（如 DeviceSpare=转为备机、DeviceFault=转故障、 DeviceRepair=维修事件），中文语义按此理解但以平台为准，不得编造其他含义;
    日志窗口自 2026-07-01，更早的启用/故障历史不可查；报废事件为全量（行数极少）; 部分事件无站点码（event_station 空）且回退设备台账归属站；个别设备已不在台账（孤儿 deviceid），
    device_code/station_code 为空属正常; remarks 常见"故障单：现场维修站点的故障设备"等，working_order_code 可关联 mart_work_order_analysis
    看处置详情

    粒度: 一行 = 一条生命周期事件（event_id：log_* 或 scrap_*）'
  columns:
  - name: event_id
    description: 事件ID(log_*/scrap_* 主键)
    data_tests:
    - unique
    - not_null
  - name: event_source
    description: 事件来源(log_device=状态变更日志/dev_scrap=报废审批)
  - name: event_time
    description: 事件时间
    data_tests:
    - not_null
  - name: device_id
    description: 设备ID
  - name: device_code
    description: 设备编码
  - name: station_code
    description: 站点编码(事件站点优先
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: station_name
    description: 站点名称(经dim_station)
  - name: city_code
    description: 城市行政区码(经dim_station)
  - name: city_name
    description: 城市名(经dim_station)
  - name: device_type
    description: 设备类型码
  - name: device_type_name
    description: 设备类型名(如 O3分析仪)
  - name: device_model_id
    description: 设备型号ID(可关联 dim_device_parameter 查参数阈值)
  - name: state_after
    description: 变更后状态枚举(DeviceNormal/DeviceFault/DeviceSpare/…)
  - name: event_type
    description: 事件动作枚举(DeviceStart/DeviceRepair/DeviceStop/…)
  - name: remarks
    description: 备注(如 故障单：现场维修站点的故障设备)
  - name: working_order_code
    description: 关联故障工单号
  - name: scrap_reason
    description: 报废理由(仅报废行)
  - name: approve_result
    description: 报废审批结果(仅报废行)
  - name: synced_at
    description: 重建时间
