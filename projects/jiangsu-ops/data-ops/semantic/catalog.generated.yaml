        denominator: count
        null_policy: denominator_zero
        time_basis: alarmTime
      avgDurationMinutes:
        name: 平均告警持续分钟(已解除)
        definition: 平均告警持续分钟(已解除)
      avgHandleMinutes:
        name: 平均处理时长分钟(已处理)
        definition: 平均处理时长分钟(已处理)
    dimensions:
      cityName: 城市名
      stationCode: 站点编码
      stationName: 站点名
      alarmLevel: 告警级别(紧急/中级/一般)
      alarmState: 处理状态(未处理/已解除)
      ruleType: 告警规则类型
      isUnresolved: 是否未处理
      alarmTime: 告警时间(时间维度)
