      count:
        name: 告警量
        definition: 告警量
      unresolvedCount:
        name: 未处理告警数
        definition: 未处理告警数
      unresolvedRate:
        name: 未处理率
        definition: 未处理告警数 / 告警总数 × 100
        numerator: unresolvedCount
        denominator: count
        null_policy: denominator_zero
        time_basis: alarmTime
      convertedCount:
        name: 转化工单的告警数(24h内同站建单)
        definition: 转化工单的告警数(24h内同站建单)
      toWorkOrderRate:
        name: 告警转工单率
        definition: 24小时内转化工单的告警数 / 告警总数 × 100
