# 数据集契约：mart_qc_execution_analysis
dataset: mart_qc_execution_analysis
description: >
  江苏质控执行结果数据集（省控站口径）。一行 = 一条质控任务执行结果（站点×污染物×检查/校准类型），
  数据窗口 2026-06-01 起。合格判定直接采用平台 qcresult 文本前缀，不重算判定规则。
  用于质控合格率统计、不合格站点排名、按城市/污染物/任务类型分组分析。
  源表 air_province_data.dbo.qc_his_result_2026（平台质控任务结果按年分表，id 自增增量，5 分钟同步；
  每年 1 月需新增当年分表同步配置）。
  2026-10-14 前旧源为 qc_historyresult（仅 40 开头试点站），现已退役。
owner: 江苏运维平台组
grain: 一行 = 一条质控任务执行结果
freshness_slo: 30分钟（5分钟增量+宽表重建）
known_caveats:
  - 覆盖范围=站点名录中启用的省控站(stationtypeid=2,2026-10-14 时点 101 个)；超站(7099A,类型9)与
    40 开头质控仪试点站不在范围；年内停用的省控站(3008A/3022A/3094A)停用前记录不同步
  - is_qualified 由 result_cn 前缀推导：前缀"合格"=true、前缀"不合格"=false、其余(任务失败/任务终止/
    校准类/已执行/未执行)为 NULL，不计入合格率分母；合格率分母=已判定数(合格+不合格)
  - 任务类型含零点检查/跨度检查/O3_跨度检查/零点校准/跨度校准/多点检查等，统计时注意口径
  - 站点经 uniquecode 关联 bsd_station(inner join,名录外记录不落宽表)；单站下钻走平台 API 工具
columns:
  - {name: id, business: 源记录ID(主键)}
  - {name: uniquecode, business: 站点唯一编码}
  - {name: station_code, business: 平台站点编码}
  - {name: station_name, business: 站点名称}
  - {name: city_code, business: 城市行政区码}
  - {name: city_name, business: 城市名}
  - {name: pollutant, business: 污染物(SO2/NO/O3/CO等)}
  - {name: task_type, business: 任务类型(零点检查/跨度检查/O3_跨度检查/零点校准/跨度校准/多点检查等)}
  - {name: result_cn, business: 平台判定原文(合格/不合格…/任务失败…/任务终止…/已执行等)}
  - {name: is_qualified, business: 是否合格(布尔,可空;NULL=未完成判定不计入合格率分母)}
  - {name: qc_date, business: 执行日期(start_time取日)}
  - {name: start_time, business: 执行开始时间(实际开始,缺计划开始)}
  - {name: end_time, business: 执行结束时间}
  - {name: target_value, business: 目标值(跨度气浓度,零点为0)}
  - {name: relevant_value, business: 响应值(仪器读数)}
  - {name: inaccuracy, business: 相对误差}
  - {name: relative_error, business: 相对误差(备用列)}
  - {name: rid, business: 质控任务号(API下钻用)}
  - {name: source_create_time, business: 源库入库时间}
  - {name: synced_at, business: 重建时间}
access:
  tool: execute_jiangsu_mart_sql
  role: agent_reader
# guide 字段由 gen_tool_contract.py 汇总生成工具描述契约文本（单一来源）
guide: >-
  维度 station_code/station_name/city_name/pollutant/task_type(零点检查/跨度检查/O3_跨度检查/校准类等)；
  结果 result_cn(平台原始判定文本)/is_qualified(布尔,可空)；
  时间 qc_date(执行日)/start_time/end_time/source_create_time；
  证据 target_value/relevant_value/inaccuracy/relative_error/rid(下钻号)。
  质控合格率统计、不合格站点排名查本表；覆盖范围为站点名录启用的省控站(约101个，不含超站与40开头试点站)，
  仅代表省控站口径，不得外推为全网 1509 站；合格率分母=已判定数(合格+不合格)，任务失败/终止不计入；
  单站质控下钻(运行日志/监测曲线)走平台API工具，本表只做统计。
