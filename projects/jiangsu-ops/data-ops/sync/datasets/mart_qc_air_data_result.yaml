# 数据集契约：mart_qc_air_data_result
dataset: mart_qc_air_data_result
description: >
  江苏质控期间监测序列(曲线点)。一行 = 一站 × 一质控任务 × 一时间点的监测值(按年源表 2026,每日增量,窗口自 2026-07-01,省控站过滤)。
  工具 jiangsu_fetch_qc_monitoring_curve 已改读本链。
owner: 江苏运维平台组
grain: 一行 = 一站 × 一任务窗口 × 一时间点
freshness_slo: 26小时
known_caveats:
  - 按年源表,每年 1 月须换年份表名(gen_alarmlog_sync_config.py)
  - 源列 datavalue 实测为数值类型(非文本,2026-10-19 部署核实);datavalue_numeric 为其 double 聚合列,两者同值;time 为平台记录文本,timepoint 为监测时间
columns:
  - {name: id, business: 源记录ID(主键)}
  - {name: unique_code, business: 平台唯一编码}
  - {name: station_code, business: 平台站点编码}
  - {name: station_name, business: 站点名称(经dim_station)}
  - {name: source_station_name, business: 源表站点名称}
  - {name: poll, business: 监测项}
  - {name: qc_type, business: 质控类型}
  - {name: time, business: 平台记录时间(文本)}
  - {name: timepoint, business: 监测时间点}
  - {name: datavalue, business: 监测值(数值)}
  - {name: datavalue_numeric, business: 监测值(double 聚合列,与 datavalue 同值)}
  - {name: unit, business: 单位}
  - {name: datamark, business: 数据标记}
  - {name: flag, business: 数据标识}
  - {name: isqcing, business: 是否质控进行中}
  - {name: createtime, business: 入库时间}
  - {name: synced_at, business: 重建时间}
access:
  tool: execute_jiangsu_mart_sql
  role: agent_reader
guide: >-
  查质控前后/期间监测曲线用本表:按 station_code+poll+qc_type+timepoint 窗口过滤并按 timepoint 排序;
  曲线可视化优先用 jiangsu_fetch_qc_monitoring_curve;isqcing=true 表示质控进行中的点位;
  datavalue_numeric 是可安全聚合的数值列(与 datavalue 同值,语义层聚合用它)。
