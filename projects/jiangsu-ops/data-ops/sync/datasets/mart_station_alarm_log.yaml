# 数据集契约：mart_station_alarm_log
dataset: mart_station_alarm_log
description: >
  江苏站房/仪器告警长表。一行 = 一条告警记录(101 省控站按年分片 union,每日 02:30 增量,窗口自 2026-06-01)。
  工具 jiangsu_fetch_station_alarm_logs 已改读本同步链(近 24h 实时窗),本表提供全窗口历史语义查询。
owner: 江苏运维平台组
grain: 一行 = 一条告警
freshness_slo: 26小时
known_caveats:
  - 按年分片,每年 1 月须用 gen_alarmlog_sync_config.py 换年份表名并重跑同步与 gen_alarmlog_model.py
  - alarm_grade 为平台数值编码,alarm_grade_cn 按 1/40/60=一般、2/80=严重、3=紧急、20=提示 映射,其余显示"未知"
  - 设备状态位图(alarmState)不在告警分片表中,告警工具该字段置空
columns:
  - {name: id, business: 源记录ID(站内唯一)}
  - {name: station_code, business: 平台站点编码}
  - {name: station_name, business: 站点名称(经dim_station)}
  - {name: city_code, business: 城市行政区码}
  - {name: city_name, business: 城市名}
  - {name: uid, business: 告警唯一标识}
  - {name: alarm_type, business: 告警类型编码(平台内部码)}
  - {name: subcatalog, business: 告警子类}
  - {name: alarm_grade, business: 告警级别原始值}
  - {name: alarm_grade_cn, business: "告警级别中文(兼容源值1/2/3与20/40/60/80; 20=提示, 40/60=一般, 80=严重)"}
  - {name: source, business: 告警来源}
  - {name: description, business: 告警描述原文}
  - {name: alarm_status, business: 告警状态(平台原值)}
  - {name: process_status, business: 处理状态(平台原值)}
  - {name: alarm_time, business: 告警触发时间(lauchtime)}
  - {name: last_detect_time, business: 最近检测时间}
  - {name: resume_time, business: 恢复时间(空=未恢复)}
  - {name: synced_at, business: 重建时间}
access:
  tool: execute_jiangsu_mart_sql
  role: agent_reader
guide: >-
  查站房/仪器告警历史用本表:按 station_code + alarm_time 过滤,alarm_grade_cn 区分级别,
  alarm_grade_cn 兼容源值1/2/3与20/40/60/80(20=提示,40/60=一般,80=严重),
  resume_time 为空即未恢复;近 24h 实时窗优先用 jiangsu_fetch_station_alarm_logs(本地分片,同一数据源);
  description 为告警描述原文,alarm_type 是平台内部编码不做翻译。
