access:
  tool: execute_guangdong_mart_sql
  role: suyuan(应用) / agent_reader(语义层)
guide: >-
  sup_rf_pm1monitorinspection（一行 = 一条 PM1 巡检记录，id 主键）：维度 workingordercode/stationid/stationcode/
  checkdate/deviceid/devicebrand/devicemodel/devicecode/ruleitemtag/formtype；
  校准膜 calibrationpoint/originalvalue/currentvalue/merror(测定误差%,≤±5)；
  温湿压 atdisplayvalue/tdisplayvalue/athumidityvalue/thumidityvalue/pgdisplayvalue/pgtvalue；
  参考器具 ftmodel/ftnumber/ttmodel/ttnumber/htmodel/htnumber/btmodel/btnumber + tt/ft/ht/btvalidity；
  检查标记 dt/ip/flow/aline/time/papertape/at/ah/pg isitcalibrated、external/inside isitclean、
  sp/idb/sh/leak whether、isitcomplete/tt/ht/bt isitcomplete；faultdescription/maintenanceresults/otherremarks。
  标记列均为源系统原文，不能直接当合格结论；按 ruleitemtag 过滤周/月/半年周期。
