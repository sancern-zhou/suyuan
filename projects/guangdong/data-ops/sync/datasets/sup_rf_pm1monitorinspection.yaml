dataset: sup_rf_pm1monitorinspection
description: >
  组分网 PM1 监测仪巡检记录表单（源 dbo.Sup_RF_PM1MonitorInspection）。一行 = 一条 PM1 巡检记录，
  按 ruleitemtag 区分周检/月检/半年检（Sup_RF_PM1MonitorInspection_Week/Month/HalfYear）。
  2026 年起回填 + 小时级增量。
owner: 广东运维平台组
grain: 一行 = 一条 PM1 巡检记录（id）
freshness_slo: 2小时
known_caveats:
- 校准膜测定误差 merror 判据 ≤±5%（sup_form_profiles.yaml Sup_RF_PM1MonitorInspection_Month）
- 各 isitcalibrated/isitclean/whether/isitcomplete 为源系统标记原文，不是结论值，需结合检查内容判断
- 参考器具（温度/湿度/流量/气压计）按 ft/tt/ht/bt 前缀分组，检定有效期列与器具列一一对应
- 2026-01-01 前的历史不回填
