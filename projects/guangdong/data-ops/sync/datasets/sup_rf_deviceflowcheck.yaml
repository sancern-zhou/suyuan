access:
  tool: execute_guangdong_mart_sql
  role: suyuan(应用) / agent_reader(语义层)
guide: >-
  sup_rf_deviceflowcheck（一行 = 一条流量核查记录，id 主键）：维度 workingordercode/stationid/stationcode/checkdate/
  deviceid/devicebrand/devicemodel/devicecode/ruleitemtag/pollutanttype；
  参考流量计1组 flowermodel1/flowercode1/calibratedateprev1/calibratedatenext1/slope1/intercept1/r1，
  流量计2组同名字段以 2 结尾；校准前 targetvalue1(目标)/displayvalue1(显示)/correctionvalue1(修正后标准值=
  显示×斜率+截距)/error1(相对误差%,≤±5)/indicationerror1(示值误差%,≤±2)/isok1/iscalibrate1；
  校准后同名以 2 结尾；五点核查 setflowvalue1..5/actualflowvalue1..5/relativeerror1..5/curveequation/coefficient；
  液体流量 liquidflowsetvalue/liquidactualflowvalue1..3/liquidflowstandarddeviation/isliquidflowqualified；
  temperature/pressure 核查环境；remark 备注。两个误差口径不要混用。
