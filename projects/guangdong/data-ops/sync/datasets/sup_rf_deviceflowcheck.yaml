dataset: sup_rf_deviceflowcheck
description: >
  组分网设备采样流量核查/校准记录表单（源 dbo.Sup_RF_DeviceFlowCheck）。一行 = 一条流量核查记录，
  按 ruleitemtag 覆盖 PM1/NH3/BC/水溶性离子/重金属/PTR-MS 等仪器族。2026 年起回填 + 小时级增量。
owner: 广东运维平台组
grain: 一行 = 一条设备流量核查/校准记录（id）
freshness_slo: 2小时
known_caveats:
- 参考流量计 1/2 为两条独立校准链路，字段各自成组（*1/*2），不要混用
- correctionvalue1/2 = displayvalue×slope+intercept（系统计算列）；error1/2 与 indicationerror1/2 是两个不同误差口径
- 五点流量（setflowvalue/actualflowvalue/relativeerror 1..5）与液体流量列仅在部分仪器族填写，其余为空属正常
- 2026-01-01 前的历史不回填
