dataset: opa_datareceiverate
description: 数据到报率平台统计。源自 OPA_DataReceiveRate，一行 = 一条统计记录（每日生成，共 1.1 万行）。
owner: 广东运维平台组
grain: 一条到报率统计记录
freshness_slo: 26小时
known_caveats:
- 今年窗口（{year_start}-01-01 每年滚动）+ 持续增量；窗口前历史不可查（2026-10-24 同步量控制约定）
columns:
- name: （见源表/宽表定义）
  business: 完整列清单经工具 describe_table 获取；关键业务列见 guide
access:
  tool: execute_guangdong_mart_sql
  role: suyuan(应用) / agent_reader(语义层)
guide: opa_datareceiverate（一行 = 一条到报率统计）：id/统计日期与到报率列（30 列），每日 10:15 左右生成。到报率属平台统计口径，直接取本表勿重算。
