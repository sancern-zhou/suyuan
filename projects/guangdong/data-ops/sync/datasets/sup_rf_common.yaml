dataset: sup_rf_common
description: 运维表单通用数据体（非故障单的表单内容，306 列宽表）。源自 Sup_RF_Common，一行 = 一张表单提交。
owner: 广东运维平台组
grain: 一张非故障单的表单体（题目项展开为列）
freshness_slo: 60分钟（高频链路）
known_caveats:
- 今年窗口（{year_start}-01-01 每年滚动）+ 持续增量；窗口前历史不可查（2026-10-24 同步量控制约定）
columns:
- name: （见源表/宽表定义）
  business: 完整列清单经工具 describe_table 获取；关键业务列见 guide
access:
  tool: execute_guangdong_mart_sql
  role: suyuan(应用) / agent_reader(语义层)
guide: sup_rf_common（一行 = 一张非故障单表单体，306 列）：id/workingordercode(工单号)/formcode 等头信息
  + 大量表单题目项列；updatetime 为水位。工单审核取表单内容用本表（对标江苏 rf_common）；列过多，先按 workingordercode 过滤再取列；完整列名用
  describe_table。
