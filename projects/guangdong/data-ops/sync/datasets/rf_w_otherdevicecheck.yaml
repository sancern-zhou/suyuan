dataset: rf_w_otherdevicecheck
description: 其他设备检查表单实体。源自 RF_W_OTHERDEVICECHECK，一行 = 一张表单（今年约 4,211 张）。
owner: 广东运维平台组
grain: 一张其他设备检查表单
freshness_slo: 26小时
known_caveats:
- 今年窗口（{year_start}-01-01 每年滚动）+ 持续增量；窗口前历史不可查（2026-10-24 同步量控制约定）
- 表单在送审流程中原行修改（打回重报不换行，createdate 不变），每日对近 7 天滚动全量重拉捕获；超出 7 天的原地修改不再同步（例行工单超 7 天自动送审，之后一般不再修改）
columns:
- name: （见源表/宽表定义）
  business: 完整列清单经工具 describe_table 获取；关键业务列见 guide
access:
  tool: execute_guangdong_mart_sql
  role: suyuan(应用) / agent_reader(语义层)
guide: rf_w_otherdevicecheck（一行 = 一张其他设备检查表单）：rfwotherdevicecheckid/workingordercode/stationid/createdate
  + 题目项列。
