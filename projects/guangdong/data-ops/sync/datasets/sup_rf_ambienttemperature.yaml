dataset: sup_rf_ambienttemperature
description: >
  组分网温压传感器核查记录表单（源 dbo.Sup_RF_AmbientTemperature）。一行 = 一条仪器环境温度/气压核查记录，
  按 ruleitemtag 覆盖 PM1/重金属/水溶性离子/OCEC/CO2 等仪器族。2026 年起回填 + 小时级增量。
owner: 广东运维平台组
grain: 一行 = 一条温压核查记录（id）
freshness_slo: 2小时
known_caveats:
- 表单在审核流程中可原行修改，按 UpdateTime 水位增量，2026-01-01 前的历史不回填
- 温度示值误差判据 ≤±2℃、气压 ≤±1kPa（见 sup_form_profiles.yaml Sup_RF_AmbientTemperature）
- t_iscalibrated/p_iscalibrated 为源系统标记原文（1/0），不是已校准结论，需结合校准日期判断
columns:
