access:
  tool: execute_guangdong_mart_sql
  role: suyuan(应用) / agent_reader(语义层)
guide: >-
  sup_rf_ambienttemperature（一行 = 一条温压核查记录，id 主键）：维度 workingordercode/stationid/stationcode/
  checkdate/deviceid/devicebrand/devicemodel/devicecode/ruleitemtag/pollutanttype；
  温度组 t_model/t_code/t_range/t_revised/t_prevdate/t_nextdate(检定有效期)/t_r_standard/t_r_revised/
  t_r_prevvalue(校准前)/t_r_nextvalue(校准后)/t_iscalibrated；
  气压组 p_model/p_code/p_prevdate/p_nextdate/p_slope/p_intercept/p_r/p_r_standard/p_r_revised/
  p_r_prevvalue/p_r_nextvalue/p_iscalibrated；remark 备注。
  误差口径：温度示值误差=t_r_*值-t_r_standard（≤±2℃），气压≤±1kPa；判定以下表原值计算，不要套用其他表单字段。
