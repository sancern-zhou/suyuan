dataset: dim_station
description: 站点目录一致性维度。一行 = 一个站点（432 站 = 主网 332 + 组分网 100，每日全量刷新）。城市/运维单位/部门维度经 v_cityandregionanddepartment（主网）与
  v_supcityandregionanddepartment（组分网）全站覆盖。统一站点维度：工单/任务项/告警的站点归属都应经本表关联。
owner: 广东运维平台组
grain: 一行 = 一个站点（station_id）
freshness_slo: 26小时
known_caveats:
- 主网 332 站（ID 1000+）来自 base_station；组分网 100 站（ID 1~102）来自 v_supcityandregionanddepartment，两组
  ID 空间不重叠；组分站经纬度/地址未同步（视图无此信息）
- station_type_name：主网按 DDStationType 字典映射（1国控/2省控/3市控/4区域/5乡镇/6省建/7省乡镇/9VOC）；组分网统一为"组分站"
- 组分站运维单位/部门/管理人未同步（视图无该信息）；manager_name 仅主网告警推送站点（约 63 站）
columns:
- name: station_id
  business: 站点ID(主键)
- name: station_code
  business: 站点编码
- name: station_name
  business: 站点中文名(如 从化天湖/南沙大稳)
- name: region_id
  business: 区域ID(无区域字典
  仅有ID): null
- name: longitude
  business: 经度
- name: latitude
  business: 纬度
- name: address
  business: 地址
- name: station_type
  business: 站点类型(源库字典代码原文)
- name: status
  business: 启用状态
- name: unique_code
  business: 站点唯一编码
- name: monitor_ip
  business: 监测设备IP
- name: mapping_station_id
  business: 映射站点ID
- name: operation_type
  business: 运维方式
- name: description
  business: 描述
- name: create_time
  business: 建站时间
- name: refreshed_at
  business: 本表刷新时间(dbt 重建时间)
access:
  tool: execute_guangdong_mart_sql
  role: suyuan(应用) / agent_reader(语义层)
guide: dim_station（一行 = 一个站点，432 站 = 主网 332 + 组分网 100）：station_id(主键)/station_code/station_name/city_code(城市行政区码)/city_name(城市名,全站覆盖)/station_type_name(中文名:国控站/省控站/组分站等)/operation_unit_name(运维单位中文名,主网)/department_name(部门中文名,主网)/longitude/latitude/address/status/unique_code/refreshed_at。站点名单、城市/区域归属、运维单位归属用本表；工单/任务项/告警的
  station_id 文本关联本表 station_id。组分站(station_type_name=组分站)对应 Sup 前缀工单体系。
