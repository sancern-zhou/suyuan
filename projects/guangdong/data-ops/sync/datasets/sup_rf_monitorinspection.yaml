dataset: sup_rf_monitorinspection
description: >
  组分网监测仪巡检记录表单（源 dbo.Sup_RF_MonitorInspection）。一行 = 一条巡检记录，
  按 ruleitemtag 区分周检/月检/季检（Sup_RF_MonitorInspection_Week/Month/Quarter），当前以 BC 仪器为主。
  2026 年起回填 + 小时级增量。
owner: 广东运维平台组
grain: 一行 = 一条监测仪巡检记录（id）
freshness_slo: 2小时
known_caveats:
- 周检/月检/季检题目项列在同一条记录上并存，未填项为空属正常，统计前按 ruleitemtag 过滤周期
- 各项检查结果列为源系统文本/枚举原文，不是布尔值
- 各项 remarks 与检查项一一对应（week*/month*/quarter*/ondemand*）
- 2026-01-01 前的历史不回填
