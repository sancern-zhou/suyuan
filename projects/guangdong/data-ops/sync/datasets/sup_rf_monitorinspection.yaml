access:
  tool: execute_guangdong_mart_sql
  role: suyuan(应用) / agent_reader(语义层)
guide: >-
  sup_rf_monitorinspection（一行 = 一条监测仪巡检记录，id 主键）：维度 workingordercode/stationid/stationcode/
  checkdate/deviceid/devicebrand/devicemodel/devicecode/ruleitemtag/pollutanttype/formtype；
  站房 environment temperature/humidity；分析仪 analyzermodel/analyzernumber/analyzerlasttime/analyzeranothertime；
  周检 weekdatacontrol/weekattribute/weekdewaterbottle/weekzeropointtest/weekstabilitytest；
  月检 monthsamplelinetube/monthcap/monthcutter/monthdate；季检 quartertrafficv/quarterleaktest；
  按需 ondemandopticalcavity/ondemandlubrication/ondemandpapertape/ondemandfilter/ondemandptinspect/ondemandfinspect；
  各检查项对应 *remarks 备注；faultdescription/maintenanceresults/otherremarks。
  统计按 ruleitemtag 过滤周期，未填项为空属正常。
