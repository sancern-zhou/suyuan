    description: 考核记录ID
    data_tests: [unique, not_null]

- name: mart_alarm_notify_analysis
  description: 站点告警通知流水宽表。一行 = 一条告警通知（含发送渠道），无处理闭环状态；当前态势见 mart_station_alarm_status。
