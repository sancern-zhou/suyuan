version: 2
models:
- name: working_orders
  description: 广东运维工单主表。一行 = 一张运维工单（全类型含作废），update_time 水位小时级增量。
  columns:
  - name: id
    description: 工单源ID(主键)
    data_tests: [unique, not_null]
  - name: working_order_code
    description: 工单号(唯一业务号)
    data_tests: [not_null]
  - name: create_time
    description: 创建时间
    data_tests: [not_null]
  - name: refreshed_at
    description: 本表刷新时间(dbt 重建时间)

- name: working_order_details
  description: 工单流程明细。一行 = 工单一个流程步骤；alarm_reason 是故障根因归纳的主要来源。
  columns:
  - name: id
    description: 明细行ID(主键)
    data_tests: [unique, not_null]
  - name: working_order_code
    description: 工单号
    data_tests: [not_null]

- name: wo_commonfile_links
  description: 工单附件索引。一行 = 一条附件记录；附件本体在源系统。
  columns:
  - name: id
    description: 附件索引ID(主键)
    data_tests: [unique, not_null]

- name: dim_station
  description: 站点目录维度表。一行 = 一个站点（约 332 站全量）；城市/运维单位/部门经 v_cityandregionanddepartment 全量覆盖。
  columns:
  - name: station_id
    description: 站点ID(主键,文本形式)
    data_tests: [unique, not_null]
  - name: station_code
    description: 站点编码
  - name: station_name
    description: 站点中文名

- name: dim_device
  description: 设备台账维度表。一行 = 一台登记设备（每日全量）。
  columns:
  - name: device_id
    description: 设备ID(主键,文本形式)
    data_tests: [unique, not_null]
  - name: station_id
    description: 站点ID(关联 dim_station)

- name: mart_work_order_analysis
  description: >
    广东运维工单分析宽表。一行 = 一张运维工单（全类型含作废），预计算时效/超期/重复故障/
    附件计数。语义层 WorkOrder cube 的数据源。口径限制见 sync/datasets/mart_work_order_analysis.yaml。
  columns:
  - name: id
    description: 工单源ID(主键)
    data_tests: [unique, not_null]
  - name: working_order_code
    description: 工单号
    data_tests: [not_null]
  - name: create_time
    description: 创建时间
    data_tests: [not_null]
  - name: order_status_cn
    description: 状态中文名(已完成/处理中/待处理/已作废)
  - name: is_overdue
    description: 是否超期(仅 plan_finish_time 非空可评估,作废单不计)
  - name: overdue_evaluable
    description: 超期可评估位(超期率分母)
  - name: is_repeat_fault
    description: 是否30天内重复故障(同站同设备,仅故障单口径)
  - name: refreshed_at
    description: 本表刷新时间
- name: alm_alarm
  description: 契约透传层：dbo.ALM_ALARM，一行 = 一条原始记录；字段业务含义见 sync/datasets/alm_alarm.yaml。
  columns:
