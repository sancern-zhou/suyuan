schema_version: 1
project: jiangxi
modules:
  - legacy
  - jiangxi-noise
frontend:
  theme: default
  brand_name: 江西省噪声智能分析平台  # 同时用于浏览器标题
  features:
    era5HistoricalBackfill: false
    hide_sidebar_brand: true  # 侧边栏不显示品牌名（标题仍保留）
  agent_modes:
    - query
    - assistant
    - expert
    - report
  default_agent_mode: query
  agent_mode_overrides:
    assistant:
      name: 声环境知识问答智能体
      description: 解答声环境标准、监测、评价与噪声治理相关知识问题
      welcome:
        description: 面向声环境专业知识问答，结合已授权知识库与必要的网络检索，提供有依据、可追溯的专业解答。
        features:
          - 解答声环境质量标准、噪声排放标准与监测规范问题
          - 说明声环境评价、监测方法、指标口径和适用场景
          - 检索噪声控制、污染防治与投诉处置相关专业资料
          - 区分知识库依据与网络资料，明确来源和结论边界
        example: '例如："声环境功能区的分类和对应噪声限值是什么？"'
      tags:
        - 声环境知识
        - 标准规范
        - 专业问答
    query:
      name: 智能问数生图智能体
      description: 查询噪声数据、生成图表、统计核算与达标评价
      welcome:
        description: 查询江西省噪声监测数据，生成可视化图表，快速完成统计核算、昼夜达标评价和结论整理。
        features:
          - 查询江西省噪声站点分钟值、小时值、日均值和城市功能区聚合数据
          - 生成数据图表与可视化展示
          - 完成统计汇总、对比、排名与 GB 3096 昼夜达标评价
          - 将查询结果整理为清晰的表格和结论
        example: '例如："查询南昌本月噪声监测数据，并生成对比图表"'
      tags:
        - 噪声查询
        - 图表生成
        - 统计分析
    expert:
      welcome:
        description: 面向复杂噪声污染问题开展专业研判，综合监测数据、声场机理与业务经验，诊断超标成因、影响范围并给出治理建议。
        features:
          - 综合噪声监测、声环境敏感点与声源识别证据开展研判
          - 诊断噪声超标成因、影响范围与关键影响因素
          - 交叉核验多类证据，识别结论的不确定性
          - 输出专业研判结论与针对性治理建议
        example: '例如："综合分析南昌近期某工业企业噪声投诉的成因，并给出治理建议"'
    report:
      welcome:
        example: '例如："根据本轮噪声分析结果生成一份声环境投诉分析简报"'
  agent_platform_layout: environment-grid
backend:
  gis_tools_enabled: false
  # 声环境项目不引用共享"数据源地图"与"环境空气质量标准过渡"两段：
  # 地图是"域 → 工具名"的路由表，过渡段写的是 PM10/PM2.5 限值，
  # 二者出现在声环境系统提示词里既误导又违反"提示词不写工具选型"。
  # 取数路由契约完整保留在 execute_postgres_sql_query 工具 schema 与项目提示词中。
  data_source_map_enabled: false
  air_quality_standard_transition: false
  mode_prompt_files:
    assistant: projects/jiangxi/prompts/knowledge_qa.md
    query: projects/jiangxi/prompts/query.md
    expert: projects/jiangxi/prompts/expert.md
    report: projects/jiangxi/prompts/report.md
    # 报告 DAG 精简子模式（internal/：不在前端模式列表，仅由 report 父模式经
    # run_agent_workflow 委派；叶子节点不可再委派）
    noise_query_monitoring: projects/jiangxi/prompts/internal/noise_query_monitoring.md
    noise_query_evaluation: projects/jiangxi/prompts/internal/noise_query_evaluation.md
    noise_expert_analysis: projects/jiangxi/prompts/internal/noise_expert_analysis.md
  report_final_review_prompt_file: projects/jiangxi/prompts/report_final_review.md
  tools:
    - get_jiangxi_noise_data
    - get_jiangxi_noise_statistics
    - get_jiangxi_noise_trends
    - get_jiangxi_noise_events
    - get_jiangxi_noise_runtime_status
    - get_jiangxi_noise_directory
    - get_jiangxi_noise_alarm_analysis
    - get_jiangxi_noise_compliance
    - search_jiangxi_noise_apis
    - describe_jiangxi_noise_api
    - call_jiangxi_noise_api
  fetchers_enabled: false
  agent_mode_tools:
    assistant:
      - knowledge_qa_workflow
      - web_search
      - publish_session_file
    expert:
      - list_session_resources
      - publish_session_file
      - execute_echarts_python
      - execute_python
      - read_file
      - write_file
      - edit_file
      - grep
      - list_directory
      - search_files
      - get_jiangxi_noise_data
      - get_jiangxi_noise_statistics
      - get_jiangxi_noise_trends
      - get_jiangxi_noise_events
      - get_jiangxi_noise_runtime_status
      - get_jiangxi_noise_directory
      - get_jiangxi_noise_alarm_analysis
      - get_jiangxi_noise_compliance
      - search_jiangxi_noise_apis
      - describe_jiangxi_noise_api
      - call_jiangxi_noise_api
      - execute_postgres_sql_query
    query:
      - list_session_resources
      - publish_session_file
      - grep
      - read_file
      - write_file
      - edit_file
      - list_directory
      - search_files
      - execute_echarts_python
      - execute_python
      - get_jiangxi_noise_data
      - get_jiangxi_noise_statistics
      - get_jiangxi_noise_trends
      - get_jiangxi_noise_events
      - get_jiangxi_noise_runtime_status
      - get_jiangxi_noise_directory
      - get_jiangxi_noise_alarm_analysis
      - get_jiangxi_noise_compliance
      - search_jiangxi_noise_apis
      - describe_jiangxi_noise_api
      - call_jiangxi_noise_api
      - execute_postgres_sql_query
    # 2026-11-17 对标许昌/广东改为整合者定位：报告主 Agent 不直接执行业务取数
    # 与研判，取数经问数子节点、研判经研判子节点（run_agent_workflow DAG），
    # 父负责定义口径、拆解问题、复用节点结果整合、产图、成稿与报告包收口。
    report:
      - list_session_resources
      - publish_session_file
      - read_file
      - write_file
      - edit_file
      - execute_python
      - execute_echarts_python
      - create_report_package
      - render_report_package
      - validate_report_package
      - run_agent_workflow
      - list_skills
      - view_skill
    chart:
      - list_session_resources
      - publish_session_file
      - read_file
      - write_file
      - edit_file
      - grep
      - list_directory
      - search_files
      - bash
      - execute_python
      - execute_echarts_python
      - get_jiangxi_noise_data
    # 报告 DAG 历史监测问数子模式：仅监测历史取数与统计核算工具，
    # 不做研判（研判归 noise_expert_analysis），不产图表不成稿
    noise_query_monitoring:
      - list_session_resources
      - publish_session_file
      - read_file
      - write_file
      - execute_python
      - get_jiangxi_noise_data
      - get_jiangxi_noise_statistics
      - get_jiangxi_noise_trends
      - get_jiangxi_noise_directory
      - search_jiangxi_noise_apis
      - describe_jiangxi_noise_api
      - call_jiangxi_noise_api
      - execute_postgres_sql_query
    # 报告 DAG 运行态与达标问数子模式：事件、告警分析、运行状态与
    # GB 3096 合规评价取数，只取数与核算，不做研判不成稿
    noise_query_evaluation:
      - list_session_resources
      - publish_session_file
      - read_file
      - write_file
      - execute_python
      - get_jiangxi_noise_events
      - get_jiangxi_noise_alarm_analysis
      - get_jiangxi_noise_compliance
      - get_jiangxi_noise_runtime_status
      - get_jiangxi_noise_directory
      - search_jiangxi_noise_apis
      - describe_jiangxi_noise_api
      - call_jiangxi_noise_api
      - execute_postgres_sql_query
    # 报告 DAG 声环境研判子模式：优先经 dependencies 复用问数节点 file_path，
    # 轻量补充取证可用本域工具，不重复取数、不成稿不排版
    noise_expert_analysis:
      - list_session_resources
      - publish_session_file
      - read_file
      - write_file
      - execute_python
      - get_jiangxi_noise_data
      - get_jiangxi_noise_statistics
      - get_jiangxi_noise_compliance
      - get_jiangxi_noise_alarm_analysis
      - get_jiangxi_noise_directory
      - search_jiangxi_noise_apis
      - describe_jiangxi_noise_api
      - call_jiangxi_noise_api
      - execute_postgres_sql_query
  # deferred tools opt-in（tool_search 按需注入参数契约，机制见 AGENTS.md
  # 「上下文注入选型策略」）：只接管 query/expert 两个综合模式——它们的
  # 白名单含全部 8 个 get_jiangxi_noise_* 域工具（schema 合计 ~23K 字符），
  # 存根化后每轮常驻省 ~21K 字符（约 7K tok）。三个报告 DAG 子模式的胖
  # schema 是其身份工具且为委派热路径（每个节点都要用 1-2 个），存根会让
  # DAG 节点普遍多付 tool_search 往返，故不 opt-in。
  # always_on 只留分析与交付管道（几乎每轮必用、多轮复用），域工具与
  # list_directory 进存根候选（模型可先 tool_search 取契约，也可凭常用
  # 参数形态盲调，工具自行校验、失败回注完整契约）。≤600 字符小工具
  # （三件套/发布/读写资源等）由 DEFERRED_STUB_SCHEMA_CHAR_FLOOR 自动豁免，
  # ask_user_question 在共享永不存根集合，均无需列出。
  agent_mode_deferred_tools:
    query:
      - execute_python
      - execute_postgres_sql_query
      - execute_echarts_python
      - read_file
      - grep
      - edit_file
      - list_session_resources
    expert:
      - execute_python
      - execute_postgres_sql_query
      - execute_echarts_python
      - read_file
      - grep
      - edit_file
      - list_session_resources
  # 报告 DAG 项目子模式（参照广东 gd_ops_* 做法：按数据域拆分，每个子模式只
  # 暴露本域工具，父 Agent 无法把跨域任务塞给单个节点；跨域取数列入 data_gaps
  # 交父委派）。噪声域站点/城市/区县是同一 API 族的参数分支（无链路差异），
  # 不按层级拆，只按数据域拆问数、按独立问题拆研判。
  agent_workflow_modes:
    noise_query_monitoring:
      positioning: 历史监测问数子 Agent：面向噪声监测历史数据的取数与统计核算
      scope: 站点秒/分/时/日/月季年、城市小时功能区聚合、区县日值的取数与核算，同比环比、分组聚合、缺测核对、目录解析；可按独立取数批次并行部署多个节点
      boundary: 只取数与统计核算，不做成因研判（归 noise_expert_analysis），不产报告图表、不成稿
      outputs: 结构化数据文件（file_path）+ 口径、时间范围和缺口说明（data_gaps）
      max_iterations: 20
      timeout_seconds: 420
    noise_query_evaluation:
      positioning: 运行态与达标问数子 Agent：面向噪声事件、告警与 GB 3096 合规评价的取数与核算
      scope: 噪声事件清单、告警分析、站点运行状态、昼夜达标评价（功能区类别、对应限值、评价时段）；可按独立取数批次并行部署多个节点
      boundary: 只取数与核算，达标判定必须带功能区类别、限值与昼夜口径，不做成因研判、不产报告图表、不成稿
      outputs: 结构化数据文件（file_path）+ 口径、时间范围和缺口说明（data_gaps）
      max_iterations: 20
      timeout_seconds: 420
    noise_expert_analysis:
      positioning: 声环境研判子 Agent：面向超标成因、敏感点影响与声源线索解读的专业判断
      scope: 复用问数节点交付的数据文件开展成因研判、影响范围评估、声源线索解读（置信度只作线索）、治理方向建议，列支持证据、反证与替代解释
      boundary: 只交结论、证据与不确定性（可附 Markdown 备忘录），不负责报告排版、图表版式与报告包收口，不成稿
      outputs: 结构化研判结论（findings/evidence/uncertainties）+ data_gaps
      max_iterations: 24
      # 对标广东 D6 实测：跨节点数据分析 8-12 分钟，900s 为下限
      timeout_seconds: 900
      require_counter_evidence: true
  # report 父策略：子模式边界由 delegation_error 按本清单硬限制（同时挡住共享
  # 大气子模式与综合主模式），预算上限收敛在共享默认值以内
  agent_workflow_parents:
    report:
      child_modes:
      - noise_query_monitoring
      - noise_query_evaluation
      - noise_expert_analysis
      max_concurrency: 3
      max_nodes: 12
      max_retries: 3
      max_extensions: 2
      timeout_seconds: 1800
knowledge:
  collections: []
scheduled_tasks: []
