schema_version: 1
project: jiangxi
modules:
  - legacy
  - jiangxi-noise
frontend:
  theme: default
  brand_name: 江西省噪声智能分析平台
  features:
    era5HistoricalBackfill: false
  agent_modes:
    - query
    - expert
    - report
  default_agent_mode: query
  agent_mode_overrides:
    query:
      name: 智能问数生图智能体
      description: 查询噪声数据、生成图表与统计分析
      welcome:
        description: 查询江西省噪声监测数据，生成可视化图表，快速完成统计分析和结论整理。
        features:
          - 查询江西省噪声站点分钟值、小时值、日均值和城市功能区聚合数据
          - 生成数据图表与可视化展示
          - 完成统计汇总、对比和排名分析
          - 将查询结果整理为清晰的表格和结论
        example: '例如："查询南昌本月噪声监测数据，并生成对比图表"'
      tags:
        - 噪声查询
        - 图表生成
        - 统计分析
    expert:
      welcome:
        description: 面向复杂的噪声污染问题组织多领域专家协同分析，综合监测数据、声场机理与业务经验形成专业判断。
        features:
          - 协同开展噪声监测、声环境敏感点与声源识别分析
          - 诊断噪声超标成因、影响范围与关键影响因素
          - 交叉核验多类证据，识别结论的不确定性
          - 输出专业研判结论与针对性治理建议
        example: '例如："综合分析南昌近期某工业企业噪声投诉的成因，并给出治理建议"'
    report:
      welcome:
        example: '例如："根据本轮噪声分析结果生成一份声环境投诉分析简报"'
  agent_platform_layout: environment-grid
