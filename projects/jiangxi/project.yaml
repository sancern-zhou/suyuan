schema_version: 1
project: jiangxi
modules:
  - legacy
  - jiangxi-noise
frontend:
  theme: default
  brand_name: 江西省噪声智能分析平台
  features: {}
  agent_modes:
    - query
    - expert
    - report
  default_agent_mode: query
  agent_mode_overrides:
    query:
      name: 智能问数生图智能体
      description: 查询噪声数据、生成图表与统计分析
      welcome:
        description: 查询江西省噪声监测数据，生成可视化图表，快速完成统计分析和结论整理。
        features:
          - 查询江西省噪声站点分钟值、小时值、日均值和城市小时聚合数据
          - 生成数据图表与可视化展示
          - 完成统计汇总、对比和排名分析
          - 将查询结果整理为清晰的表格和结论
        example: '例如："查询南昌本月噪声监测数据，并生成对比图表"'
      tags:
        - 噪声查询
        - 图表生成
        - 统计分析
  agent_platform_layout: environment-grid
