      so2:
        name: SO2月均(μg/m³)
        definition: SO2月均(μg/m³)
      no2:
        name: NO2月均(μg/m³)
        definition: NO2月均(μg/m³)
      co95:
        name: CO第95百分位月值(mg/m³)
        definition: CO第95百分位月值(mg/m³)
      o3_8h_90:
        name: O3-8h第90百分位月值(μg/m³)
        definition: O3-8h第90百分位月值(μg/m³)
      goodDays:
        name: 优良天数(当月)
        definition: 优良天数(当月)
      heavyDays:
        name: 重污染天数(当月,2023起才有)
        definition: 重污染天数(当月,2023起才有)
      compositeIndex:
        name: 综合指数(当月)
        definition: 综合指数(当月)
      count:
        name: 记录数
        definition: 记录数
    dimensions:
