    - xuchang_town_day_fetcher
    # 旧云平台：办事处站(tstype=9)5分钟 PM2.5/PM10（必须带 tsno 逐站查询，仅保留30天）
    - xuchang_office_five_minute_fetcher
    # 旧云平台：办事处站小时 PM2.5/PM10（供小时地图与空间高值提醒）
