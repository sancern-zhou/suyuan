schema_version: 1
project: xuchang
modules:
  - legacy
  - satellite
  - xuchang-air-quality
  - xuchang-satellite
frontend:
  theme: default
  brand_name: 许昌市AI应用智能体
  features:
    query_agent_as_default: true
  agent_modes:
    - query
    - expert
    - report
  default_agent_mode: query
  agent_platform_layout: environment-grid
backend:
  tools:
    - get_gems_image
    - get_sentinel5p_image
    - analyze_xuchang_upwind_permit_sources
  disabled_tools:
    - analyze_city_pollutant_rankings
    - get_5min_data
    - get_observed_meteorology
  mode_prompt_files:
    query: projects/xuchang/prompts/query.md
    expert: projects/xuchang/prompts/expert.md
  fetchers:
    - nmc_observed_weather_fetcher
    - nmc_weather_chart_fetcher
    - open_meteo_air_quality_forecast_fetcher
    - xuchang_daily_attainment_forecast_fetcher
    - xuchang_annual_attainment_forecast_fetcher
    - xuchang_cnemc_station_hour_fetcher
    - xuchang_station_deviation_alert_fetcher
    - xuchang_transport_analysis_fetcher
    - gems_xuchang_image_fetcher
knowledge:
  collections:
  - xuchang
scheduled_tasks: []
