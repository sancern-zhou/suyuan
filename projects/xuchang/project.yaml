schema_version: 1
project: xuchang
modules:
  - legacy
  - satellite
  - xuchang-air-quality
  - xuchang-satellite
  - shared-conversations
frontend:
  theme: default
  brand_name: 许昌市AI应用智能体
  features:
    query_agent_as_default: true
    assistant_floating: true
  agent_modes:
    - assistant
    - query
    - knowledge
    - expert
    - report
  default_agent_mode: query
  agent_platform_layout: scenes
  agent_scenes:
    - monitoring
  # 监测分析分组在共享卡片基础上补充知识问答入口（统一从智能体平台进入）。
  agent_scene_overrides:
    monitoring:
      # assistant 是 Web/App 共用助手主模式；office 仅作为办公子 Agent。
      # 平台页助手卡片由共享层按 assistant_floating 统一隐藏（入口=浮球/浮窗与
      # App ?assistant=1 深链），mode_ids 保留 assistant 仅作声明完整性。
      mode_ids: [assistant, query, knowledge, expert, report]
  # 侧边栏不再展示智能体模式快捷入口，统一由智能体平台页进入。
  sidebar_agent_modes: []
  # 平台使用说明面板内容：由 frontend/src/components/management/PlatformGuidePanel.vue 渲染，
  # 字段校验见 frontend/scripts/projectManifest.mjs 的 normalizePlatformGuide。
  platform_guide:
    usage_modes:
    - name: 问数生图
      desc: 自然语言查数据，可自动绘制趋势、对比等图表。
      example: 查 9 月 1—7 日 PM2.5 日均值并画趋势图
    - name: 知识问答
      desc: 检索政策文件与技术规范，业务解读可追溯。
      example: 环境空气质量新旧标准的差别？
    - name: 专家分析
      desc: 综合气象、站点、排放清单等多领域研判成因。
      example: 昨晚 PM2.5 抬升是局地还是区域输送？
    - name: 报告生成
      desc: 自主规划任务、调度其他模式，产出正式文档，耗时一般 10 分钟以上。
      example: 分析 11—12 月气象条件与污染物相关性
    data_groups:
    - title: 空气质量监测数据
      rows:
      - name: 许昌市空气质量小时（中大平台）
        granularity: 1 小时
        range: 2022-01-01 至今
        desc: 城市 AQI、首要污染物、6 项污染物浓度；时间跨度最长，适合长期趋势
      - name: 许昌市空气质量日（中大平台）
        granularity: 1 日
        range: 2022-01-01 至今
        desc: 城市日均浓度、AQI、达标情况；适合年度/季度对比
      - name: 许昌市国控站 5 分钟（中大平台）
        granularity: 5 分钟
        range: 2026-08-26 至今
        desc: PM10、SO2、NO2、CO、O3、NOx；站点快速告警的主要输入
      - name: 许昌市国控站小时（中大平台）
        granularity: 1 小时
        range: 2026-01-01 至今
        desc: 6 个国控站逐小时浓度；PM2.5 告警判定使用该源
      - name: 许昌市国控站日（中大平台）
        granularity: 1 日
        range: 2026-01-01 至今
        desc: 国控站日数据，发布比小时数据晚约 1 天
      - name: 乡镇站小时
        granularity: 1 小时
        range: 2026-01-01 至今
        desc: 76 个乡镇/街道站；用于国控点的污染趋势分析（受接口限制部分时间数据还有缺失，目前在逐步回补）
      - name: 乡镇站日
        granularity: 1 日
        range: 2026-01-01 至今
        desc: 76 个乡镇/街道站；用于国控点的污染趋势分析
      - name: 全省城市数据（发布数据）
        granularity: 小时、日
        range: 2026-10-10 至今
        desc: 全省 18 个城市的小时和日数据及日排名查询；城市月/年累计官方统计见"河南省环境空气质量月报"
      - name: 全省区县数据（发布数据）
        granularity: 小时、日
        range: 2026-10-10 至今
        desc: 全省 190 个区县的小时和日数据及排名查询
      - name: 许昌市月度报表（中大平台）
        granularity: 月
        range: 2021年7月至今
        desc: 城市污染物浓度均值、评价用百分位浓度、分指数与综合指数、空气质量等级分布、总体天数与达标情况、浓度极值、单项达标统计、各污染物超标与污染级别天数、分污染物有效天数与超标率、超标城市统计（区域对比用）、超标强度、单项/唯一超标天数、首要污染物统计等指标查询，支持新旧标准对比
      - name: 许昌市年度报表（中大平台）
        granularity: 年
        range: 2021年至今
        desc: 年度空气质量综合报表查询
      - name: 许昌市 PM2.5 年均值（中大平台）
        granularity: 年
        range: 2021年至今
        desc: 该年 PM2.5 实际统计年均浓度（μg/m3）
      - name: 许昌市 10 县市区官方月报统计（省/国家平台月报）
        granularity: 月、累计
        range: 2020-01 ~ 2026-09
        desc: 许昌市及魏都区、开发区、东城区、示范区、建安区、鄢陵县、襄城县、禹州市、长葛市的官方月度与 1-N 月累计统计（剔除沙尘）：PM2.5、PM10、SO2、NO2、CO-95、O3-8H-90、优良天数、重污染天数（2023 年起）、综合指数；官方发布值，非逐日明细聚合，适合县域长期对比与年度总结
      - name: 河南省环境空气质量月报（官方月报统计）
        granularity: 月、累计
        range: 2025-12 起（逐期发布）
        desc: 全省及 19 个省辖市（区）（含济源示范区、郑州航空港区）、88 个省辖市所辖区、101 个县（市）的官方月度与 1-N 月累计统计及官方同比：PM2.5、PM10、O3、优良天数、重度及以上污染天数、综合指数；城市月度/累计统计的官方口径，可用于许昌在全省的位次与横向对比
      - name: 许昌市年度目标与实际（官方考核定版）
        granularity: 年
        range: 2015 ~ 2026
        desc: 上级下达的年度目标值（PM10、PM2.5、优良天、重污染天，2026 年为在途目标）与国家网口径实际完成值：PM2.5、PM10、SO2、NO2、CO、优良天、重污染天（剔沙尘）、臭氧超标天；年度目标值的唯一来源，年度考核与完成情况问题优先用此数据
      - name: 许昌市 10 县市区年度目标与实际（考核定版）
        granularity: 年
        range: 2020 ~ 2025
        desc: 市本级及 9 个县（市、区）的年度目标、实际值与完成判定（剔除沙尘考核口径）：PM10、PM2.5、优良天、重污染天；重污染天与月报口径在 2023 年差 3—4 天（沙尘天），年度考核以本表为准；2020 年仅重污染天
      - name: 河南省 18 地市年度目标完成情况（省考核）
        granularity: 年
        range: 2021 ~ 2025
        desc: 全省 18 个地市（含济源）的省考核口径目标完成情况：PM10、PM2.5、优良天、重污染天目标与实际、完成判定，2022—2023 年含 5—9 月臭氧超标天数；适合许昌在全省的年度考核横向比较；2025 年省表未定稿，仅目标与判定可用
      - name: 168 城市全国排名（生态环境部）
        granularity: 月、累计
        range: 2026-01 ~ 2026-07
        desc: 全国 168 个重点城市的综合指数与 PM2.5 浓度及排名（倒序，1=最差），当月与 1-N 月累计；仅用于全国排名与城市横向对比，浓度绝对值以本地口径为准
    - title: 气象与空气质量预报数据
      rows:
      - name: 许昌气象实况
        granularity: 1 小时
        range: 2024-12-31 至今
        desc: 温度、湿度、风向/风速、气压、降水
      - name: 气象再分析（边界层高度、云量等）
        granularity: 1 小时
        range: 2025-07-31 至今
        desc: 模式/再分析数据，不是地面站实测
      - name: NMC 许昌小时预报
        granularity: 3 小时
        range: 未来 7 天滚动
        desc: 逐 3 小时的气温、湿度、风向/风速、降水概率
      - name: 中国天气网日预报
        granularity: 1 日
        range: 未来 15 天
        desc: 第 8—15 天为趋势展望，精度低于前 7 天
      - name: 空气质量预报（空气质量发布 APP）
        granularity: 1 日
        range: 未来 7 天
        desc: AQI 范围、等级、首要污染物（来源为环境监测总站）
    - title: 企业门禁、排放和知识资料
      rows:
      - name: 企业门禁数据
        granularity: 日
        range: 2026年4月14日 至今
        desc: 各企业违规次数、违规车辆特征
      - name: 企业排放源清单
        granularity: 年度静态
        range: 清单版本 2026-09
        desc: 约 2300 家有坐标企业
      - name: 排污许可证资料
        granularity: 静态
        range: 1328 家
        desc: 许昌市许可证企业身份、许可污染物、许可附件
      - name: 项目知识库
        granularity: —
        range: 持续更新
        desc: 知识问答、报告口径和业务解释；公开的技术规范、标准、政策文件和已授权资料
backend:
  # 项目专属技能目录（SKILL.md 声明式技能）；解析时组合共享库 backend/docs/skills，项目目录优先。
  skills_dir: projects/xuchang/skills
  tools:
    - get_gems_image
    - get_sentinel5p_image
    - analyze_xuchang_upwind_permit_sources
    - query_xuchang_emission_inventory
    - query_airdata_platform
    - airdata_calc_report_summary
    - xuchang_station_catalog
    - xuchang_cube_metrics
    - query_xuchang_traffic_status
    - execute_crawler_sql_query
  # 共享 prompt builder 的项目补充口径片段（query_monitoring_* 报告 DAG 子模式）：
  # 许昌中台路由与本市口径只在项目片段里维护，共享层保持中性。
  # 固定问数工作流的项目声明：中大 5 分钟数据与 cube 语义层按部署注入
  # 共享问数工作流（共享层不写死任何项目的工具路由）。
  fixed_query_workflow_tools:
    query_monitoring:
      tools: [get_5min_data, xuchang_cube_metrics]
    query_monitoring_station:
      tools: [get_5min_data]
    query_monitoring_city:
      tools: [xuchang_cube_metrics]
  prompt_fragment_files:
    query_monitoring_station: projects/xuchang/prompts/fragments/query_monitoring_station.md
    query_monitoring_city: projects/xuchang/prompts/fragments/query_monitoring_city.md
  agent_mode_tools:
    query:
      - run_agent_workflow
      - call_sub_agent
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - grep
      - read_file
      - write_file
      - edit_file
      - list_directory
      - search_files
      - list_skills
      - view_skill
      - get_weather_data
      - get_current_weather
      - get_weather_forecast
      - query_xcai_city_history
      - execute_sql_query
      - execute_crawler_sql_query
      - execute_bigdata_sql_query
      - execute_postgres_sql_query
      - create_business_chart
      # 网页交互式 ECharts 图表（用户未指定静态报告插图时优先）
      - execute_echarts_python
      - knowledge_graph_query
      - resolve_station_geo
      # 站点周边实时路况（百度地图 Traffic API，实时额度与定时抓取共享）
      - query_xuchang_traffic_status
      - query_national_province_air_quality
      # 【暂时下线 2026-10-27】query_national_city_air_quality 不对 Agent 暴露
      - query_airdata_platform
      - airdata_calc_report_summary
      - xuchang_station_catalog
      - xuchang_cube_metrics
      - execute_python
    expert:
      - run_agent_workflow
      - call_sub_agent
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - knowledge_qa_workflow
      - knowledge_document_reader
      - get_weather_data
      - get_weather_forecast
      - get_universal_meteorology
      - get_current_weather
      # 平台天气图片工具（已裁剪：仅 NMC 中国地面天气形势图一种产品）
      - get_platform_weather_image
      - query_xcai_city_history
      - execute_sql_query
      - execute_crawler_sql_query
      - execute_bigdata_sql_query
      - execute_postgres_sql_query
      # 许昌数据查询工具（中台 + 全国空气质量 + 站点定位）
      - query_airdata_platform
      - airdata_calc_report_summary
      - xuchang_station_catalog
      - xuchang_cube_metrics
      - query_national_province_air_quality
      # 【暂时下线 2026-10-27】query_national_city_air_quality 不对 Agent 暴露
      - resolve_station_geo
      # 实时路况已移交问数模式；专家模式历史路况走 execute_postgres_sql_query（traffic_snapshot）
      - meteorological_trajectory_analysis
      # 许昌源清单与上风向企业分析（企业排放清单 + 排污许可证合并筛查）
      - query_xuchang_emission_inventory
      - analyze_xuchang_upwind_permit_sources
      - create_business_chart
      # 正式报告收口：保存 QMD、渲染 HTML/Word、验收并触发右侧预览
      - create_report_package
      - execute_python
      # PPTX 自由创作（技能 pptx_authoring）的渲染级 QA 验收闭环
      - validate_pptx
      - read_file
      - write_file
      - edit_file
      - grep
      - list_directory
      - search_files
      - list_skills
      - view_skill
    # 报告 DAG 气象专家子模式：仅气象研判工具（共享白名单被本项目 manifest 接管）
    expert_meteorology:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - read_file
      - write_file
      - get_weather_data
      - get_weather_forecast
      - get_universal_meteorology
      - get_current_weather
      # 平台天气图片工具（已裁剪：仅 NMC 中国地面天气形势图一种产品）
      - get_platform_weather_image
      - meteorological_trajectory_analysis
      - resolve_station_geo
      - execute_sql_query
      - execute_python
      - create_business_chart
    # 报告 DAG 常规分析专家子模式：仅监测数据研判工具，气象归因引用上游气象节点
    expert_analysis:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - read_file
      - write_file
      - query_xcai_city_history
      - query_airdata_platform
      - airdata_calc_report_summary
      - xuchang_station_catalog
      - xuchang_cube_metrics
      # 【暂时下线 2026-10-27】query_national_city_air_quality 不对 Agent 暴露
      - execute_sql_query
      - execute_python
      - create_business_chart
    # 报告 DAG 常规空气质量监测问数子模式：仅监测历史取数与核算工具，
    # 不做研判（研判归 expert_analysis），综合 query 不对报告 DAG 暴露
    query_monitoring:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - read_file
      - write_file
      - query_xcai_city_history
      - execute_sql_query
      - execute_crawler_sql_query
      - execute_postgres_sql_query
      - query_airdata_platform
      - xuchang_station_catalog
      - xuchang_cube_metrics
      # 【暂时下线 2026-10-27】query_national_city_air_quality 不对 Agent 暴露
      - resolve_station_geo
      - execute_python
      - create_business_chart
    # 报告 DAG 气象与空气质量预报问数子模式：仅气象实况/预报与预报产品取数工具
    query_forecast:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - read_file
      - write_file
      - get_weather_data
      - get_current_weather
      - get_weather_forecast
      - query_airdata_platform
      - xuchang_station_catalog
      - xuchang_cube_metrics
      - resolve_station_geo
      - execute_postgres_sql_query
      - execute_python
      - create_business_chart
    report:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      # 报告主 Agent 通过 DAG 委托 query/expert 子节点执行数据任务
      - read_file
      - write_file
      - edit_file
      - create_business_chart
      - execute_python
      # PPTX 自由创作（技能 pptx_authoring）的渲染级 QA 验收闭环
      - validate_pptx
      # DOCX/XLSX 自由创作（技能 docx_authoring/xlsx_authoring）的验收闭环
      - validate_office
      # 交互式 HTML 报告成稿（技能 interactive_html_report）：展示主体
      - create_html_artifact
      - create_report_package
      # 通报/报告发布到报告中心（污染原因分析等定时报告任务）
      - publish_report
      - run_agent_workflow
      - list_skills
      - view_skill
    assistant:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - read_file
      - edit_file
      - manage_assistant_memory
      - call_sub_agent
      - run_agent_workflow
      - manage_assistant_runs
      - list_skills
      - view_skill
      - session_search
      - web_search
      - web_fetch
      - manage_assistant_schedule
      - send_notification
  # 广东数据源工具已改为项目专属（共享白名单不含、默认不注册），无需再逐项禁用；
  # 仅保留非项目工具的显式禁用项。
  disabled_tools:
    - get_observed_meteorology
    # 许昌无招投标业务：禁用共享助手白名单携带的招投标工具
    - execute_tender_sql_query
    - zhiliao_tender_detail
    # 助手不需要交互式浏览器（网页检索由 web_search/web_fetch 覆盖）；
    # 注意：项目级禁用对 ppt 子代理同样生效，其网页取证退化为 web_search/web_fetch
    - browser
  # 许昌分支不使用 GIS 交互（问数地图）能力：该开关关闭后，
  # visual_interaction / resolve_map_data_asset / create_map_point_asset /
  # spatial_analysis / spatial_interpolation / map_program 回执等 Agentic GIS 工具
  # 不会被注册，地图交互上下文也不会注入 query 模式提示词。
  # 禁止在本项目任何模式的工具列表中加入上述 GIS 工具或重新打开此开关。
  gis_tools_enabled: false
  mode_prompt_files:
    office: projects/xuchang/prompts/office.md
    query: projects/xuchang/prompts/query.md
    knowledge: projects/xuchang/prompts/knowledge.md
    expert: projects/xuchang/prompts/expert.md
    assistant: projects/xuchang/prompts/assistant.md
    report: projects/xuchang/prompts/report.md
  # 办公子 Agent 的技能草稿只写 .drafts/，不直接发布。
  agent_mode_extra_tools:
    office:
      - create_skill_draft
  fetchers:
    - city_weather_history
    - nmc_observed_weather
    - nmc_weather_chart
    # 小时观测聚合日值（日历日 00-24 北京时），供问数/专家模式直接查询
    - observed_weather_daily
    - xuchang_daily_attainment_forecast_fetcher
    - xuchang_annual_attainment_forecast_fetcher
    - xuchang_city_exceedance_fetcher
    # 省空气质量APP 2026-09 停服，接口不可达；排名改由 xuchang_henan_ranking_recalc_fetcher 重算
    # - xuchang_henan_month_year_accumulate_fetcher
    # 河南实时发布系统：18城市组(含济源)小时/日值 + 全省站点小时/日值
