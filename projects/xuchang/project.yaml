schema_version: 1
project: xuchang
modules:
  - legacy
  - satellite
  - xuchang-air-quality
  - xuchang-satellite
frontend:
  theme: default
  brand_name: 许昌市AI应用智能体
  features:
    query_agent_as_default: true
  agent_modes:
    - assistant
    - query
    - knowledge
    - expert
    - report
  default_agent_mode: query
  agent_platform_layout: scenes
  agent_scenes:
    - monitoring
  # 监测分析分组在共享卡片基础上补充知识问答入口（统一从智能体平台进入）。
  agent_scene_overrides:
    monitoring:
      # assistant 为通用助手入口，其余为专业工作空间；顺序即平台页展示顺序。
      mode_ids: [assistant, query, knowledge, expert, report]
  # 侧边栏不再展示智能体模式快捷入口，统一由智能体平台页进入。
  sidebar_agent_modes: []
backend:
  tools:
    - get_gems_image
    - get_sentinel5p_image
    - analyze_xuchang_upwind_permit_sources
    - query_xuchang_emission_inventory
    - query_airdata_platform
    - airdata_calc_report_summary
    - xuchang_station_catalog
    - xuchang_cube_metrics
    - query_xuchang_traffic_status
  agent_mode_tools:
    query:
      - run_agent_workflow
      - call_sub_agent
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - grep
      - read_file
      - write_file
      - edit_file
      - list_directory
      - search_files
      - list_skills
      - view_skill
      - get_weather_data
      - get_current_weather
      - get_weather_forecast
      - query_xcai_city_history
      - execute_sql_query
      - execute_crawler_sql_query
      - execute_bigdata_sql_query
      - execute_postgres_sql_query
      - create_business_chart
      # 网页交互式 ECharts 图表（用户未指定静态报告插图时优先）
      - execute_echarts_python
      - knowledge_graph_query
      - resolve_station_geo
      # 站点周边实时路况（百度地图 Traffic API，实时额度与定时抓取共享）
      - query_xuchang_traffic_status
      - query_national_province_air_quality
      - query_national_city_air_quality
      - query_airdata_platform
      - airdata_calc_report_summary
      - xuchang_station_catalog
      - xuchang_cube_metrics
      - execute_python
    expert:
      - run_agent_workflow
      - call_sub_agent
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - knowledge_qa_workflow
      - knowledge_document_reader
      - get_weather_data
      - get_weather_forecast
      - get_universal_meteorology
      - get_current_weather
      # 平台天气图片工具（已裁剪：仅 NMC 中国地面天气形势图一种产品）
      - get_platform_weather_image
      - query_xcai_city_history
      - execute_sql_query
      - execute_crawler_sql_query
      - execute_bigdata_sql_query
      - execute_postgres_sql_query
      # 许昌数据查询工具（中台 + 全国空气质量 + 站点定位）
      - query_airdata_platform
      - airdata_calc_report_summary
      - xuchang_station_catalog
      - xuchang_cube_metrics
      - query_national_province_air_quality
      - query_national_city_air_quality
      - resolve_station_geo
      # 实时路况已移交问数模式；专家模式历史路况走 execute_postgres_sql_query（traffic_snapshot）
      - meteorological_trajectory_analysis
      # 许昌源清单与上风向企业分析（企业排放清单 + 排污许可证合并筛查）
      - query_xuchang_emission_inventory
      - analyze_xuchang_upwind_permit_sources
      - create_business_chart
      # 正式报告收口：保存 QMD、渲染 HTML/Word、验收并触发右侧预览
      - create_report_package
      - execute_python
      - read_file
      - write_file
      - edit_file
      - grep
      - list_directory
      - search_files
      - list_skills
      - view_skill
    # 报告 DAG 气象专家子模式：仅气象研判工具（共享白名单被本项目 manifest 接管）
    expert_meteorology:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - read_file
      - write_file
      - get_weather_data
      - get_weather_forecast
      - get_universal_meteorology
      - get_current_weather
      # 平台天气图片工具（已裁剪：仅 NMC 中国地面天气形势图一种产品）
      - get_platform_weather_image
      - meteorological_trajectory_analysis
      - resolve_station_geo
      - execute_sql_query
      - execute_python
      - create_business_chart
    # 报告 DAG 常规分析专家子模式：仅监测数据研判工具，气象归因引用上游气象节点
    expert_analysis:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - read_file
      - write_file
      - query_xcai_city_history
      - query_airdata_platform
      - airdata_calc_report_summary
      - xuchang_station_catalog
      - xuchang_cube_metrics
      - query_national_city_air_quality
      - execute_sql_query
      - execute_python
      - create_business_chart
    # 报告 DAG 常规空气质量监测问数子模式：仅监测历史取数与核算工具，
    # 不做研判（研判归 expert_analysis），综合 query 不对报告 DAG 暴露
    query_monitoring:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - read_file
      - write_file
      - query_xcai_city_history
      - execute_sql_query
      - execute_crawler_sql_query
      - execute_postgres_sql_query
      - query_airdata_platform
      - xuchang_station_catalog
      - xuchang_cube_metrics
      - query_national_city_air_quality
      - resolve_station_geo
      - execute_python
      - create_business_chart
    # 报告 DAG 气象与空气质量预报问数子模式：仅气象实况/预报与预报产品取数工具
    query_forecast:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - read_file
      - write_file
      - get_weather_data
      - get_current_weather
      - get_weather_forecast
      - query_airdata_platform
      - xuchang_station_catalog
      - xuchang_cube_metrics
      - resolve_station_geo
      - execute_postgres_sql_query
      - execute_python
      - create_business_chart
    report:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      # 报告主 Agent 通过 DAG 委托 query/expert 子节点执行数据任务
      - read_file
      - write_file
      - edit_file
      - create_business_chart
      - execute_python
      - create_report_package
      - run_agent_workflow
      - list_skills
      - view_skill
    social:
      - list_session_resources
      - read_session_resource
      - publish_session_file
      - execute_sql_query
      - execute_crawler_sql_query
      - execute_bigdata_sql_query
      - execute_postgres_sql_query
      - query_xcai_city_history
      - get_weather_data
      - get_weather_forecast
      - execute_python
      - create_business_chart
      - knowledge_qa_workflow
      - knowledge_document_reader
      - web_search
      - web_fetch
      - schedule_task
      - send_notification
  # 广东数据源工具已改为项目专属（共享白名单不含、默认不注册），无需再逐项禁用；
  # 仅保留非项目工具的显式禁用项。
  disabled_tools:
    - get_observed_meteorology
    # 许昌无招投标业务：禁用共享助手白名单携带的招投标工具
    - execute_tender_sql_query
    - zhiliao_tender_detail
    # 助手不需要交互式浏览器（网页检索由 web_search/web_fetch 覆盖）；
    # 注意：项目级禁用对 ppt 子代理同样生效，其网页取证退化为 web_search/web_fetch
    - browser
  # 许昌分支不使用 GIS 交互（问数地图）能力：该开关关闭后，
  # visual_interaction / resolve_map_data_asset / create_map_point_asset /
  # spatial_analysis / spatial_interpolation / map_program 回执等 Agentic GIS 工具
  # 不会被注册，地图交互上下文也不会注入 query 模式提示词。
  # 禁止在本项目任何模式的工具列表中加入上述 GIS 工具或重新打开此开关。
  gis_tools_enabled: false
  mode_prompt_files:
    assistant: projects/xuchang/prompts/assistant.md
    query: projects/xuchang/prompts/query.md
    knowledge: projects/xuchang/prompts/knowledge.md
    expert: projects/xuchang/prompts/expert.md
    social: projects/xuchang/prompts/social.md
    report: projects/xuchang/prompts/report.md
  # 通用助手在共享白名单基础上追加的项目专属工具：
  # create_skill_draft 允许助手在用户确认后沉淀技能草稿（只写 .drafts/，不直接发布）。
  agent_mode_extra_tools:
    assistant:
      - create_skill_draft
  fetchers:
    - city_weather_history
    - nmc_observed_weather
    - nmc_weather_chart
    - xuchang_daily_attainment_forecast_fetcher
    - xuchang_annual_attainment_forecast_fetcher
    - xuchang_cnemc_station_hour_fetcher
    - xuchang_city_exceedance_fetcher
    # 省空气质量APP 2026-09 停服，接口不可达；排名改由 xuchang_henan_ranking_recalc_fetcher 重算
    # - xuchang_henan_month_year_accumulate_fetcher
    # 河南实时发布系统：18城市组(含济源)小时/日值 + 全省站点小时/日值
    - xuchang_henan_ssfb_city_publish_fetcher
    - xuchang_henan_ssfb_site_publish_fetcher
    # 省APP已停服：基于SsfbCityDay重算月/年排名(HJ663, 数值低=排名前, 并列)
    - xuchang_henan_ranking_recalc_fetcher
    - xuchang_nmc_hourly_forecast_fetcher
    - xuchang_weather_com_daily_forecast_fetcher
    - xuchang_air_quality_forecast_fetcher
    - xuchang_weather_situation_evidence_fetcher
    - xuchang_station_deviation_alert_fetcher
    - xuchang_station_daily_pollution_fetcher
    # 备用功能，暂不启用：场景二站点日污染超标确认与溯源任务触发
    # - xuchang_station_daily_exceedance_fetcher
    - xuchang_transport_analysis_fetcher
    - xuchang_zhongda_station_minute_fetcher
    - xuchang_zhongda_station_hour_fetcher
    - xuchang_zhongda_city_hour_fetcher
    - gems_xuchang_image_fetcher
  weather_history:
    bootstrap_days: 90
    lookback_days: 7
    online_enabled: true
    # 代表点沿用现有城市气象站定位；许昌保持既有历史点位。
    points:
      - {city: 郑州市, province: 河南省, lat: 34.72, lon: 113.65}
      - {city: 开封市, province: 河南省, lat: 34.78, lon: 114.30}
      - {city: 洛阳市, province: 河南省, lat: 34.82, lon: 112.43}
      - {city: 平顶山市, province: 河南省, lat: 33.74, lon: 113.30}
      - {city: 安阳市, province: 河南省, lat: 36.05, lon: 114.13}
      - {city: 鹤壁市, province: 河南省, lat: 35.75, lon: 114.30}
      - {city: 新乡市, province: 河南省, lat: 35.32, lon: 113.88}
      - {city: 焦作市, province: 河南省, lat: 35.23, lon: 113.25}
      - {city: 濮阳市, province: 河南省, lat: 35.76, lon: 115.03}
      - {city: 许昌市, province: 河南省, lat: 34.036, lon: 113.852}
      - {city: 漯河市, province: 河南省, lat: 33.58, lon: 114.02}
      - {city: 三门峡市, province: 河南省, lat: 34.80, lon: 111.20}
      - {city: 南阳市, province: 河南省, lat: 33.10, lon: 112.48}
      - {city: 商丘市, province: 河南省, lat: 34.45, lon: 115.65}
      - {city: 信阳市, province: 河南省, lat: 32.13, lon: 114.05}
      - {city: 周口市, province: 河南省, lat: 33.63, lon: 114.70}
      - {city: 驻马店市, province: 河南省, lat: 32.93, lon: 113.92}
      - {city: 济源市, province: 河南省, lat: 35.08, lon: 112.58}
knowledge:
  collections:
  - xuchang
scheduled_tasks:
  - task_xuchang_station_deviation_alert
  - task_xuchang_station_daily_source_report
  - task_xuchang_station_daily_source_analysis_report
  - task_xuchang_weekly_weather_situation_report
  - task_xuchang_mee_cnemc_weekly_news
