      - {city: 南阳市, province: 河南省, lat: 33.10, lon: 112.48}
      - {city: 商丘市, province: 河南省, lat: 34.45, lon: 115.65}
      - {city: 信阳市, province: 河南省, lat: 32.13, lon: 114.05}
      - {city: 周口市, province: 河南省, lat: 33.63, lon: 114.70}
      - {city: 驻马店市, province: 河南省, lat: 32.93, lon: 113.92}
      - {city: 济源市, province: 河南省, lat: 35.08, lon: 112.58}
  # 共享工具 query_xcai_city_history 的项目级屏蔽规则：许昌本市数据不走城市发布历史
  # 通道（官方口径以中大平台为准），命中即拒绝并给改道指引。
  tool_options:
    # 共享工具 execute_sql_query 的许昌配置：受限表白名单 + 国控站长历史路由文案。
    # 内容来自共享层原 XUCHANG_MONITORING_SQL_TABLES/XUCHANG_CRAWLER_TABLE_HINTS/
    # _build_xuchang_schema_guide（行为逐字节等价迁移，2026-11-17）。
    execute_sql_query:
      allowed_tables:
      - city_aqi_publish_history
      - CityDayAQIPublishHistory
      - CityAQIPublishHistory
      - CurrentAirQuality
      - XuchangNmcHourlyWeatherForecast
      - dbo.XuchangNmcHourlyWeatherForecast
      - XuchangWeatherComDailyForecast
      - dbo.XuchangWeatherComDailyForecast
      - dat_zhongda_station_minute
      - dat_zhongda_station_hour
      - dat_zhongda_city_hour
      - WeatherForecast7Day
      - city_168_statistics_new_standard
      - city_168_statistics_old_standard
      - province_statistics_new_standard
      - province_statistics_old_standard
      - information_schema.columns
      - information_schema.tables
      exclude_tables: [openmeteoairqualityforecast72h]
      alternate_table_hints:
        dat_station_hour: >-
          许昌国控站点小时/日长历史不通过 execute_sql_query 查询；请改用 execute_crawler_sql_query，并按其工具描述中的真实表字段契约生成查询。
        dat_station_day: >-
          许昌国控站点小时/日长历史不通过 execute_sql_query 查询；请改用 execute_crawler_sql_query，并按其工具描述中的真实表字段契约生成查询。
      schema_description: |-
        监测数据SQL Server查询工具（许昌）。二选一：describe_table 查表结构，或 sql 执行 SELECT。硬约束：只允许 SELECT；最大 1000 条；中文串加 N 前缀；分页用 TOP。database 默认 XcAiDb。
        【常用表索引】WeatherForecast7Day(7天预报)/XuchangNmcHourlyWeatherForecast(NMC逐3小时气象)/XuchangWeatherComDailyForecast(许昌1-15日)/CurrentAirQuality(当前+今明摘要)/CityAQIPublishHistory·CityDayAQIPublishHistory(城市小时·日)/dat_zhongda_station_minute·hour·city_hour(中大平台)/city_168_statistics_*·province_statistics_*(统计)。
        【路由】国控站点小时/日长历史改用 execute_crawler_sql_query；国控站点日值（日及以上）优先 query_airdata_platform（v_s_d_app_145/v_s_d_src_145），长历史才用 crawler StationDay。各表字段与样例行用 describe_table 获取。

        【高频表口径规则】字段清单用 describe_table 获取，此处只列硬规则。城市/区划名称与代码从项目上下文获取，不得把 {city_name}/{city_code} 模板变量原样写进 SQL；不同表的城市字段不同，禁止跨表套用字段名。
        【数据源优先级】国控站点小时/日长历史与城市长历史使用 execute_crawler_sql_query。中大平台站点5分钟/小时数据仍使用本工具的 dat_zhongda_station_minute/dat_zhongda_station_hour。
        【预报数据源优先级】未来逐3小时气象预报优先 XuchangNmcHourlyWeatherForecast（NMC 官方，7天）；中国天气网日预报与之同源归并。
        【气象边界】许昌气象实况与历史网格用 get_weather_data（本工具无许昌气象表，dat_weather_hour 无许昌数据）；边界层高度/短波辐射缺口直接 get_weather_forecast；许昌城区 1-15 日日预报只查 XuchangWeatherComDailyForecast（city_code='101180401'，已含温度/天气/风向风力，勿再叠加其他源）。
        【字段陷阱】PM2.5 列名=PM2_5（非 PM25）；日值列带 _24h 后缀（臭氧为 O3_8h_24h）；中大表城市字段=area、站点=station_code、时间=time_point，须过滤 data_table_type='Act' AND parameter_type='gp'；无效值站点表 -99 / 城市表 -999，统计前必须排除；质量标记列（*_mark）非空表示带标记值，慎用于统计；dat_zhongda_city_hour 查 2026 年数据必须加 data_type_plan='155th'（用错规划期返回空）；city_168/province_statistics 同名双标准表注意新旧。
    # 共享工具 execute_postgres_sql_query 的许昌扩展：路况/告警结果表白名单追加
    # 与许昌路由口径注记（2026-11-17 自共享层描述迁入）。
    execute_postgres_sql_query:
      allowed_tables_extra:
      - traffic_snapshot
      - traffic_section
      - v_station_traffic_hourly
      - xuchang_station_alert_episodes
      schema_notes: |-
        【许昌路况时序】traffic_snapshot 路况快照（6 分钟时隙，slot_at 为 UTC；evaluation_status 0未知~4严重拥堵）；traffic_section 以 snapshot_id 关联；v_station_traffic_hourly 按 station_code+小时聚合，可与空气质量小时数据 join；缺失时隙=未采集不可回补，实时路况用 query_xuchang_traffic_status。
        【站点快速告警结论】查站点快速抬升告警结论必须加 task_id = 'task_xuchang_station_deviation_alert'（conclusion 结论 / broadcast_message 通报正文；findings、image_paths 为 JSON 列）；xuchang_station_alert_episodes 一行一个告警过程，event_ids 可关联 scheduled_task_results.event_id 取历次结论。
        【站点编码】observed_weather_data 的许昌站编码 ZzMTA。
        【示例】SELECT completed_at, station_name, conclusion, broadcast_message FROM scheduled_task_results WHERE task_id = 'task_xuchang_station_deviation_alert' ORDER BY completed_at DESC LIMIT 20。
    query_xcai_city_history:
      blocked_city_names: [许昌, 许昌市]
      blocked_guidance: >-
        许昌市数据不在城市发布历史（XcAiDb）通道开放范围：许昌官方口径以中大平台为准。
        请改用 query_airdata_platform（城市日 v_c_d_sb_145/v_c_d_sb_155；月度及以上统计用
        airdata_calc_report_summary）或 execute_crawler_sql_query（CityHour/CityDay 长历史）查询许昌。
