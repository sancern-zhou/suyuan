    # 旧云平台：省控站(tstype=3)小时六参数（平台省控仅小时粒度，仅保留30天）
    - xuchang_shengkong_station_fetcher
    # ④污染原因分析：许昌PM2.5日均高于相邻五市均值30%（轻度污染及以上为20%）触发通报（微信群+APP）
    - xuchang_pollution_cause_trigger_fetcher
    # ①月度特征分析：每月2日上月证据包（APP 推局长/科长）
