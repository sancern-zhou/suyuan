org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Cap the Kotlin compile worker heap: the default requests ~1.6 GB physical memory and
# Gradle waits forever when the machine's free memory is below that.
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Required when the Android project is checked out under a Chinese Windows
# path such as D:\u6eaf\u6e90; AGP otherwise aborts before configuration.
android.overridePathCheck=true
