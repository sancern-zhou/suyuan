# 统一入口网关：监听 8092（公网 113.108.142.147:8093 NAT 映射到本机 8092）
#   /          -> 运维平台（IIS Operation 站点，已从 8092 改绑 8094）
#   /suyuan/   -> 智能体平台（deploy-local/serve-frontend.mjs : 5176，内部再分流静态/API/认证/WS）
# 独立实例：与 L:\nginx 默认实例互不影响，前缀为本目录。
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log info;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    # 保持空闲连接长于浏览器自身的复用窗口，避免服务端先关连接后
    # 浏览器仍在旧连接上发 POST（非幂等请求不会自动重试，表现为 Failed to fetch）。
    keepalive_timeout 600s;
    # 0 = 不限制请求体大小，保持与此前 NAT 直通 IIS 时一致的上传行为
    client_max_body_size 0;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8092;

        # ---- 智能体平台 ----
        location = /suyuan {
            return 301 /suyuan/;
        }
        location /suyuan/ {
            proxy_pass http://127.0.0.1:5176;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 对话 SSE 流式输出与 WebSocket 不能被缓冲
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- 运维平台（保持原有访问地址不变） ----
        location / {
            proxy_pass http://127.0.0.1:8094;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
