name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full Git history for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.2 \
            --config /repo/.gitleaks.toml \
            git --no-banner --redact --log-opts=--all /repo

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q --no-header --tb=line

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: |
          npm run test:project-config
          npm run test:auth
          npm run test:event-tasks
          npm run test:images
          npm run test:agent-platform
          npm run test:composer

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build standalone bundle
        run: npm run build:standalone
      - name: Verify unified resource interface in bundle
        run: |
          grep -R "resources?presentation_type=document" dist/assets
          if grep -R "/office-documents" dist/assets; then
            echo "legacy /office-documents API must not be present" >&2
            exit 1
          fi
          if grep -R "/visualizations" dist/assets; then
            echo "legacy /visualizations API must not be present" >&2
            exit 1
          fi
