name: backend_py311
channels:
  - conda-forge
  - defaults
dependencies:
  # Keep this aligned with Dockerfile and pyproject.toml.
  - python=3.11
  
  # Scientific computing (conda packages for better compatibility)
  - numpy=1.26.3
  - pandas=2.2.3
  - scipy
  - numba
  
  # ODE Solver (key package for PyBox)
  - assimulo
  
  # NetCDF/GRIB data processing
  - xarray
  - netcdf4
  - cfgrib
  - eccodes
  
  # Database drivers
  - asyncpg
  - pyodbc
  
  # Python application dependencies are maintained in requirements.txt.
  - pip
  - pip:
    - -r requirements.txt
