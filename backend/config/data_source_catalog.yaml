# 数据源地图：Agent 取数路由知识（单一事实源）
# 规则（Anthropic context engineering：最小高信号集）：
# - 只收录实际踩过坑或高频使用的数据域，按失败模式迭代，禁止穷举
# - route=tool 的 locator 必须是已注册工具名（守卫测试校验）
# - 字段细节不进地图，由 describe_table / 工具 schema 按需提供
# - 工具名或表名变更时必须同步更新本文件

sources:
  - domain: 空气质量（语义层：河南18城市组含济源排名/小时日值 + 许昌县级站）
    route: tool
    locator: xuchang_cube_metrics
    usage: "优先用本工具点数查询（免写SQL）：SsfbCityRanking（月/年排名，RankZong 升序=1 最优，含济源，需 periodType+period 过滤）/SsfbCityHour/SsfbCityDay（城市小时日值）/SsfbSiteHour/SsfbSiteDay（许昌县级站，County 字段做区县口径）；排名规则=数值越低越靠前，相同值并列"
    granularity: 逐小时/逐日/月年累计
    caveats: "数据窗口 2026-10-03 起（源仅保留 8 天滚动+每日累积）；OfficialZong/OfficialRank 为省APP官方对照（≤2026-08）勿与重算值混用；编码解析（城市/县级站）用 xuchang_station_catalog"

  - domain: 空气质量（河南实时发布：18城市组含济源 + 许昌县级站 + 本地重算排名）
    route: tool
    locator: execute_crawler_sql_query + xuchang_station_catalog
    usage: "采集库 MySQL：SsfbCityHour/SsfbCityDay（18 城市组，GroupID 过滤，济源在既有发布历史中长期缺失可用此表补）/SsfbSiteHour/SsfbSiteDay（许昌县级站，SiteID 过滤）/SsfbCityRanking（月/年累计排名，HJ663 重算，RankZong 升序=1 最优，数值低=前，相同值并列）；常规指标优先走 xuchang_cube_metrics，本路由用于语义层未覆盖的明细/自定义查询；编码不可猜，先用 xuchang_station_catalog 解析（action=lookup_henan_cities 取城市 GroupID，station_type=county 取县级站编码）"
    granularity: 逐小时/逐日/月年累计
    caveats: "源仅保留约最近 8 天且日值次日发布，不能做同比/历史回看；源日值接口 2026-10 起不发布 PM10（重算排名时由小时均值补齐）；日值发布后才能算，排名任务在每日 06:10；区县口径用 SsfbSiteHour 的 County 字段聚合；省 APP 2026-09 起停服，官方排名仅作 SsfbCityRanking 的 OfficialZong/OfficialRank 对照列（≤2026-08）"

  - domain: 空气质量（国控站点/城市长历史，2016 起）
    route: tool
    locator: execute_crawler_sql_query
    usage: "采集库 MySQL：StationHour/CityHour/StationDay/CityDay/CityYearPm25Avg/Station；字段契约见工具描述（由真实库生成，大小写敏感）"
    granularity: 逐小时/逐日/逐年
    caveats: "审核标记列命名跨表不一致（StationDay=COMark、CityDay=CO_Mark）；查询失败的返回会附真实字段清单，直接据此修正"

  - domain: 空气质量（国控城市发布历史，SQL Server 白名单）
    route: sql
    locator: city_aqi_publish_history / CityDayAQIPublishHistory / CityAQIPublishHistory
    usage: "execute_sql_query 白名单表；字段口径 PM2.5=pM2_5_Decimal、臭氧8小时=o3_8h"
    granularity: 逐小时/逐日（仅城市口径）
    caveats: "仅城市口径，无任何站点表；站点小时/日历史直接用 execute_crawler_sql_query，不要在本工具试探站点表名"

  - domain: 气象（历史实况与预报）及空气质量预报
    route: tool
    locator: get_weather_data / get_weather_forecast / query_airdata_platform
    usage: "历史实况回看与多时效预报用 get_weather_data/get_weather_forecast（lat/lon + past_days/hourly/daily）；空气质量预报产品用 query_airdata_platform；交付时标注起报时间与时效"
    granularity: 逐小时/3小时间隔/逐日
    caveats: "预报数据的静稳/扩散形势研判归 expert_meteorology；平台 SQL 库（execute_sql_query/execute_crawler_sql_query/execute_postgres_sql_query）均无气象实况表，禁止在其中寻找气象数据"

  - domain: 空气质量（全国城市对比）
    route: tool
    locator: query_national_city_air_quality
    usage: "全国城市六参数浓度与 AQI 对比、排名类分析"
