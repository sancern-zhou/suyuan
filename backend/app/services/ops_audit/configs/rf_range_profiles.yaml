          ESA: {min: 500, max: 950, unit: V}
          THERMO: {min: -1200, max: 0, unit: V}
          TH: {min: -1100, max: -500, unit: V}
          DASIBI: {min: 500, max: 900, unit: V}
      # :274-279 反应室温度；ESA 为 mV 信号，语义不同，不建模（测试锁定不审）
      - key: reaction_temperature
        label: 反应室温度
        field: FYCHECKVALUE
        ranges:
          API: {min: 49, max: 51, unit: ℃}
          EC: {min: 47, max: 53, unit: ℃}
          FPI: {min: 49, max: 51, unit: ℃}
          DASIBI: {min: 42.5, max: 43.5, unit: ℃}
          THERMO: {min: 48, max: 52, unit: ℃}
          TH: {min: 45, max: 55, unit: ℃}
          XH: {min: 49, max: 51, unit: ℃}
      # :291-296 转化炉温度
      - key: converter_temperature
        label: 转化炉温度
        field: ZHLCHECKVALUE
        ranges:
          API: {min: 310, max: 320, unit: ℃}
          EC: {min: 315, max: 335, unit: ℃}
          FPI: {min: 305, max: 350, unit: ℃}
          THERMO: {min: 300, max: 350, unit: ℃}
          TH: {min: 180, max: 360, unit: ℃}
          DASIBI: {min: 260, max: 290, unit: ℃}
          XH: {min: 310, max: 320, unit: ℃}
      # :307-312 反应室压力（测量室内部真空压）；EC 行在源码中被 Razor 注释，不建模
      - key: reaction_pressure
        label: 反应室压力
        field: FYSHICHECKVALUE
        ranges:
          API: {max: 10, operator: "<", unit: In-Hg-A}
          FPI: {min: 0, max: 15, unit: psia}
          ESA: {min: 133, max: 433, unit: mV}
          XH: {min: 13, max: 34, unit: kPa}
      # :324-329 采样压力（样气压力/试样压力）
      - key: sample_pressure
        label: 采样压力
        field: CYYLCHECKVALUE
        ranges:
          API: {min: 25, max: 30, unit: In-Hg-A}
          EC: {min: 75, max: 375, unit: TORR}
          FPI: {min: 0, max: 15, unit: psia}
          ESA: {min: 408, max: 610, unit: mV}
          THERMO: {min: 150, max: 300, unit: mmHg}
          TH: {min: 60, max: 110, unit: kPa}
          DASIBI: {min: 8, max: 40, unit: kPa}
          XH: {min: 84, max: 102, unit: KPa}
      # :342-346 NOx 斜率
      - key: nox_slope
        label: NOx斜率
        field: NOXYLCHECKVALUE
        ranges: &nox_slope_ranges
          API: {min: 0.7, max: 1.3}
          FPI: {min: 0.85, max: 1.15}
          THERMO: {min: 0.500, max: 2.000}
          TH: {min: 0.5, max: 2}
          XH: {min: 0.7, max: 1.3}
      # :357-362 NOx 截距
      - key: nox_offset
        label: NOx截距
        field: NOXJGCHECKVALUE
        ranges:
          API: {min: -10, max: 150, unit: mV}
          FPI: {min: -20, max: 50, unit: ppb}
          THERMO: {min: 0, operator: ">"}
          TH: {min: -50, max: 50, unit: ppb}
          XH: {min: -100, max: 100, unit: mV}
      # :375-395 NO 斜率/截距；源码中先河另有一条被注释的 0.111~0.141，按渲染文本 1±0.3 处理
      - key: no_slope
        label: NO斜率
        field: NOYLCHECKVALUE
        ranges: *nox_slope_ranges
      - key: no_offset
        label: NO截距
        field: NOJGCHECKVALUE
        ranges:
          API: {min: -50, max: 150, unit: mV}
          FPI: {min: -20, max: 50, unit: ppb}
          THERMO: {min: 0, operator: ">"}
          TH: {min: -50, max: 50, unit: ppb}
          XH: {min: -160, operator: ">=", unit: mV}

