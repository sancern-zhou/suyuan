pm_weekly_check_profiles:
  RF_W_PMCHECK:
    display_name: PM周检
    brand_field: DEVICEBRAND
    pollutant_field: POLLUTANTTYPE
    pollutant_values: ["PM10", "PM2.5", "PM25"]
    brand_aliases:
      THERMO: ["THERMO", "Thermo", "TE", "赛默飞", "热电", "赛默飞世尔"]
    fields:
      - key: main_flow
        label: 流量(Main Flow)
        field: MAINFLOWVALUE
        ranges:
          THERMO: {min: 15.87, max: 17.54, unit: L/min}
      - key: air_temperature
        label: 采样管温度(Air.Temp)
        field: AIRTEMPVALUE
        ranges:
          THERMO: {max: 50, operator: "<=", unit: ℃}
