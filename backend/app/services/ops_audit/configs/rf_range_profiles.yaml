# RF form range check profiles for operations work order audits
#
# 权威口径（2026-11-04 复核）：广东运维平台源码视图“正常范围”列文本。
# 证据文件（D:/广东运维平台/trunk/SummerFresh.MVC/Views/ReportForms/）：
#   RF_W_GASEOUSCHECK_CO.cshtml:155-302
#   RF_W_GASEOUSCHECK_NOX.cshtml:190-415
#   RF_W_GaseousCheck_O3.cshtml:157-265
#   RF_W_GaseousCheck_SO2.cshtml:189-336
#   RF_W_PmCheck.cshtml:53-75
#
# 约定：
# 1) 平台对这些周检表没有服务端数值校验，品牌阈值只存在于上述视图文本；本文件是其结构化复刻。
# 2) *CHECKROW 是异常处理记录、*REGION 是人工填写范围，都不是阈值，不建模。
# 3) DEVICEBRAND 由设备主数据填充为品牌代码（FPI/TE/...），视图阈值写中文标签；中文别名统一在下节维护。
# 4) 业务显式覆盖源码的条目必须带 override 注释，并登记到
#    projects/guangdong/docs/audit-rule-source-governance.md。
# 5) 旧配置 check_value_fields/brand_ranges 引用了平台不存在的 DISPLAYVALUE/MEASUREVALUE/SENSORVALUE 列，
#    已下线（2026-11-04）；保留 gas_type_mapping 供 RF_RANGE_BY_GAS_TYPE_MISMATCH 使用。

# 公共品牌别名（单一来源；profile 内 brand_aliases 可覆盖）
# “TH”在历史数据里既可能是天虹也可能是赛默飞：代码按型号 2001H-2004H 判天虹，否则 THERMO。
brand_aliases:
  API: ["API"]
  FPI: ["FPI", "聚光", "聚光科技"]
  ESA: ["ESA"]
  THERMO: ["THERMO", "Thermo", "TE", "赛默飞", "热电", "赛默飞世尔"]
  TH: ["TH", "天虹", "武汉天虹"]
  DASIBI: ["DASIBI", "大西比", "Dasibi"]
  XH: ["XH", "新先河", "先河环保", "先河"]
  EC: ["EC"]
  LD: ["LD", "力合", "力合科技"]

# Gas type detection by table and field
gas_type_mapping:
  RF_W_GASEOUSCHECK_CO:
    field: POLLUTANTTYPE
    gas_type: CO
    aliases: ["一氧化碳"]
  RF_W_GASEOUSCHECK_NOX:
    field: POLLUTANTTYPE
    gas_type: NOX
    aliases: ["NO", "NO2", "氮氧化物"]
  RF_W_GASEOUSCHECK_O3:
    field: POLLUTANTTYPE
    gas_type: O3
    aliases: ["臭氧"]
  RF_W_GASEOUSCHECK_SO2:
    field: POLLUTANTTYPE
    gas_type: SO2
    aliases: ["二氧化硫"]

co_weekly_check_profiles:
  RF_W_GASEOUSCHECK_CO:
    display_name: CO
    brand_field: DEVICEBRAND
    pollutant_field: POLLUTANTTYPE
    pollutant_values: ["CO", "一氧化碳"]
    fields:
      # RF_W_GASEOUSCHECK_CO.cshtml:165-170 测量信号（测量电压）
      - key: measurement_signal
        label: 测量信号
        field: GYCHECKVALUE
        ranges:
          API: {min: 2500, max: 4800, unit: mV}
          FPI: {min: 1, max: 4, unit: V}
          TH: {min: 2000, max: 10000, unit: mV}
          XH: {min: 300, max: 3000, unit: mV}
      # :180-186 参比信号（参比电压）
      - key: reference_signal
        label: 参比信号
        field: PMTCHECKVALUE
        ranges:
          API: {min: 2500, max: 4800, unit: mV}
          FPI: {min: 1, max: 4, unit: V}
          TH: {min: 2000, max: 10000, unit: mV}
          DASIBI: {min: 5000, max: 9000, unit: mV}
          XH: {min: 300, max: 3000, unit: mV}
      # :196-200 测量信号（参比信号）；大西比为零气/标气两组信号，单一区间无法表达，暂不建模
      - key: measurement_reference_signal
        label: 测量信号(参比)
        field: CBCHECKVALUE
        ranges:
          API: {min: 1.17, max: 1.22}
          FPI: {min: 1.1, max: 1.3}
          XH: {min: 2000, max: 4900, unit: mV}
      # :207-213 采样压力（样气压力）
      - key: sample_pressure
        label: 采样压力
        field: CYYLCHECKVALUE
        ranges:
          API: {min: 25, max: 35, unit: In-Hg-A}
          EC: {min: 430, max: 800, unit: TORR}
          FPI: {min: 7, max: 15, unit: PSIA}
          THERMO: {min: 250, max: 1000, unit: mmHg}
          TH: {min: 50, max: 110, unit: kPa}
          DASIBI: {min: 79, max: 106, unit: kPa}
          XH: {min: 50, max: 102, unit: kPa}
      # :219-224 采样流量（试样流量/样气）
      - key: sample_flow
        label: 采样流量
        field: CYLLCHECKVALUE
        ranges:
          API: {min: 720, max: 880, unit: ml/min}
          EC: {min: 0.5, max: 1.1, unit: L/min}
          FPI: {min: 720, max: 880, unit: SCCM}
          THERMO: {min: 0.350, max: 1.500, unit: L/min}
          TH: {min: 300, max: 1200, unit: ml/min}
          DASIBI: {min: 0.8, max: 1.2, unit: L/min}
          XH: {min: 900, max: 1100, unit: ml/min}
      # :234-238 样品温度
      - key: sample_temperature
        label: 样品温度
        field: FYCHECKVALUE
        ranges:
          API: {min: 44, max: 52, unit: ℃}
          FPI: {min: 15, max: 55, unit: ℃}
          THERMO: {min: 8, max: 47, unit: ℃}
          DASIBI: {min: 20, max: 45, unit: ℃}
          XH: {min: 47, max: 49, unit: ℃}
      # :244-250 光室温度（光学室温度）
      - key: optical_temperature
        label: 光室温度
        field: GSWDCHECKVALUE
        ranges:
          API: {min: 46, max: 50, unit: ℃}
          FPI: {min: 47, max: 49, unit: ℃}
          ESA: {min: 380, max: 500, unit: mV}
          THERMO: {min: 40, max: 52, unit: ℃}
          TH: {min: 0, max: 60, unit: ℃}
          DASIBI: {min: 40, max: 45, unit: ℃}
          XH: {min: 47, max: 49, unit: ℃}
      # :257-262 相关轮温度（GFC轮温度）
      - key: gfc_temperature
        label: 相关轮温度
        field: GFCCHECKVALUE
        ranges:
          API: {min: 66, max: 70, unit: ℃}
          FPI: {min: 66, max: 70, unit: ℃}
          DASIBI: {min: 43, max: 45, unit: ℃}
          XH: {min: 58, max: 78, unit: ℃}
      # :268-275 斜率（Slope）
      - key: slope
        label: 斜率
        field: YLCHECKVALUE
        ranges:
          API: {min: 0.7, max: 1.3}
          FPI: {min: 0.85, max: 1.15}
          THERMO: {min: 0.500, max: 2.000}
          TH: {min: 0.5, max: 2}
          XH: {min: 0.7, max: 1.3}
      # :281-286 截距（Offset）
      # override：源码对聚光写“-200～500”且未标单位，暂按数值区间审；单位待业务确认。
      # LD 为业务扩展品牌，源码视图未给阈值。
      - key: offset
        label: 截距
        field: JGCHECKVALUE
        ranges:
          API: {min: -5, max: 5, unit: mV}
          FPI: {min: -200, max: 500}
          THERMO: {min: -10.75, operator: ">", unit: ppm}
          TH: {min: -5, max: 5, unit: ppm}
          XH: {min: -6, max: 6, unit: umol/mol}
          LD: {min: -5, max: 5, unit: mV}

o3_weekly_check_profiles:
  RF_W_GASEOUSCHECK_O3:
    display_name: O3
    brand_field: DEVICEBRAND
    pollutant_field: POLLUTANTTYPE
    pollutant_values: ["O3", "臭氧"]
    fields:
      # RF_W_GaseousCheck_O3.cshtml:170-173 测量信号
      - key: measurement_signal_a
        label: 测量信号A
        field: GYCHECKVALUE
        ranges: &o3_signal_ranges
          API: {min: 2500, max: 4800, unit: mV}
          FPI: {min: 1.5, max: 4.096, unit: V}
          ESA: {min: 500, max: 4800, unit: mV}
          THERMO: {min: 45000, max: 150000, unit: HZ}
          TH: {min: 2300, max: 5200, unit: mV}
          XH: {min: 2000, max: 4900, unit: mV}
      - key: measurement_signal_b
        label: 测量信号B
        field: GYBCHECKVALUE
        ranges: *o3_signal_ranges
      - key: reference_signal_a
        label: 参比信号A
        field: ZWDCHECKVALUE
        ranges: *o3_signal_ranges
      - key: reference_signal_b
        label: 参比信号B
        field: ZWDBCHECKVALUE
        ranges: *o3_signal_ranges
      # :209-212 压力（样气压力）；API“环境压力-2 In-Hg-A”语义模糊，保留现口径
      - key: sample_pressure
        label: 压力
        field: CYYLCHECKVALUE
        ranges:
          API: {max: 32, unit: In-Hg-A, operator: "<="}
          EC: {min: 400, max: 800, unit: TORR}
          FPI: {min: 7, max: 15, unit: psia}
          THERMO: {min: 200, max: 1000, unit: mmHg}
          TH: {min: 50, max: 110, unit: kPa}
          DASIBI: {min: 90, max: 106, unit: kPa}
          XH: {min: 50, max: 102, unit: kPa}
      # :221-224 采样流量
      - key: sample_flow_a
        label: 采样流量A
        field: CYLLCHECKVALUE
        ranges: &o3_flow_ranges
          API: {min: 720, max: 880, unit: ml/min}
          EC: {min: 0.25, max: 0.55, unit: LPM}
          FPI: {min: 720, max: 880, unit: SCCM}
          THERMO: {min: 0.400, max: 1.400, unit: L/min}
          TH: {min: 300, max: 1200, unit: ml/min}
          DASIBI: {min: 1.2, max: 1.7, unit: L/min}
          XH: {min: 720, max: 880, unit: ml/min}
      - key: sample_flow_b
        label: 采样流量B
        field: CYLLBCHECKVALUE
        ranges: *o3_flow_ranges
      # :235-238 样品温度（光室内温度）；源码未给聚光/EC 阈值
      - key: sample_temperature
        label: 样品温度
        field: FYCHECKVALUE
        ranges:
          API: {min: 10, max: 50, unit: ℃}
          THERMO: {min: 15, max: 45, unit: ℃}
          TH: {min: 30, max: 70, unit: ℃}
          DASIBI: {min: 20, max: 43, unit: ℃}
          XH: {min: 0, max: 55, unit: ℃}
      # :251-254 斜率
      - key: slope
        label: 斜率
        field: YLCHECKVALUE
        ranges:
          API: {min: -0.5, max: 2.5}
          FPI: {min: 0.85, max: 1.15}
          THERMO: {min: 0.500, max: 2.000}
          TH: {min: 0.5, max: 2}
          XH: {min: 0.5, max: 1.5}
      # :262-265 截距
      - key: offset
        label: 截距
        field: JGCHECKVALUE
        ranges:
          API: {min: -5, max: 5, unit: ppb}
          FPI: {min: -20, max: 50, unit: ppb}
          THERMO: {min: -26.5, operator: ">"}
          TH: {min: -50, max: 50}
          XH: {min: -5, max: 5, unit: mV}

