    fields: [POLLUTANTTYPE]
    severity: 高
  - table: RF_W_GASEOUSCHECK_O3
    expected: O3
    fields: [POLLUTANTTYPE]
    severity: 高
  - table: RF_W_GASEOUSCHECK_SO2
    expected: SO2
    fields: [POLLUTANTTYPE]
    severity: 高
  - table: RF_Q_GASEOUSMULTIPOINT_CO
    expected: CO
    fields: [POLLUTANTTYPE]
    severity: 高
  - table: RF_Q_GASEOUSMULTIPOINT_NO2
    expected: NO2
    fields: [POLLUTANTTYPE]
    severity: 高
