# RF field-position heuristic profiles.

tables:
  RF_M_GASEOUSFLOWCHECK:
    range_text_fields:
      - DISPLAYVALUESO2
      - MEASUREDVALUESO2
      - DISPLAYVALUENO2
      - MEASUREDVALUENO2
      - DISPLAYVALUECO
      - MEASUREDVALUECO
      - DISPLAYVALUEO3
      - MEASUREDVALUEO3
    swap_formula_checks:
      - id: monthly_so2_flow_error
        label: SO2 月度气态流量误差
        left_field: DISPLAYVALUESO2
        right_field: MEASUREDVALUESO2
        error_field: MEASUREDERRORSO2
        tolerance: 0.2
      - id: monthly_no2_flow_error
        label: NO2 月度气态流量误差
        left_field: DISPLAYVALUENO2
        right_field: MEASUREDVALUENO2
        error_field: MEASUREDERRORNO2
        tolerance: 0.2
      - id: monthly_co_flow_error
        label: CO 月度气态流量误差
        left_field: DISPLAYVALUECO
        right_field: MEASUREDVALUECO
        error_field: MEASUREDERRORCO
        tolerance: 0.2
      - id: monthly_o3_flow_error
        label: O3 月度气态流量误差
        left_field: DISPLAYVALUEO3
        right_field: MEASUREDVALUEO3
        error_field: MEASUREDERRORO3
        tolerance: 0.2

  RF_TW_PmFlowCheck:
    range_text_fields:
