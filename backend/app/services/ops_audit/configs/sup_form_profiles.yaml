  # 双周 JG 单点核查（映射文档 L3418-3451：time1/2=蔗糖配制/有效期限、
  # time3/4=上一次/下一次核查日期、string9/15/21=偏差1/2/3）。判据同
  # Sup_RF_OCECSingleCheck 红字"偏差应小于±5%"。数据止于 2022-06（沉睡
  # tag），先按同范式建档，数据回归即生效。偏差 ±5% 越界 2/69=2.9%，抽检均真实。
  Sup_RF_OCECJGSingleCheck:
    display_name: OCEC 双周单点核查记录（JG）
    category: week_check
    cycle: biweek
    max_fill_lag_days: 14
    range_columns:
      - column: string9
        label: 单点核查偏差 1
        min: -5
        max: 5
        unit: "%"
        confirmed: false
      - column: string15
        label: 单点核查偏差 2
        min: -5
        max: 5
        unit: "%"
        confirmed: false
      - column: string21
        label: 单点核查偏差 3
        min: -5
        max: 5
        unit: "%"
        confirmed: false
    date_columns:
      - start: time1
        end: time2
        label: 标准蔗糖溶液有效期
        must_cover_checkdate: true
        confirmed: true
      - start: time3
        end: time4
        label: 仪器核查有效期（上一次/下一次核查日期）
        must_cover_checkdate: true
        confirmed: false

  # 单颗粒质谱月度流量核查（映射文档 L1639-1673，与 DeviceFlowCheck 同构）。
  # 公式复算 9+5 行 max|Δ|=0.0006；偏差 ±5% 越界 0（实测 max 4.6）；双有效期
  # 过期 0（保护型）。文档"示值误差≤±2%"宽表投影无对应列不落。数据止于 2022-06。
  Sup_RF_MSFlowCheck:
    display_name: 单颗粒质谱月度流量核查记录
    category: month_check
    cycle: month
    max_fill_lag_days: 10
    formula_columns:
      - target: string13
        expression: "{string12}*{string6}+{string7}"
        inputs: [string12, string6, string7]
        label: 校准前已修正标准值（直接读取×斜率+截距）
        tolerance: 0.02
        tolerance_mode: absolute
        confirmed: true
      - target: string18
        expression: "{string17}*{string6}+{string7}"
        inputs: [string17, string6, string7]
        label: 校准后已修正标准值（直接读取×斜率+截距）
        tolerance: 0.02
        tolerance_mode: absolute
        skip_if_inputs_zero: true
        confirmed: true
    range_columns:
      - column: string14
        label: 校准前流量偏差
        min: -5
        max: 5
        unit: "%"
        confirmed: false
      - column: string19
        label: 校准后流量偏差
        min: -5
        max: 5
        unit: "%"
        confirmed: false
    date_columns:
      - start: time1
        end: time2
        label: 质谱校准有效期
        must_cover_checkdate: true
        confirmed: true
      - start: time3
        end: time4
        label: 参考流量计校准有效期
        must_cover_checkdate: true
        confirmed: true

