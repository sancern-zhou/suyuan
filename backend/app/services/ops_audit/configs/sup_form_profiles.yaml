# 组分站表单档案（sup_rf_common 通用宽表 + sup_rf_* 专用分表，按 ruleitemtag 建档）
#
# 依据：projects/guangdong/docs/sup-station-audit-phase2-plan.md（二期计划）、
# docs/sup-audit-cases/ 18 条人工排查案例、projects/guangdong/docs/sup-instrument-rules/
# （2026-10-27《组分仪器工单规则》22 类仪器文档转录与阈值）、
# tag-inventory.md（2026-10-27 全分表 tag 盘点，backend/scripts/sup_tag_inventory.py）。
# sup_rf_common 列名沿用通用命名（string1..string150 / bool_1..bool_50 /
# time1..time4 / remark*），语义必须按 ruleitemtag 逐类型维护；专用分表
# （deviceflowcheck / ambienttemperature / pm1monitorinspection 等）为语义化列名。
#
# 标注约定：
# - confirmed: false 表示阈值/列语义来自数据推断与案例反推，待业务确认后置 true；
#   文档红字明确且列语义已验证的可置 true；
# - enabled: false 可按类型停用全部规则；
# - range_columns 支持 expression+inputs（计算型区间，如 温度示值误差=读数-标准值）；
# - formula_columns 支持 skip_if_inputs_zero（0 填充占位行跳过复算）；
# - date_columns 的 single_date_rule 支持 not_future / not_past；
# - abnormal_columns 声明异常取值（SUP_ABNORMAL_NO_REMARK：命中且无备注即问题）；
# - attachments.class 取值：report（报告/证明文档）、data_file（质控数据文件）；
# - 命中率口径：近 90 天本地库，附件要求的类型命中率 <5% 才纳入（避免把行业
#   常态误报为问题），PDLIYearCheck 报告要求命中 ~17% 且带备注豁免。

defaults:
  # 表单备注出现这些关键词时，跳过必需附件要求（如"无需送检"年检表单）。
  attachment_exemption_keywords: ["无需送检", "无需检定", "不适用", "无此项", "未配置", "停运"]
  # 视觉水印试点（阶段 2.3）：抽检+问题触发模式，不做全量以控制视觉调用成本。
  # - sample_rate: 无其他问题的工单按工单号稳定哈希抽样比例；
  # - trigger_rule_prefixes: 工单已被这些前缀规则命中时，照片全检（问题触发）；
  # - max_tasks_per_run / max_photos_per_order: 调用量硬顶（可用环境变量覆盖）。
  watermark_pilot:
    enabled: true
    sample_rate: 0.3
    trigger_rule_prefixes: ["SUP_", "RF_"]
    max_tasks_per_run: 20
    max_photos_per_order: 2
    distance_km_threshold: 5
  # 及时性计划口径（阶段 2.4）：sup_mtc_taskitem.planfinishtime 为周期任务计划完成日；
  # 表单创建晚于计划完成日超过 plan_late_grace_days 天判"填写不及时"。
  # 全局分布：~87% 当天完成、≤4 天占 96.6%，宽限 5 天为试点值（待业务确认）。
  timeliness:
    plan_late_grace_days: 5
  attachment_classes:
    report:
      extensions: [".pdf", ".doc", ".docx", ".rtf"]
      filename_keywords: ["报告", "检定证书", "校准证书", "证书", "report"]
      description: 维护/检定/校准报告或证书文档
    data_file:
      extensions: [".xls", ".xlsx", ".csv", ".doc", ".docx", ".pdf"]
      filename_keywords: ["质控", "数据", "记录表"]
      description: 质控/核查数据文件

