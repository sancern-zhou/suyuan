        remark_column: remark1
        confirmed: true
    date_columns:
      - start: gasexpirationdate
        label: 标气有效期
        single_date_rule: not_past
        confirmed: true

  # ── 浊度仪族（sup_rf_turbidimeter 分表，Week14/Month7/Quarter2/HalfYear1）──
