  # ── BC 监测仪巡检族（sup_rf_monitorinspection 单物理表三周期共用）──────────
  # pollutanttype 全量=BC 单仪器（Week 1262/Month 320/Quarter 92）；多品牌共用
  # 同一套勾选列、语义品牌无关。方向全量实证：0=正常/是，1=异常/否（各 tag
  # 99%+ 全 0，全部 1 值行均带停电报备等说明备注，与 PM1 Week 变体同方向）。
