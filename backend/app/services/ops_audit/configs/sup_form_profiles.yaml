        max: 10
        unit: "%"
        remark_column: [otherremarks, faultdescription]
        confirmed: true
      - column: sp450difference
        label: 跨度核查差值百分比（450nm）
        min: -10
        max: 10
        unit: "%"
        remark_column: [otherremarks, faultdescription]
        confirmed: true

  # 季度/半年表：仅 3 项检查勾选且样本 2/1 行、勾选全 0 无区分度——
  # 只建及时性骨架，样本积累后再补内容规则。
  Sup_RF_Turbidimeter_Quarter:
    display_name: 浊度仪季度记录
    category: quarter_check
    cycle: quarter
    max_fill_lag_days: 31

  Sup_RF_Turbidimeter_HalfYear:
    display_name: 浊度仪半年记录
    category: halfyear_check
    cycle: halfyear
    max_fill_lag_days: 45

  # ── CO2 / 温室气体族（sup_rf_co2* 分表）──────────────────────────────────
  # CO2 季度多点线性校准：判据 r>0.999、0.95≤b≤1.05、|a|≤1%×满量程（满量程
  # 12/13 行 1000ppm→±10ppm 对称带）。checkdate 全 NULL，及时性仅计划口径。
