  # 误差≤10%"。修正流量公式经 11+2+2 行全量复算验证（max Δ0.046，tolerance
  # 0.05）；误差列不做公式复算（1 行实填 5.39% 系运营丢负号，符号口径不一），
  # 用 ±10% 区间兜底幅值。7/18 行流量区整组 '/'（仅做泄漏核查）parse 跳过不误报。
  Sup_RF_LeakageRateCalibration_i:
    display_name: 重金属仪月度泄漏率与流量核查记录
    category: month_check
    cycle: month
    max_fill_lag_days: 10
    required_value_columns:
      - column: leakagerate
        label: 泄漏率核查结果
        remark_column: remarks
    formula_columns:
      - target: correctedflow_16_7
        expression: "{displayflow_16_7}*{flowmeterslope}+{flowmeterintercept}"
        inputs: [displayflow_16_7, flowmeterslope, flowmeterintercept]
        label: 已修正流量 16.7 点（显示值×斜率+截距）
        tolerance: 0.05
        tolerance_mode: absolute
        confirmed: true
      - target: correctedflow_15_0
        expression: "{displayflow_15_0}*{flowmeterslope}+{flowmeterintercept}"
        inputs: [displayflow_15_0, flowmeterslope, flowmeterintercept]
        label: 已修正流量 15.0 点（显示值×斜率+截距）
        tolerance: 0.05
        tolerance_mode: absolute
        confirmed: true
      - target: correctedflow_18_4
        expression: "{displayflow_18_4}*{flowmeterslope}+{flowmeterintercept}"
        inputs: [displayflow_18_4, flowmeterslope, flowmeterintercept]
        label: 已修正流量 18.4 点（显示值×斜率+截距）
        tolerance: 0.05
        tolerance_mode: absolute
        confirmed: true
    range_columns:
      - column: leakagerate
        label: 泄漏率（90Sec）
        max: 150
        unit: mmHg/Min
        remark_column: remarks
        confirmed: true
      - column: samplingflowerror_16_7
