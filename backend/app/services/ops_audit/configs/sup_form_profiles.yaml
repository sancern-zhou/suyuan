    cycle: week
    max_fill_lag_days: 7
    # 2026-11-14 全年验证口径修正：建单晚于计划 6~10 天为周节奏常态（全年
    # 11 命中多为 6~10 天），档案级宽限放宽到 10 天；17 天档真实滞后仍命中。
    plan_late_grace_days: 10
    abnormal_columns:
      - column: dtisitcalibrated
        label: 数据传输
        values: ["1"]
        remark_column: otherremarks
      - column: ipisitcalibrated
        label: 仪器参数
        values: ["1"]
        remark_column: otherremarks
      - column: papertapeisitcalibrated
        label: 纸带
        values: ["1"]
        remark_column: otherremarks

