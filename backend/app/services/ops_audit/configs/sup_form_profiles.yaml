form_profiles:
  # ── 年度维护检定类（问题类①：缺报告/证明附件）───────────────────────────
  Sup_RF_PDLIYearCheck:
    display_name: 激光雷达/颗粒物等非常规仪器年度维护检定记录
    category: year_maintenance
    cycle: year
    max_fill_lag_days: 60
    required_attachments:
      - class: report
        severity: 高
        suggestion: 补充年度预防性维护/检定报告扫描件（仅有过程照片不满足要求）。
    # time1/time2 为送检起止时间（多数与检查日期同日），语义待业务确认后建档。

  # ── 周质控类（问题类④数据文件、⑥日期、②及时性）────────────────────────
  Sup_RF_Week_NMHCQC:
    display_name: 甲烷/非甲烷总烃质控结果每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    stale_data_max_lag_days: 7
    required_attachments:
      - class: data_file
        severity: 高
        suggestion: 补充本周甲烷/非甲烷质控数据文件（Excel），仅零点/跨度照片不满足要求。
    # 视觉水印试点（博罗石下案例：附件照片水印=河源站点）。周质控照片应落在
    # 检查日前 7 天窗口内；地点/坐标与站点比对不一致进人工核验，不直接判失败。
    watermark_check:
      enabled: true
      time_window_days: 7
      confirmed: false
    # 钢瓶标气（time1/time2）：口径存在"生产日期+1年"与"启用日期+1年"两种填法，
    # 区间档位检查会产生系统性误报（真实数据 261~364 天均见），只保留有效期覆盖
    # 检查日期（过期判定）；动态校准仪（time3/time4）校准→有效期档位判定期待业务确认，
    # 案例实证 56 天（8/11→10/6）被人工判定"日期有误"。
    date_columns:
      - start: time1
        end: time2
        label: 标准气钢瓶有效期
        must_cover_checkdate: true
        confirmed: true
      - start: time3
        end: time4
        label: 动态校准仪校准/有效期
        valid_intervals_days: [30, 90, 180, 365]
        interval_tolerance_days: 3
        must_cover_checkdate: true
        confirmed: false

  Sup_RF_WaterSolubleIonsQuality:
    display_name: 气体-气溶胶水溶性离子质控每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    stale_data_max_lag_days: 7
    required_attachments:
      - class: data_file
        severity: 高
        suggestion: 补充水溶性离子质控记录表数据文件；柱压等数值应在数据文件内完整填写并按范围复核。
    range_note: 柱压超范围判定需读取 xlsx 数据文件（同 O3 量值传递 XLS 规则模式），二期扩展。

  Sup_RF_HeavyMetalQuality:
    display_name: 无机元素（重金属）质控每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    stale_data_max_lag_days: 7
    required_attachments:
      - class: data_file
        severity: 高
        suggestion: 补充重金属核查质控记录表数据文件。

  Sup_RF_VocsSinglePoint:
    display_name: VOCs 单点核查每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    stale_data_max_lag_days: 7
    required_attachments:
      - class: data_file
        severity: 高
        suggestion: 补充 VOCs 单点核查质控数据文件。

  Sup_RF_Week_YT_SingleQC:
    display_name: YT 单点质控每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    stale_data_max_lag_days: 7
    required_attachments:
      - class: data_file
        severity: 高
        suggestion: 补充 YT 单点质控数据文件。

  Sup_RF_Week_HONOQC:
    display_name: HONO 质控每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    # 行结构经数据核实（266 行填满行）：每通道行 9 列，尾三列=斜率K/R²/合格
    #（string27/28/29=ch1-550，37/38/39=ch1-600，47/48/49=ch2-550，57/58/59=
    # ch2-600）；既有 string28/string38 实为 ch1 的 550/600 两行，label 已更正，
    # 补 ch2 两行（string48 <0.995 仅 1 条 0.43%、string58 3 条 1.3%）。阈值
    # >0.995 来自《HONO》文档周质控注意栏。
    range_columns:
      - column: string28
        label: 通道1标线R2(ch1-550)
        min: 0.995
        max: 1
        confirmed: false
      - column: string38
        label: 通道1标线R2(ch1-600)
        min: 0.995
        max: 1
        confirmed: false
      - column: string48
        label: 通道2标线R2(ch2-550)
        min: 0.995
        max: 1
        confirmed: false
      - column: string58
        label: 通道2标线R2(ch2-600)
        min: 0.995
        max: 1
        confirmed: false
    stale_data_max_lag_days: 7

  # ── 周巡检/检查类（问题类⑥日期、⑤必填）────────────────────────────────
  Sup_RF_Week_HONOCheck:
    display_name: HONO 分析仪运行状况检查/校准记录（每周）
    category: week_check
    cycle: week
    max_fill_lag_days: 7
    # 案例实证：东莞东城甲醛标准溶液有效期应一个月内（配制日+30 天），
    # 有效区间按 30/31 天档位判定。2026-11-14 数据复核：time1/time2 440/443
    # 行为同日（维护起止时间），"吸收液有效期对"标签存疑，同日跳过保护下
    # 规则近惰性；语义待业务确认（决策项，保留不删）。
    date_columns:
      - start: time1
        end: time2
        label: 维护起止时间（原标注吸收液有效期，语义待业务确认）
        valid_intervals_days: [30, 31]
        interval_tolerance_days: 3
        must_cover_checkdate: true
        confirmed: false
    # string50 循环水浴温度不落数值区间：3407B（Etraninc）自 2026-08 起该列
    # 全部填 "7"（<20 的值均该站，配 string51="1.86ppb" 疑填标液浓度/水位档），
