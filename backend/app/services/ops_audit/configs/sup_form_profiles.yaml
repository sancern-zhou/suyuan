form_profiles:
  # ── 年度维护检定类（问题类①：缺报告/证明附件）───────────────────────────
  Sup_RF_PDLIYearCheck:
    display_name: 激光雷达/颗粒物等非常规仪器年度维护检定记录
    category: year_maintenance
    cycle: year
    max_fill_lag_days: 60
    required_attachments:
      - class: report
        severity: 高
        suggestion: 补充年度预防性维护/检定报告扫描件（仅有过程照片不满足要求）。
    # time1/time2 为送检起止时间（多数与检查日期同日），语义待业务确认后建档。

  # ── 周质控类（问题类④数据文件、⑥日期、②及时性）────────────────────────
  Sup_RF_Week_NMHCQC:
    display_name: 甲烷/非甲烷总烃质控结果每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    stale_data_max_lag_days: 7
    required_attachments:
      - class: data_file
        severity: 高
        suggestion: 补充本周甲烷/非甲烷质控数据文件（Excel），仅零点/跨度照片不满足要求。
    # 视觉水印试点（博罗石下案例：附件照片水印=河源站点）。周质控照片应落在
    # 检查日前 7 天窗口内；地点/坐标与站点比对不一致进人工核验，不直接判失败。
    watermark_check:
      enabled: true
      time_window_days: 7
      confirmed: false
    # 钢瓶标气（time1/time2）：口径存在"生产日期+1年"与"启用日期+1年"两种填法，
    # 区间档位检查会产生系统性误报（真实数据 261~364 天均见），只保留有效期覆盖
    # 检查日期（过期判定）；动态校准仪（time3/time4）校准→有效期档位判定期待业务确认，
    # 案例实证 56 天（8/11→10/6）被人工判定"日期有误"。
    date_columns:
      - start: time1
        end: time2
        label: 标准气钢瓶有效期
        must_cover_checkdate: true
        confirmed: false
      - start: time3
        end: time4
        label: 动态校准仪校准/有效期
        valid_intervals_days: [30, 90, 180, 365]
        interval_tolerance_days: 3
        must_cover_checkdate: true
        confirmed: false

  Sup_RF_WaterSolubleIonsQuality:
    display_name: 气体-气溶胶水溶性离子质控每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    stale_data_max_lag_days: 7
    required_attachments:
      - class: data_file
        severity: 高
        suggestion: 补充水溶性离子质控记录表数据文件；柱压等数值应在数据文件内完整填写并按范围复核。
    range_note: 柱压超范围判定需读取 xlsx 数据文件（同 O3 量值传递 XLS 规则模式），二期扩展。

  Sup_RF_HeavyMetalQuality:
    display_name: 无机元素（重金属）质控每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    stale_data_max_lag_days: 7
    required_attachments:
      - class: data_file
        severity: 高
        suggestion: 补充重金属核查质控记录表数据文件。

  Sup_RF_VocsSinglePoint:
    display_name: VOCs 单点核查每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    stale_data_max_lag_days: 7
    required_attachments:
      - class: data_file
        severity: 高
        suggestion: 补充 VOCs 单点核查质控数据文件。

  Sup_RF_Week_YT_SingleQC:
    display_name: YT 单点质控每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    stale_data_max_lag_days: 7
    required_attachments:
      - class: data_file
        severity: 高
        suggestion: 补充 YT 单点质控数据文件。

  Sup_RF_Week_HONOQC:
    display_name: HONO 质控每周记录
    category: week_qc
    cycle: week
    max_fill_lag_days: 7
    # 两个通道标线相关系数（列语义由近 90 天样本推断，待业务确认）；
    # 阈值 >0.995 来自《HONO》文档周质控注意栏。
    range_columns:
      - column: string28
        label: 通道 1 标线相关系数R2
        min: 0.995
        max: 1
        confirmed: false
      - column: string38
        label: 通道 2 标线相关系数R2
        min: 0.995
        max: 1
        confirmed: false
    stale_data_max_lag_days: 7

  # ── 周巡检/检查类（问题类⑥日期、⑤必填）────────────────────────────────
  Sup_RF_Week_HONOCheck:
    display_name: HONO 分析仪运行状况检查/校准记录（每周）
    category: week_check
    cycle: week
    max_fill_lag_days: 7
    # 案例实证：东莞东城甲醛标准溶液有效期应一个月内（配制日+30 天），
    # 有效区间按 30/31 天档位判定。
    date_columns:
      - start: time1
        end: time2
        label: 吸收液/标准溶液配制与有效期
        valid_intervals_days: [30, 31]
        interval_tolerance_days: 3
        must_cover_checkdate: true
        confirmed: false

  Sup_RF_OCECJGWeekCheck:
    display_name: OCEC 有机碳/元素碳分析仪周巡检记录（升温程序）
    category: week_check
    cycle: week
    max_fill_lag_days: 7
    # 案例实证：升温程序温度偏差按阶段填写，标准 ±10%；
    # 偏差列填绝对温度（如 851.3）被人工判定"温度偏差填写有误"；
    # "/"配说明备注（如内标阶段为降温）为合理豁免。
    range_columns:
      - column: string42
        remark_column: string43
        label: OC 阶段实际升温程序温度偏差
        min: -10
        max: 10
        unit: "%"
        confirmed: false
      - column: string44
        remark_column: string45
        label: EC 阶段实际升温程序温度偏差
        min: -10
        max: 10
        unit: "%"
        confirmed: false
      - column: string46
        remark_column: string47
        label: 内标阶段实际升温程序温度偏差
        min: -10
        max: 10
        unit: "%"
        confirmed: false
    required_value_columns:
      - column: string33
        remark_column: string34
        label: OC 阶段实际炉温
      - column: string35
        remark_column: string36
        label: EC 阶段实际炉温
      - column: string42
        remark_column: string43
        label: OC 阶段升温程序温度偏差
      - column: string44
        remark_column: string45
        label: EC 阶段升温程序温度偏差

  # ── 流量/校准核查类（问题类③公式可复算）────────────────────────────────
  Sup_RF_PANsFlowCheck:
    display_name: PANs 校准仪流量季度检查记录
    category: flow_check
    cycle: quarter
    max_fill_lag_days: 31
    # 案例实证（潮州西园路，工单已退回修改）：设定误差 =（仪器读数-设定值）/设定值×100%；
    # 每个流量点列序为 设定值/仪器读数/流量计读数，案例单三个点的误差均按流量计读数
    # 误算（如点 2 填 0.5%，按仪器读数复算应为 27.7%）。阈值待业务确认。
    formula_columns:
      - target: string16
        expression: "({string14}-{string13})/{string13}*100"
        inputs: [string14, string13]
        label: 流量点 1 设定误差（仪器读数-设定值）
        unit: "%"
        tolerance: 0.5
        tolerance_mode: absolute
        confirmed: false
      - target: string20
        expression: "({string18}-{string17})/{string17}*100"
        inputs: [string18, string17]
        label: 流量点 2 设定误差（仪器读数-设定值）
        unit: "%"
        tolerance: 0.5
        tolerance_mode: absolute
        confirmed: false
      - target: string24
        expression: "({string22}-{string21})/{string21}*100"
        inputs: [string22, string21]
        label: 流量点 3 设定误差（仪器读数-设定值）
        unit: "%"
        tolerance: 0.5
        tolerance_mode: absolute
        confirmed: false
    range_columns:
      - column: string16
        label: 流量点 1 设定误差
        min: -2
        max: 2
        unit: "%"
        confirmed: true
      - column: string20
        label: 流量点 2 设定误差
        min: -2
        max: 2
        unit: "%"
        confirmed: true
      - column: string24
        label: 流量点 3 设定误差
        min: -2
        max: 2
        unit: "%"
        confirmed: true

