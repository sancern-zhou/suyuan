      - {column: wnmisitnormal,   label: WNM 部件,      values: ["1"], remark_column: [wnmremarks, remarks]}
      - {column: itsisitnormal,   label: ITS 部件,      values: ["1"], remark_column: [itsremarks, remarks]}
      - {column: itaaisitnormal,  label: ITAA 部件,     values: ["1"], remark_column: [itaaremarks, remarks]}
      - {column: dfisitnormal,    label: DF 部件,       values: ["1"], remark_column: [dfremarks, remarks]}
      - {column: nsrisitnormal,   label: NSR 部件,      values: ["1"], remark_column: [nsrremarks, remarks]}
      - {column: idcisitnormal,   label: IDC 部件,      values: ["1"], remark_column: [idcremarks, remarks]}
      - {column: dctisitnormal,   label: DCT 部件,      values: ["1"], remark_column: [dctremarks, remarks]}
      - {column: cfisitnormal,    label: CF 部件,       values: ["1"], remark_column: [cfremarks, remarks]}
      - {column: cclisitnormal,   label: CCL 部件,      values: ["1"], remark_column: [cclremarks, remarks]}
      - {column: ircisitnormal,   label: IRC 部件,      values: ["1"], remark_column: [ircremarks, remarks]}
      - {column: cpisitnormal,    label: CP 部件,       values: ["1"], remark_column: [cpremarks, remarks]}

  # CO2 巡检（sup_rf_co2inspection 分表，141 行 / 窗口 4 单）：
  # 文档红字宽区间（站房气压/采样流量/内部温度），全量 141 行仅 7 条越界，
  # 抽检为真实异常。区间宽松（气压 250~1000mmHg 覆盖 731~776 实测），
  # 属低误报风险的"健康检查"型规则。
  Sup_RF_CO2Inspection:
    display_name: CO2 巡检记录
    category: week_check
    cycle: week
    max_fill_lag_days: 7
    range_columns:
      - column: string3
        label: 站房气压
        min: 250
        max: 1000
        unit: mmHg
        confirmed: true
      - column: string4
        label: 采样流量
        min: 0.35
        max: 1.5
        unit: L/min
        confirmed: true
      - column: string5
        label: 内部温度
        min: 8
        max: 47
        unit: ℃
        confirmed: true
      # ── 2026-11-14 扩展（偏移电压/AGC/光室温度/斜率/零点跨度漂移）──────────
      # 全量 141 行 devicebrand 均=TE（赛默飞）；brand_ranges 分档后其他品牌
      # 未来落库自动跳过判定。越界率：string1 2.1%、string2 1.4%、string6 0.7%、
      # string7 0.7%、ldpyppb 0%、kdpy 4.96%（3390B 站连续 2.75 属真实漂移超限），
      # 均 <5% 红线，逐条证据见验证报告。
      - column: string1
        label: 偏移电压
        unit: V
        brand_ranges:
          TE: {min: -130, max: -100}
        remark_column: remark1
        confirmed: true
      - column: string2
        label: AGC强度
        unit: Hz
        brand_ranges:
          TE: {min: 150000, max: 300000}
        remark_column: remark2
        confirmed: true
      - column: string6
        label: 光室温度
        min: 47
        max: 51
        unit: "℃"
        remark_column: remark6
        confirmed: true
      - column: string7
        label: 斜率(Slope)
        min: 0.5
        max: 2.0
        remark_column: remark7
        confirmed: true
      # 零点漂移 ≤±1%F.S. 或 10ppm：双阈值机制不支持，只配 ppm 侧；本站满量程
      # 全为 1000ppm，±1%F.S.=±10ppm 与 ppm 侧等价，无口径损失。
      - column: ldpyppb
        label: 零点漂移
        min: -10
        max: 10
        unit: PPM
        confirmed: true
      # 跨度漂移 ≤±2%F.S. 或 20ppm：kdpy 列原始值带 % 后缀（%F.S. 口径），
      # 满量程 1000ppm 下两分支数值等价，配 % 侧即可。
      - column: kdpy
        label: 跨度漂移
        min: -2
        max: 2
        unit: "%F.S."
        confirmed: true

  # 设备状态检查（sup_rf_equipmentstatus 分表，175 行 / 窗口 8 单）：
  # 同一题号在不同型号下含义不同（GAC 柱流量同款问题）：TiH200 的 string4/5
  # 填蠕动泵流量（0.49~0.52 / 0.22~0.26，与文档区间吻合），Model4050 的 string4
  # 出现 640v/650 等电压值——是另一道题。按品牌分档：Etraninc(TiH200) 落区间，
  # SDL(Model4050) 无档案档位则跳过（不得用错档位判定）。
  Sup_RF_EquipmentStatus:
    display_name: 设备状态检查记录
    category: week_check
    cycle: week
    max_fill_lag_days: 7
    range_columns:
      - column: string4
        label: 蠕动泵1流量
        unit: ml/min
        brand_ranges:
          Etraninc: {min: 0.45, max: 0.55}
      # string5 蠕动泵2流量区间停用（2026-11-14 全年验证）：梅华站恒填 0.2、
      # 莲花山站恒填 0.6（全年 35/35 命中，站点泵管口径与标称档不符），待业务
      # 确认各站泵管规格后再按站点/型号细分档位。
      # - column: string5
      #   label: 蠕动泵2流量
      #   unit: ml/min
      #   brand_ranges:
      #     Etraninc: {min: 0.22, max: 0.26}

  # URG 周维护（sup_rf_urgweekmaintain 分表，81 行 / 窗口 6 单，单一型号 URG9000D）：
  # 只落阳离子柱压（文档 1500~2500psi，实测 1519~1840 基本在位）。
  # anionicwaterpeak1 刻意不落：实测双稳态聚集（0.25 x44 与 0.38 x24），
  # 0.38 组是否属该仪器的正常运行流量需业务确认后定，避免 30% 级别误报。
  Sup_RF_URGWeekMaintain:
    display_name: URG 周维护记录
    category: week_check
    cycle: week
    max_fill_lag_days: 7
    range_columns:
      - column: cationpressureresult
        label: 阳离子柱压
        min: 1500
        max: 2500
        unit: psi
        confirmed: true

  # ══ 2026-11-14 截图规则批次 1 建档（sup_rf_% 专用分表 tag，全部经
  #    "映射文档标签+数据分布"双证后落档；噪音控制八条军规见
  #    projects/guangdong/docs/sup-screenshot-rules-implementation-plan.md；
  #    依据与逐列证据见该方案配套验证报告）════════════════════════════════

  # ── NH3 分析仪族（sup_rf_nh3* 分表）─────────────────────────────────────
  # NH3 转化率测试：文档红框 NO2平均≥96%、NH3效率≥85%、与上次偏差±10%。
  # NO2 转换效率公式经 37/37 行复算双证（35 行偏差≤0.72pp 属舍入级，2 个粗差为
  # 整单 O3开/关列错位）；tolerance 取 3pp 使单规则命中率 ≤2.7%（5% 红线内）。
  # NH3 效率公式与文档口径系统性不符（数据实填 Cc/Ct×100，差 100% 基线），不落。
  Sup_RF_NH3ConversionRate:
    display_name: NH3 分析仪转化率检查记录
    category: month_check
    cycle: month
    max_fill_lag_days: 31
    formula_columns:
      - target: zhxl1
        expression: "(({remrow21}-{remrow11})-({origrow21}-{origrow11}))/({origrow11}-{remrow11})*100"
        inputs: [remrow21, remrow11, origrow21, origrow11]
        label: NO2 转换效率第 1 次
        unit: "%"
        tolerance: 3
        tolerance_mode: absolute
        confirmed: false
      - target: zhxl2
        expression: "(({remrow22}-{remrow12})-({origrow22}-{origrow12}))/({origrow12}-{remrow12})*100"
        inputs: [remrow22, remrow12, origrow22, origrow12]
        label: NO2 转换效率第 2 次
        unit: "%"
        tolerance: 3
        tolerance_mode: absolute
        confirmed: false
      - target: zhxl3
        expression: "(({remrow23}-{remrow13})-({origrow23}-{origrow13}))/({origrow13}-{remrow13})*100"
        inputs: [remrow23, remrow13, origrow23, origrow13]
        label: NO2 转换效率第 3 次
        unit: "%"
        tolerance: 3
        tolerance_mode: absolute
        confirmed: false
    range_columns:
      - column: bjzh
        label: NO2 平均转换效率
        min: 96
        unit: "%"
        confirmed: true
      - column: nh3zhxl20
        label: NH3 转化效率（20%浓度点）
        min: 85
        unit: "%"
        confirmed: true
      - column: nh3zhxl40
        label: NH3 转化效率（40%浓度点）
        min: 85
        unit: "%"
        confirmed: true
      - column: nh3zhxl80
        label: NH3 转化效率（80%浓度点）
        min: 85
        unit: "%"
        confirmed: true
      - column: ysczhxlpc20
        label: 与上次转化效率偏差（20%浓度点）
        min: -10
        max: 10
        unit: "%"
        confirmed: true
      - column: ysczhxlpc40
        label: 与上次转化效率偏差（40%浓度点）
        min: -10
        max: 10
        unit: "%"
        confirmed: true
      - column: ysczhxlpc80
        label: 与上次转化效率偏差（80%浓度点）
        min: -10
        max: 10
        unit: "%"
        confirmed: true

  # NH3 季度多点校准：红字 0.95≤斜率≤1.05、r>0.999、截距≤±1%满量程。
  # 截距按表达式 {ju}/{ppb}*100 归一 %FS（满量程列实填 200/500PPB），
  # 越界 2/16=12.5% 超 5% 红线，remark_column 联动降级（抽检 2 条均真实越界
  # 且校准结果列标"合格"）。标气有效期过期 1 条为应捕捉的真实问题。
  Sup_RF_NH3DeviceMultipoint:
    display_name: NH3 设备多点校准记录
    category: quarter_check
    cycle: quarter
    max_fill_lag_days: 31
    range_columns:
      - column: xl
        label: 校准曲线斜率b
        min: 0.95
        max: 1.05
        remark_column: remark1
        confirmed: true
      - column: xgxs
        label: 校准曲线相关系数r
        min: 0.999
        max: 1
        remark_column: remark1
        confirmed: true
      - label: 校准曲线截距a（占满量程%）
        expression: "{ju}/{ppb}*100"
        inputs: [ju, ppb]
        min: -1
        max: 1
        unit: "%FS"
        remark_column: remark1
        confirmed: false
    date_columns:
      - start: gasexpirationdate
        label: 标气有效期
        single_date_rule: not_past
        confirmed: true

  # NH3 季度动态校准仪核查：红字 r>0.999、0.99≤b≤1.01、|截距|≤±1%×满量程。
  # 两组曲线 0-10 L/min（1%FS=±0.1）与 0-100 ml/min（1%FS=±1）。
  # jua1（L/min 截距）越界 2/16=12.5% 且该表无备注列无降级路径 → 不落待业务确认。
  Sup_RF_NH3GASEOUSCALIDEVICECHECK:
    display_name: NH3 气体校准设备检查记录
    category: quarter_check
    cycle: quarter
    max_fill_lag_days: 31
    range_columns:
      - column: xlb1
        label: L/min 曲线斜率b1
        min: 0.99
        max: 1.01
        confirmed: true
      - column: xgxsr1
        label: L/min 曲线相关系数r1
        min: 0.999
        max: 1
        confirmed: true
      - column: xlb2
        label: ml/min 曲线斜率b2
        min: 0.99
        max: 1.01
        confirmed: true
      - column: xgxsr2
        label: ml/min 曲线相关系数r2
        min: 0.999
        max: 1
        confirmed: true
      - column: jua2
        label: ml/min 曲线截距a2（±1%×100ml/min 满量程）
        min: -1
        max: 1
        unit: ml/min
        confirmed: true

  # NH3 半年巡查：红字"填写参数需在范围内，否则需备注"，逐参数 *abnormalr
  # 列经数据证实为对应参数备注列（站点自设值自动降级）。ectcheckvalue（外部
  # 转换器 725-775）越界 14.3% 且有站点自设先例 → 不落待业务确认；零跨漂移
  # 数据全空+双阈值二选一需新机制 → 不落。
  Sup_RF_NH3AnalyzerInspection_HalfYear:
    display_name: NH3 分析仪半年巡检记录
    category: halfyear_check
    cycle: halfyear
    max_fill_lag_days: 45
    range_columns:
      - column: itcheckvalue
        label: 内部温度
        min: 15
        max: 45
        unit: "℃"
        remark_column: itabnormalr
        confirmed: true
      - column: trccheckvalue
        label: 反应室温度
        min: 48
        max: 52
        unit: "℃"
        remark_column: trcabnormalr
        confirmed: true
      - column: ctcheckvalue
        label: 毛细管温度
        min: 48
        max: 52
        unit: "℃"
        remark_column: ctabnormalr
        confirmed: true
      - column: cootcheckvalue
        label: 制冷器温度
        min: -12
        max: -1.0
        unit: "℃"
        remark_column: cootabnormalr
        confirmed: true
      - column: contcheckvalue
        label: 转换炉温度
        min: 300
        max: 350
        unit: "℃"
        remark_column: contabnormalr
        confirmed: true
      - column: rcpcheckvalue
        label: 反应室压力
        min: 50
        max: 150
        unit: mmHg
        remark_column: rcpabnormalr
        confirmed: true
      - column: flowcheckvalue
        label: 流量
        min: 0.35
        max: 0.9
        unit: L/min
        remark_column: flowabnormalr
        confirmed: true
      - column: oflowcheckvalue
        label: 臭氧流量
        min: 0.05
        unit: L/min
        remark_column: oflowabnormalr
        confirmed: true
      - column: slopeb
        label: 多点线性校准斜率b
        min: 0.95
        max: 1.05
        remark_column: otherremarks
        confirmed: true
      - column: coefficientr
        label: 多点线性校准相关系数r
        min: 0.999
        max: 1
        remark_column: otherremarks
        confirmed: true

  # NH3 年度精密度/正确度：红字"结果在±5%以内"（样本仅 2 行，双证一致）。
  Sup_RF_NH3InstrumentPrecision:
    display_name: NH3 仪器精密度记录
    category: year_check
    cycle: year
    max_fill_lag_days: 60
    range_columns:
      - column: accuracy
        label: 正确度
        min: -5
        max: 5
        unit: "%"
        confirmed: true
      - column: rsd
        label: 相对标准偏差
        min: 0
        max: 5
        unit: "%"
        confirmed: true
    formula_columns:
      - target: instrumentresponseavg
        expression: "({instrumentresponsevalues1}+{instrumentresponsevalues2}+{instrumentresponsevalues3}+{instrumentresponsevalues4}+{instrumentresponsevalues5}+{instrumentresponsevalues6})/6"
        inputs: [instrumentresponsevalues1, instrumentresponsevalues2, instrumentresponsevalues3, instrumentresponsevalues4, instrumentresponsevalues5, instrumentresponsevalues6]
        label: 仪器响应均值（6 次平均）
        tolerance: 0.05
        tolerance_mode: absolute
        confirmed: true
    date_columns:
      - start: gasexpirationdate
        label: 标气有效期
        single_date_rule: not_past
        confirmed: true

  # NH3 月度维护：5 项维护时间列（datetime1~5，34/34 填充，必填兜底）。
  # checkdate 全 NULL，及时性仅质控计划口径可判；"维护时间与照片一致"
