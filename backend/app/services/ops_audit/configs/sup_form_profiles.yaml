      - {column: weekzeropointtest, label: 零点测试, values: ["1"],
         remark_column: [weekdcremarks, weekaremarks, weekdbremarks, weekzptremarks, weekstremarks, otherremarks]}
      - {column: weekstabilitytest, label: 稳定性测试, values: ["1"],
         remark_column: [weekdcremarks, weekaremarks, weekdbremarks, weekzptremarks, weekstremarks, otherremarks]}

