  # CO2 巡检（sup_rf_co2inspection 分表，141 行 / 窗口 4 单）：
  # 文档红字宽区间（站房气压/采样流量/内部温度），全量 141 行仅 7 条越界，
  # 抽检为真实异常。区间宽松（气压 250~1000mmHg 覆盖 731~776 实测），
  # 属低误报风险的"健康检查"型规则。
  Sup_RF_CO2Inspection:
    display_name: CO2 巡检记录
    category: week_check
    cycle: week
    max_fill_lag_days: 7
    range_columns:
      - column: string3
        label: 站房气压
        min: 250
        max: 1000
        unit: mmHg
        confirmed: true
      - column: string4
        label: 采样流量
        min: 0.35
        max: 1.5
        unit: L/min
        confirmed: true
      - column: string5
        label: 内部温度
        min: 8
        max: 47
        unit: ℃
        confirmed: true

  # 设备状态检查（sup_rf_equipmentstatus 分表，175 行 / 窗口 8 单）：
  # 同一题号在不同型号下含义不同（GAC 柱流量同款问题）：TiH200 的 string4/5
  # 填蠕动泵流量（0.49~0.52 / 0.22~0.26，与文档区间吻合），Model4050 的 string4
  # 出现 640v/650 等电压值——是另一道题。按品牌分档：Etraninc(TiH200) 落区间，
  # SDL(Model4050) 无档案档位则跳过（不得用错档位判定）。
  Sup_RF_EquipmentStatus:
    display_name: 设备状态检查记录
    category: week_check
    cycle: week
    max_fill_lag_days: 7
    range_columns:
      - column: string4
        label: 蠕动泵1流量
        unit: ml/min
        brand_ranges:
          Etraninc: {min: 0.45, max: 0.55}
      - column: string5
        label: 蠕动泵2流量
        unit: ml/min
        brand_ranges:
          Etraninc: {min: 0.22, max: 0.26}

  # URG 周维护（sup_rf_urgweekmaintain 分表，81 行 / 窗口 6 单，单一型号 URG9000D）：
  # 只落阳离子柱压（文档 1500~2500psi，实测 1519~1840 基本在位）。
  # anionicwaterpeak1 刻意不落：实测双稳态聚集（0.25 x44 与 0.38 x24），
  # 0.38 组是否属该仪器的正常运行流量需业务确认后定，避免 30% 级别误报。
  Sup_RF_URGWeekMaintain:
    display_name: URG 周维护记录
    category: week_check
    cycle: week
    max_fill_lag_days: 7
    range_columns:
      - column: cationpressureresult
        label: 阳离子柱压
        min: 1500
        max: 2500
        unit: psi
        confirmed: true
