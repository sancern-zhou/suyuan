  # ── 流量/校准核查类（问题类③公式可复算）────────────────────────────────
  Sup_RF_PANsFlowCheck:
    display_name: PANs 校准仪流量季度检查记录
    category: flow_check
    cycle: quarter
    max_fill_lag_days: 31
    # 案例实证（潮州西园路，工单已退回修改）：设定误差 =（仪器读数-设定值）/设定值×100%；
    # 每个流量点列序为 设定值/仪器读数/流量计读数，案例单三个点的误差均按流量计读数
    # 误算（如点 2 填 0.5%，按仪器读数复算应为 27.7%）。阈值待业务确认。
    formula_columns:
      - target: string16
        expression: "({string14}-{string13})/{string13}*100"
        inputs: [string14, string13]
        label: 流量点 1 设定误差（仪器读数-设定值）
        unit: "%"
        tolerance: 0.5
        tolerance_mode: absolute
        confirmed: false
      - target: string20
        expression: "({string18}-{string17})/{string17}*100"
        inputs: [string18, string17]
        label: 流量点 2 设定误差（仪器读数-设定值）
        unit: "%"
        tolerance: 0.5
        tolerance_mode: absolute
        confirmed: false
      - target: string24
        expression: "({string22}-{string21})/{string21}*100"
        inputs: [string22, string21]
        label: 流量点 3 设定误差（仪器读数-设定值）
        unit: "%"
        tolerance: 0.5
        tolerance_mode: absolute
        confirmed: false
    range_columns:
      - column: string16
        label: 流量点 1 设定误差
        min: -2
        max: 2
        unit: "%"
        confirmed: true
      - column: string20
        label: 流量点 2 设定误差
        min: -2
        max: 2
        unit: "%"
        confirmed: true
      - column: string24
        label: 流量点 3 设定误差
        min: -2
        max: 2
        unit: "%"
        confirmed: true

