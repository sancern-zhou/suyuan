  #      压力填进温度列），属真实填报错误，按超范围命中。
  # 阈值取文档标称区间；实测 231 行仅 11 条越界，抽检逐条确认为真实异常
  # （791.64 LPM、转化炉 325.8℃、压力 780.2mmHg 等），非系统性误报。
  Sup_RF_NH3Calibration: &sup_nh3_calibration_profile
