      - target: string2
        expression: "{string1}*2"
        inputs: [string1]
        label: 检出限=零点噪音×2
        tolerance: 0.01
        tolerance_mode: relative
        skip_if_inputs_zero: true
        confirmed: false
      - target: string3
        expression: "{string2}*1000"
        inputs: [string2]
        label: 检出限换算ppt（浓度×1000）
        tolerance: 0.01
        tolerance_mode: relative
        skip_if_inputs_zero: true
        confirmed: false
