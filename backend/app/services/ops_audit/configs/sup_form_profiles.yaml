  # ── 水溶性离子（GAC）周维护（sup_rf_gacweekmaintain 分表，2026-11-09 建档）─────
  # 依据：《组分仪器工单规则》颗粒物组分/水溶性离子.docx 题号区间、
  #      opa-source-field-mappings.md cshtml 标签映射、全量 207 行按品牌分档核对。
  #
  # 该表的关键特征：题号区间随**色谱柱规格**不同，而表里没有柱规格字段，
  # 只能用 devicebrand 反推。全量实证：Pengyuchangya/ZF-PKU-GAC 填 2mm 柱口径
  # （柱流量 0.25~0.30、抑制器电流 10~11），TH/TH-GAC-IC3000 填 4mm 柱口径
  # （柱流量 0.5~0.7、抑制器电流 20~30）。若统一按文档 4mm 区间判，
  # 柱流量会误报 110/207（53%）、抑制器电流误报 115/207（56%）——因此必须分档。
  # 分档后全量越界 0 条，确认口径正确。
  #
  # 未落区间的题号与原因：
  # - steamgeneratorresult：文档标 280~320℃，实际整列填 1/0（bool 状态位），
  #   不是温度值，落区间会 100% 误报；
  # - anionpressureresult / cationpressureresult：MPa 与 psi 与数值混填
  #   （1.86 / 1610 / 6.1Mpa 并存），单位口径待业务确认；
  # - anioneluentresult / cationiceluentresult 淋洗液剩余量 %：越界仅 2/207，
  #   且需先确认随时间消耗的低值是否属正常，暂不判定。
  Sup_RF_GACWeekMaintain:
    display_name: 水溶性离子（GAC）周维护记录
    category: week_check
    cycle: week
    max_fill_lag_days: 7
    range_columns:
      - column: anioncolumnresult
        label: 阴离子柱流量
        unit: ml/min
        brand_ranges:
          Pengyuchangya: {min: 0.2, max: 0.35}
          TH: {min: 0.45, max: 0.8}
      - column: cationcolumnresult
        label: 阳离子柱流量
        unit: ml/min
        brand_ranges:
          Pengyuchangya: {min: 0.2, max: 0.35}
          TH: {min: 0.45, max: 0.8}
      - column: anionsuppressorresult
        label: 阴离子抑制器电流
        unit: mA
        brand_ranges:
          Pengyuchangya: {min: 8, max: 30}
          TH: {min: 15, max: 35}
      - column: cationsuppressorresult
        label: 阳离子抑制器电流
        unit: mA
        brand_ranges:
          Pengyuchangya: {min: 8, max: 14}
          TH: {min: 15, max: 35}

  # ── PM1 监测仪巡查（sup_rf_pm1monitorinspection 分表，2026-11-09 建档）───────
  # 依据：《组分仪器工单规则》颗粒物组分/PM1.docx 分周期条目、
  #      opa-source-field-mappings.md 各变体 cshtml 标签、
  #      Vue 头部字段映射（Week 变体）与全量数据分布核对。
  #
  # 【关键：标志位方向】Vue 映射明确写"bool_1 至 bool_3 分别为数据传输、
  # 仪器参数、纸带；true = 原表单 0（是），false = 原表单 1（否）"，
  # 即落库值 **0 = 是/正常，1 = 否/异常**。全量验证一致：Week 变体 2230 行中
  # 2197 行三项全 0，33 行为 1 的工单全部在 otherremarks 填了停运/故障说明。
  # 注意与 Month 变体的 leakwhether 方向相反（该列 87% 为 1，1=不漏气/正常），
  # 因此两变体不能共用 abnormal 方向，分别建档。
  #
  # 三个变体的题目组不同（非同一套列的简单复用）：
  # - Week：数据传输/仪器参数/纸带 3 项（documented + Vue 映射确认）；
  # - Month：校准膜 merror ±5% + 清洗部件/漏气 7 项；
  # - HalfYear：清洗部件 6 项，无 merror 数值。
  # 因此分别建档，Week 与 HalfYear 共用 abnormal_columns 结构但不共用档案。

  # 周巡检：3 项是/否检查 + 其他；文档红字"有异常情况需备注，上传巡检照片"。
  Sup_RF_PM1MonitorInspection_Week:
