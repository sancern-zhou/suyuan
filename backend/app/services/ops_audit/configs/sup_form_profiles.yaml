    # 方向实证（2026-11-14，Month 624 行，Vue 头部映射 0=是/1=否 + 备注）：
    # externalisitclean=1 行备注"清洗切割头/该设备暂时停运调试中/更换纸带"
    #（1=否/需处理）；leakwhether 93% 为 1（1=否-不漏气=正常），0=是-漏气=异常。
    # 命中率：aline 5(0.8%)、ext 31(4.97% 贴线)、sh 8(1.3%)、leak 28(4.5%)，
    # 全部 <5% 红线。不配：insideisitclean 5.13%、idbwhether 8.0%、
