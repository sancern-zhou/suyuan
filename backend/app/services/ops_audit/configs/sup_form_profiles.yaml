    # string3=检出限-ppt(=噪音×2000)、string4=是否合格(是/合格，无"否"正样本
    # 不配 abnormal)。列位由数值关系链 2×/×1000 全样本拟合证实；string1=0 占位
    # 行 36/74 由 skip_if_inputs_zero 跳过；公式抽检命中为真实算术错填（忘×2、
    # 10 倍量级），range 检出限 ≥2ppt 全年 1 行真实超限（红字"检出限≤2ppt"）。
