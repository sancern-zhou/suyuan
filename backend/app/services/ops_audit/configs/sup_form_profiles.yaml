    display_name: BC 监测仪周巡检记录
    category: week_check
    cycle: week
    max_fill_lag_days: 7            # 实证：lag>7 仅 5/1262=0.4%
    # 2026-11-14 全年验证口径修正：周节奏建单晚于计划 6~10 天为常态（9/9
    # 命中），档案级宽限放宽到 10 天。
    plan_late_grace_days: 10
    abnormal_columns:               # 实证：1251/1262 全 0；11 行 1 值全部带停电说明备注
      - {column: weekdatacontrol,  label: 数据传输,  values: ["1"],
         remark_column: [weekdcremarks, weekaremarks, weekdbremarks, weekzptremarks, weekstremarks, otherremarks]}
      - {column: weekattribute,    label: 仪器参数,  values: ["1"],
         remark_column: [weekdcremarks, weekaremarks, weekdbremarks, weekzptremarks, weekstremarks, otherremarks]}
      - {column: weekdewaterbottle, label: 除水汽瓶, values: ["1"],
