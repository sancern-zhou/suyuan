  # ── 通用表单族（2026-10-27 tag 盘点建档，见 docs/sup-instrument-rules/tag-inventory.md）──
  # Sup_RF_DeviceFlowCheck 为 PM1/氨/BC/水溶性离子/重金属共用的采样流量核查表
  # （sup_rf_deviceflowcheck 分表，语义化列名，公式已按样本行验证）；
  # 判据：《组分仪器工单规则》流量核查通用红字——相对误差≤±5%、示值误差≤±2%。
  Sup_RF_DeviceFlowCheck: &sup_device_flow_check_profile
    display_name: 仪器采样流量核查校准记录
    category: flow_check
    cycle: month
    max_fill_lag_days: 31
    formula_columns:
      - target: correctionvalue1
        expression: "{displayvalue1}*{slope1}+{intercept1}"
        inputs: [displayvalue1, slope1, intercept1]
        label: 校准前已修正标准值（显示值×斜率+截距）
        tolerance: 0.02
        tolerance_mode: absolute
        confirmed: true
      - target: error1
        expression: "({correctionvalue1}-{targetvalue1})/{targetvalue1}*100"
        inputs: [correctionvalue1, targetvalue1]
        label: 校准前流量相对误差(%)
        tolerance: 0.05
        tolerance_mode: absolute
        confirmed: true
      - target: correctionvalue2
        expression: "{displayvalue2}*{slope1}+{intercept1}"
        inputs: [displayvalue2, slope1, intercept1]
        label: 校准后已修正标准值（显示值×斜率+截距）
        tolerance: 0.02
        tolerance_mode: absolute
        skip_if_inputs_zero: true
        confirmed: true
      - target: error2
        expression: "({correctionvalue2}-{targetvalue2})/{targetvalue2}*100"
        inputs: [correctionvalue2, targetvalue2]
        label: 校准后流量相对误差(%)
        tolerance: 0.05
        tolerance_mode: absolute
        skip_if_inputs_zero: true
        confirmed: true
    range_columns:
      - column: error1
        label: 校准前流量相对误差
        min: -5
        max: 5
        unit: "%"
        confirmed: true
      - column: indicationerror1
        label: 校准前示值误差
        min: -2
        max: 2
        unit: "%"
        confirmed: true
      - column: error2
        label: 校准后流量相对误差
        min: -5
        max: 5
        unit: "%"
        confirmed: true
      - column: indicationerror2
        label: 校准后示值误差
        min: -2
        max: 2
        unit: "%"
        confirmed: true
    date_columns:
      - start: calibratedateprev1
        end: calibratedatenext1
        label: 参考流量计检定有效期
        must_cover_checkdate: true
        confirmed: true
      - start: calibratedateprev1
        label: 参考流量计上次检定日期
        single_date_rule: not_future
        confirmed: true

  Sup_RF_DeviceFlowCheck_PTRMS: *sup_device_flow_check_profile

  # 温压核查族（sup_rf_ambienttemperature 分表，PM1/重金属/水溶性离子/OCEC/CO2 共用）；
  # 判据：《组分仪器工单规则》温压核查红框——温度误差≤±2℃、气压误差≤±1kPa。
  Sup_RF_AmbientTemperature:
    display_name: 仪器环境温度和压力校准记录
    category: ambient_check
    cycle: month
    max_fill_lag_days: 10
    range_columns:
      - label: 温度示值误差（校准前）
        expression: "({t_r_prevvalue}-{t_r_standard})"
        inputs: [t_r_prevvalue, t_r_standard]
        min: -2
        max: 2
        unit: ℃
        confirmed: true
      - label: 温度示值误差（校准后）
        expression: "({t_r_nextvalue}-{t_r_standard})"
        inputs: [t_r_nextvalue, t_r_standard]
        min: -2
        max: 2
        unit: ℃
        confirmed: true
      - label: 气压示值误差（校准前）
        expression: "({p_r_prevvalue}-{p_r_standard})"
        inputs: [p_r_prevvalue, p_r_standard]
        min: -1
        max: 1
        unit: kPa
        confirmed: true
      - label: 气压示值误差（校准后）
        expression: "({p_r_nextvalue}-{p_r_standard})"
        inputs: [p_r_nextvalue, p_r_standard]
        min: -1
        max: 1
        unit: kPa
        confirmed: true
    date_columns:
      - start: t_prevdate
        end: t_nextdate
        label: 参考温度计校准有效期
        must_cover_checkdate: true
        confirmed: false
      - start: p_prevdate
        end: p_nextdate
        label: 参考气压计校准有效期
        must_cover_checkdate: true
        confirmed: false

  # PM1 月巡查校准膜误差（sup_rf_pm1monitorinspection 分表）；阈值 ±5% 来自《PM1》文档。
