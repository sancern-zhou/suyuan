<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
        #chart-container {
            width: 800px;
            height: 500px;
            padding: 10px;
        }
        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="chart-container">
        <div id="chart"></div>
    </div>
    <script>
        // ECharts配置将通过Playwright注入
        // window.__ECHARTS_OPTION__ 会被设置为完整的ECharts配置
        function initChart() {
            if (!window.__ECHARTS_OPTION__) {
                console.error('No ECharts option provided');
                return;
            }
            
            var chartDom = document.getElementById('chart');
            var myChart = echarts.init(chartDom, null, {
                renderer: 'canvas'
            });
            
            myChart.setOption(window.__ECHARTS_OPTION__);
            
            // 标记渲染完成
            window.__CHART_RENDERED__ = true;
        }
        
        // 等待DOM加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initChart);
        } else {
            initChart();
        }
    </script>
</body>
</html>
