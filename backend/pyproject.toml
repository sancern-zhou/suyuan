[project]
name = "suyuan-backend"
version = "0.1.0"
description = "Atmospheric environment intelligent analysis and decision support backend."
requires-python = ">=3.11,<3.12"
# Runtime dependencies are managed exclusively in requirements.txt (single source of truth).
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "ruff>=0.8.0,<1.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "backend_data_registry",
    "backend_data",
    "data",
    "logs",
    "reports",
    "D:",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "config", "schemas"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "app"]
python_files = ["test_*.py", "*_test.py", "*_spec.py"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: tests that call external services or require full application wiring",
    "slow: tests that are too slow for the default fast feedback loop",
    "browser: tests that require Playwright or a browser runtime",
    "external_api: tests that call third-party or internal network APIs",
]
